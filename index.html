async function viewStudy(examId, num){
  if(S.exam?._mix) S.exam = null;      // 섞어 보기에서 실제 회차로 넘어오면 표식을 지운다
  show("v-study");
  const track=$("#track"), rail=$("#rail");
  if(S.exam?.id !== examId){
    track.innerHTML=""; rail.innerHTML="";
    const {data:ex} = await sb.from("exam_list").select("*").eq("id",examId).single();
    S.exam = ex;
    if(ex && S.subject?.id !== ex.subject_id){
      const {data:sj} = await sb.from("subject_list").select("*").eq("id",ex.subject_id).single();
      S.subject = sj;
    }
    const {data,error} = await sb.from("questions").select("*").eq("exam_id",examId).order("number");
    if(error){ show("v-exams"); return fail($("#exams"),"문항을 불러오지 못했습니다.",esc(error.message)); }
    S.questions = data||[];
    if(!S.questions.length){
      $("#track").innerHTML = `<div class="slide"><div class="sheet-body"><div class="empty"><div class="big">이 회차에 등록된 문항이 없습니다.</div><div>업로더에서 문항을 올려주세요.</div></div></div></div>`;
      $("#ttl").textContent = S.subject?.name||""; $("#sub").textContent = S.exam?.label||"";
      $("#foot").textContent=""; return;
    }
    await loadAnnotations(S.questions.map(q=>q.id));
    build();
  }
  $("#ttl").textContent = S.subject?.name || "";
  $("#sub").textContent = S.exam?.label || "";
  loadPins(S.subject?.id);          /* 즐겨찾기 자료는 화면을 막지 않고 뒤따라 붙는다 */
  const start = num!=null ? S.questions.findIndex(q=>q.number===num)
                          : LS.get(`pos:${examId}`,0);
  jump(Math.max(0, start), false);
}


/* ═══════════════════════════════════════════════
   3.5 섞어 보기 — 랜덤 · 금 / 은 / 동 / 나머지

   등급 기준 (감이 아니라 세어서 매긴다)
     문항마다 "대표 낱말"을 하나 고른 뒤, 그 낱말이
       R = 몇 개 회차에 나왔는지,  C = 전체 몇 문항에 나왔는지 를 센다.
       금   R ≥ 3   세 회차 이상에서 되풀이된 주제
       은   R = 2   두 회차에서 되풀이된 주제
       동   R = 1 이고 C ≥ 2   한 회차 안에서만 여러 문항으로 나온 주제
       나머지  R = 1, C = 1   딱 한 번만 나온 주제
   저장된 회차를 읽어 그때그때 다시 계산하므로,
   회차를 추가하면 다음에 들어올 때 등급이 바뀐다.
   ═══════════════════════════════════════════════ */
/* 한 번에 뽑는 문항 수. 0 이면 그 등급 전체를 다 편다.
   과목마다 문항 수가 크게 다르므로(회차 모음 238문항 vs 6년 합본 1000문항) 과목별로 기억한다. */
const MIX_SIZES = [10, 20, 30, 50, 100, 0];
const mixSizeKey = sid => `mixSize:${sid}`;
const mixSize = sid => {
  const v = LS.get(mixSizeKey(sid), 20);
  return MIX_SIZES.includes(v) ? v : 20;
};
const mixSizeLabel = n => n === 0 ? "전체" : `${n}문항`;
const MIX_LABEL = { random:"🎲 랜덤", gold:"금", silver:"은", bronze:"동", rest:"나머지" };
const MIX_RULE = {
  gold:"세 회차 이상에서 되풀이된 주제", silver:"두 회차에서 되풀이된 주제",
  bronze:"한 회차 안에서 여러 문항으로 나온 주제", rest:"딱 한 번만 나온 주제"
};
const STOP = new Set(["다음","것은","무엇","경우","가장","옳은","틀린","아닌","대한","설명","계산",
  "얼마","이때","구하","때의","중에서","해당","관한","위한","다음중","값은","것을","하는","되는",
  "이란","무엇인가","적합","적절","거리가","고르","구하시오","때에","의해","하기","있는","없는",
  "이상","이하","사용","방법","특징","종류","조건","기준","보기","문제","다음의","얼마인가"]);

function tokens(q){
  const src = ((q.summary || "") + " " + (q.question_text || "").slice(0, 80));
  return [...new Set((src.match(/[가-힣A-Za-z]{2,}/g) || [])
    .map(w => w.replace(/(으로|에서|에는|이다|한다|인가|하면|보다|까지|부터|에게|에서의|에서는)$/, ""))
    .filter(w => w.length >= 2 && !STOP.has(w)))];
}

/* ── 같은 주제끼리 묶기 ──
   앞선 방식은 "그 문항의 낱말 중 가장 여러 회차에 나온 낱말"을 대표로 삼았다.
   그런데 그런 낱말은 "냉동·공기·온도"처럼 아무 문항에나 들어 있는 흔한 말이라
   거의 모든 문항이 R=10 이 되어 800문항 중 793개가 금으로 나왔다. 정반대였다.
   이제는 흔한 말을 버리고, 드문 낱말을 함께 쓰는 문항끼리 묶어 "주제 덩어리"를 만든 뒤
   그 덩어리가 몇 회차(R)·몇 문항(C)에 걸쳐 있는지를 센다. */
function clusterTopics(rows){
  const N = rows.length;
  const toks = rows.map(tokens);
  const df = new Map();
  toks.forEach(ts => ts.forEach(t => df.set(t, (df.get(t) || 0) + 1)));

  const COMMON = Math.max(6, Math.floor(N * 0.05));    // 전체의 5% 넘게 나오면 주제어로 안 씀
  const RARE   = Math.max(2, Math.floor(N * 0.012));   // 이보다 드물면 하나만 겹쳐도 같은 주제
  const keys = toks.map(ts => ts.filter(t => { const d = df.get(t); return d >= 2 && d <= COMMON; }));

  const inv = new Map();
  keys.forEach((ks, i) => ks.forEach(t => { (inv.get(t) || inv.set(t, []).get(t)).push(i); }));

  const pair = new Map(), strong = new Map();
  inv.forEach((list, t) => {
    if(list.length > 40) return;                        // 너무 퍼진 낱말은 쌍 만들기에서 제외(속도)
    const rare = df.get(t) <= RARE;
    for(let a = 0; a < list.length; a++)
      for(let b = a + 1; b < list.length; b++){
        const k = list[a] + "|" + list[b];
        pair.set(k, (pair.get(k) || 0) + 1);
        if(rare) strong.set(k, true);
      }
  });

  const par = [...Array(N).keys()];
  const find = x => par[x] === x ? x : (par[x] = find(par[x]));
  const uni = (a, b) => { a = find(a); b = find(b); if(a !== b) par[b] = a; };
  pair.forEach((n, k) => {
    /* 드문 낱말 2개를 함께 쓰거나, 아주 드문 낱말 하나를 공유하면 같은 주제로 본다 */
    if(n >= 2 || strong.get(k)){ const [a, b] = k.split("|").map(Number); uni(a, b); }
  });

  const groups = new Map();
  for(let i = 0; i < N; i++){ const r = find(i); (groups.get(r) || groups.set(r, []).get(r)).push(i); }

  groups.forEach(idxs => {
    const R = new Set(idxs.map(i => rows[i].exam_id)).size, C = idxs.length;
    const freq = new Map();
    idxs.forEach(i => keys[i].forEach(t => freq.set(t, (freq.get(t) || 0) + 1)));
    const key = [...freq.entries()]
      .sort((a, b) => b[1] - a[1] || (df.get(a[0]) - df.get(b[0])))[0]?.[0] || "";
    const gid = idxs[0];   /* 덩어리 고유 번호 — 이게 없으면 주제 없는 단발 문항들이
                              전부 같은 열쇠("|1|1")로 묶여 한 덩어리가 되어 버린다 */
    idxs.forEach(i => { rows[i]._R = R; rows[i]._C = C; rows[i]._key = key; rows[i]._gid = gid; });
  });
  return rows;
}

/* 과목 전체를 가볍게(요약·문제 앞부분만) 한 번 읽어 등급표를 만든다 */
/* Supabase(PostgREST)는 한 요청에 최대 1000줄만 돌려준다. 그보다 많으면 오류도 없이
   조용히 잘려서, 문항이 1038개여도 화면에는 늘 "1000문항"으로 멈춰 보인다.
   1000줄씩 끝까지 이어 받는다. 페이지가 어긋나지 않게 id 로 정렬해서 받는다. */
async function fetchAllRows(table, cols, apply, page = 1000){
  const out = [];
  for(let from = 0; from < 200000; from += page){
    let q = sb.from(table).select(cols).order("id").range(from, from + page - 1);
    if(apply) q = apply(q);
    const { data, error } = await q;
    if(error) throw error;
    out.push(...(data || []));
    if(!data || data.length < page) break;
  }
  return out;
}

/* ══════════════════════════════════════════════════════
   여러 과목을 한꺼번에 섞어 보기
   ──────────────────────────────────────────────────────
   과목을 여럿 골라 두면 그 과목들의 금·은·동·나머지를 합쳐서 낸다.
   등급은 «과목 안에서» 매긴다 — 공조냉동의 금과 위험물의 금은
   서로 견줄 수 없는 것이고, 합쳐서 다시 줄 세우면 문항이 많은 과목이
   전부 밀어내 버린다. 그래서 각각 매긴 뒤 합치기만 한다.

   고른 과목은 이 기기에 기억해 둔다.
   ══════════════════════════════════════════════════════ */
const PICK_KEY = "mixPick";
const getPick = () => {
  const v = LS.get(PICK_KEY, []);
  return Array.isArray(v) ? v.filter(id => S.subjects.some(s => s.id === id)) : [];
};
const setPick = ids => LS.set(PICK_KEY, ids);

function drawMultiWrapState(){
  const on = getPick().length > 0;
  $("#multiWrap")?.classList.toggle("off", !on);
}

function drawMultiMix(){
  const bar = $("#pickBar"); if(!bar) return;
  const pick = getPick();

  bar.innerHTML = S.subjects.map(s => `
    <button class="pickb${pick.includes(s.id) ? " on" : ""}" data-pick="${s.id}"
      style="--sc:${esc(s.color || "#1D4ED8")}">
      <span class="dotc"></span>${esc(s.name)}
      <span class="qn">${s.question_count ?? 0}</span>
    </button>`).join("")
    + `<button class="pickb pickall" data-pickall>${
        pick.length === S.subjects.length ? "전부 끄기" : "전부 켜기"}</button>`;

  /* 한 번에 뽑을 수 — 섞어 보기 전용으로 따로 기억한다 */
  const sz = $("#multiSize");
  sz.innerHTML = `<span class="lbl">한 번에</span>` + MIX_SIZES.map(n =>
    `<button class="szb${mixSize("multi") === n ? " on" : ""}" data-size="${n}" type="button">${mixSizeLabel(n)}</button>`).join("");
  $$("#multiSize .szb").forEach(b => b.onclick = () => {
    LS.set(mixSizeKey("multi"), +b.dataset.size);
    $$("#multiSize .szb").forEach(x => x.classList.toggle("on", x === b));
    toast(+b.dataset.size === 0 ? "고른 등급의 문항을 전부 폅니다." : `한 번에 ${b.dataset.size}문항씩 뽑습니다.`);
  });

  $$("#pickBar [data-pick]").forEach(b => b.onclick = () => {
    const id = +b.dataset.pick;
    const now = getPick();
    setPick(now.includes(id) ? now.filter(x => x !== id) : [...now, id]);
    drawMultiMix();
  });
  $("#pickBar [data-pickall]").onclick = () => {
    setPick(getPick().length === S.subjects.length ? [] : S.subjects.map(s => s.id));
    drawMultiMix();
  };

  $$("#multiMix .mixb").forEach(b => b.onclick = () => {
    const ids = getPick();
    if(!ids.length) return toast("과목을 하나 이상 골라 주세요.");
    go(`#/mix/${ids.join("+")}/${b.dataset.mode}`);
  });

  $("#pickN").textContent = pick.length ? `${pick.length} / ${S.subjects.length}` : "";
  drawMultiWrapState();
  syncMultiCounts();
  /* 아무것도 안 골랐을 때 무엇을 해야 하는지는 칩 «바로 아래» 가 아니라
     칩 줄 끝에 붙여 준다 — 아래 상자는 흐려져 있어 글이 안 읽힌다. */
  const tip = $("#pickTip");
  if(tip) tip.textContent = pick.length
    ? ""
    : "과목을 눌러 고르세요.";
}

/* 고른 과목들의 등급별 문항 수를 합쳐 단추에 적는다 */
let MC_SEQ = 0;
async function syncMultiCounts(){
  const seq = ++MC_SEQ;
  const ids = getPick();
  const note = $("#multiNote");
  const setC = obj => $$("#multiMix .mixb .c").forEach(el => {
    el.textContent = obj ? (obj[el.dataset.c] ?? 0) + "문항" : "";
  });
  if(!ids.length){
    setC(null);
    if(note) note.textContent = "";
    return;
  }
  setC(null);
  if(note) note.textContent = "고른 과목의 등급을 세는 중…";
  try{
    const parts = await Promise.all(ids.map(id => mixIndex(id, false)));
    if(seq !== MC_SEQ) return;                      /* 그새 다른 걸 골랐으면 버린다 */
    const n = { random:0, gold:0, silver:0, bronze:0, rest:0 };
    let N = 0;
    parts.forEach(ix => {
      n.random += ix.rows.length; N += ix.N;
      ["gold","silver","bronze","rest"].forEach(k => n[k] += (ix.tiers[k] || []).length);
    });
    setC(n);
    const names = ids.map(id => S.subjects.find(s => s.id === id)?.name).filter(Boolean);
    if(note) note.innerHTML =
      `<b>${esc(names.join(" + "))}</b> — 회차 ${N}개 · 문항 ${n.random}개`;
  }catch(e){
    if(seq !== MC_SEQ) return;
    setC(null);
    if(note) note.textContent = "등급을 세지 못했습니다 — " + (e.message || e);
  }
}

async function mixIndex(subjectId, force){
  S._mix ||= {};
  if(S._mix[subjectId] && !force) return S._mix[subjectId];

  const {data:exams} = await sb.from("exam_list").select("id,label,year,session").eq("subject_id", subjectId);
  const ids = (exams || []).map(e => e.id);
  if(!ids.length) return (S._mix[subjectId] = { rows:[], tiers:{}, N:0, label:{} });

  let rows = [];
  try{
    rows = await fetchAllRows("questions", "id,exam_id,number,summary,question_text",
                              q => q.in("exam_id", ids));
  }catch(e){ rows = []; }

  clusterTopics(rows || []);

  /* ── 합격 기여도 점수 ──────────────────────────────────────
     "얼마나 자주 나왔나"만 보면 이미 완벽히 아는 주제도 계속 위로 올라온다.
     실제로 점수를 올려 주는 건  [또 나올 확률] × [지금 내가 약한 정도]  다.

       출제력 = 0.55·빈도(몇 %의 회차에 나왔나)
              + 0.30·최근성(최근 회차일수록 가중, 회차당 0.8배씩 감쇠)
              + 0.15·비중(한 주제에 문항이 몇 개나 걸려 있나)
       약한정도 = 별표 ×1.8 · 아직 안 본 문항 ×1.25 · 이미 본 문항 ×0.85 (최소 0.4)

     이 점수로 줄 세운 뒤, 등급은 개수가 아니라 "점수 총합의 몫"으로 끊는다.
     금 = 전체 기여도의 위 25%를 만들어내는 문항들 → 수는 적고 밀도는 높다.
     기준을 사람이 정하지 않으므로, 회차를 더 넣으면 경계도 알아서 움직인다. */
  const rank = {};                       // 회차 id → 최신이 0
  [...(exams || [])]
    .sort((x, y) => (numOf(y.year) - numOf(x.year)) || (numOf(y.session) - numOf(x.session)))
    .forEach((e, i) => rank[e.id] = i);

  const N = Math.max(1, (exams || []).length);
  const gid = new Map();
  (rows || []).forEach(q => { (gid.get(q._gid) || gid.set(q._gid, []).get(q._gid)).push(q); });

  gid.forEach(pack => {
    const freshest = Math.min(...pack.map(q => rank[q.exam_id] ?? N));
    const exposure = 0.55 * (pack[0]._R / N)
                   + 0.30 * Math.pow(0.8, freshest)
                   + 0.15 * (pack[0]._C / (pack[0]._C + 2));
    pack.forEach(q => {
      let need = 1;
      if(S.stars[q.id]) need *= 1.8;          // 내가 별표한 것 = 아직 안 잡힌 것
      need *= S.seen[q.id] ? 0.85 : 1.25;     // 이미 본 것은 조금 뒤로
      q._exp = exposure;
      q._need = Math.max(0.4, need);
      q._score = exposure * q._need;
    });
  });

  const ordered = [...(rows || [])].sort((a, b) => b._score - a._score);
  const totalScore = ordered.reduce((t, q) => t + q._score, 0) || 1;
  const tiers = { gold:[], silver:[], bronze:[], rest:[] };
  const order = ["gold", "silver", "bronze", "rest"];
  let acc = 0, bucket = 0;
  for(const q of ordered){
    while(bucket < 3 && acc >= totalScore * (bucket + 1) / 4) bucket++;
    q._tier = order[bucket];
    tiers[order[bucket]].push(q);
    acc += q._score;
  }
  const label = {}; (exams||[]).forEach(e => label[e.id] = e.label);
  return (S._mix[subjectId] = { rows: rows || [], tiers, N: ids.length, label });
}

async function viewMix(subjectId, mode){
  show("v-study");
  const track = $("#track"), rail = $("#rail");
  track.innerHTML = `<div class="slide"><div class="sheet-body"><div class="empty"><div class="big">문항을 모으는 중…</div></div></div></div>`;
  rail.innerHTML = ""; mountReroll(null);

  if(!S.subjects.length){
    const {data} = await sb.from("subject_list").select("*").order("sort_order");
    S.subjects = data || [];
  }
  /* subjectId 는 숫자 하나일 수도 있고 여러 개일 수도 있다 (#/mix/1+2/gold) */
  const SIDS = Array.isArray(subjectId) ? subjectId : [subjectId];
  const MULTI = SIDS.length > 1;
  subjectId = SIDS[0];
  S.subject = S.subjects.find(x => x.id === subjectId) || S.subject;

  /* 랜덤은 매번 새로 뽑아야 하므로 캐시를 다시 만든다(회차를 추가했을 때도 바로 반영) */
  const parts = [];
  for(const sid of SIDS) parts.push(await mixIndex(sid, true));
  const ix = { rows:[], tiers:{}, N:0, label:{} };
  parts.forEach(p => {
    ix.rows.push(...p.rows); ix.N += p.N;
    Object.assign(ix.label, p.label);
    Object.keys(p.tiers).forEach(k => (ix.tiers[k] ||= []).push(...p.tiers[k]));
  });
  if(!ix.rows.length){ go(MULTI ? "#/" : `#/s/${subjectId}`); return; }

  const names = SIDS.map(id => S.subjects.find(x => x.id === id)?.name).filter(Boolean);
  const band = mode === "random" ? ix.rows : (ix.tiers[mode] || []);
  let note = (MULTI ? `${names.join(" + ")} · ` : "")
    + (mode === "random"
        ? `${ix.N}개 회차 ${ix.rows.length}문항에서 무작위`
        : `${MIX_LABEL[mode]} · ${MIX_RULE[mode]} — ${band.length}문항`);

  if(!band.length){
    track.innerHTML = `<div class="slide"><div class="sheet-body"><div class="empty">
      <div class="big">${MIX_LABEL[mode]} 등급에 해당하는 문항이 없습니다.</div>
      <div>${esc(MIX_RULE[mode])}가 기준입니다. 회차가 ${ix.N}개뿐이라 아직 안 잡힐 수 있습니다.</div></div></div></div>`;
    $("#ttl").textContent = MULTI ? names.join(" + ") : (S.subject?.name || "");
    $("#sub").textContent = note; $("#foot").textContent = "";
    return;
  }

  const size = mixSize(MULTI ? "multi" : subjectId);
  /* ── 과목을 여럿 골랐을 때는 «고르게» 뽑는다 ──
     그냥 통째로 섞으면 문항이 많은 과목이 자리를 다 차지한다.
     과목별로 따로 섞어 두고 한 개씩 돌아가며 집어 온다. */
  let shuffled;
  if(MULTI){
    const bySid = SIDS.map((sid, i) => {
      const p = parts[i];
      const pool = mode === "random" ? p.rows : (p.tiers[mode] || []);
      return [...pool].sort(() => Math.random() - .5);
    }).filter(a => a.length);
    shuffled = [];
    for(let k = 0; bySid.some(a => a.length); k++)
      bySid.forEach(a => { if(a.length) shuffled.push(a.shift()); });
  }else{
    shuffled = [...band].sort(() => Math.random() - .5);
  }
  const pickIds = (size === 0 ? shuffled : shuffled.slice(0, size)).map(q => q.id);
  note += size === 0 ? ` · 전체 ${pickIds.length}문항` : ` · ${pickIds.length}문항`;
  const meta = new Map(band.map(q => [q.id, q]));
  /* 전체보기는 수백 문항이 될 수 있어 한 번에 다 못 받는다(요청당 1000줄 한도) */
  const full = [];
  for(let i = 0; i < pickIds.length; i += 500){
    const { data } = await sb.from("questions").select("*").in("id", pickIds.slice(i, i + 500));
    full.push(...(data || []));
  }
  const deck = pickIds.map(id => full.find(q => q.id === id)).filter(Boolean);
  if(!deck.length){ go(MULTI ? "#/" : `#/s/${subjectId}`); return; }

  deck.forEach(q => {
    const m = meta.get(q.id) || {};
    const badge = { gold:"금", silver:"은", bronze:"동", rest:"나머지" }[m._tier] || "";
    q.subject_part = `${ix.label[q.exam_id] || "회차"} ${q.number}번`
      + (badge ? ` · ${badge}` : "")
      + (m._key ? ` · ${m._key}` : "")
      + (m._R ? ` (${m._R}/${ix.N}회차 · ${m._C}문항${S.stars[q.id] ? " · 별표" : ""})` : "");
  });

  S.exam = { id:`mix:${SIDS.join("+")}:${mode}`, label:note, _mix:true,
             _sid:SIDS.join("+"), _mode:mode, _multi:MULTI };
  S.questions = deck;
  await loadAnnotations(deck.map(q => q.id));
  loadPins(subjectId);
  build();
  $("#ttl").textContent = MULTI ? names.join(" + ") : (S.subject?.name || "");
  /* 부제는 한 줄에 담기게 짧게. 긴 설명(등급 기준 등)은 눌러서 펼치면 보인다. */
  const shortNote = (MULTI ? `${names.join(" + ")} · ` : "")
    + (mode === "random" ? "무작위" : MIX_LABEL[mode])
    + ` ${deck.length}문항`;
  $("#sub").textContent = shortNote;
  $("#sub").title = `${note} 중 ${deck.length}문항`;
  jump(0, false);
  mountReroll(S.exam);
}

/* 문제 푸는 중에도 바로 다시 뽑을 수 있게 떠 있는 버튼.
   HTML 에 있는 붙박이 버튼의 글자와 동작만 바꾼다. */
function mountReroll(exam){
  const b = document.getElementById("reroll");
  if(!b) return;
  const t = document.getElementById("mixall");
  if(!exam?._mix){
    b.hidden = true; b.onclick = null;
    if(t){ t.hidden = true; t.onclick = null; }
    return;
  }
  b.textContent = `${MIX_LABEL[exam._mode] || "섞기"} 다시 뽑기`;
  const sids = () => String(exam._sid).split("+").map(Number).filter(Boolean);
  b.onclick = () => viewMix(sids(), exam._mode);
  b.hidden = false;

  /* 뽑은 만큼만 볼 것인가, 그 등급을 통째로 볼 것인가.
     한 단추로 오가되 고른 값은 과목에 남겨, 다음에 들어올 때도 같은 모드로 열린다. */
  if(t){
    const SK = exam._multi ? "multi" : exam._sid;      /* 여러 과목은 따로 기억한다 */
    const all = mixSize(SK) === 0;
    t.textContent = all ? `${mixSizeLabel(t.dataset.prev ? +t.dataset.prev : 20)}만 보기` : "문항 전체 보기";
    t.classList.toggle("on", all);
    t.hidden = false;
    t.onclick = () => {
      if(mixSize(SK) === 0){
        LS.set(mixSizeKey(SK), t.dataset.prev ? +t.dataset.prev : 20);
      }else{
        t.dataset.prev = String(mixSize(SK));
        LS.set(mixSizeKey(SK), 0);
      }
      viewMix(sids(), exam._mode);
    };
  }
}

/* ═══════════════════════════════════════════════
   문항 고르기 창
   238문항짜리 합본은 두 줄로 접어도 한참 밀어야 한다.
   번호 배지를 누르면 전체를 격자로 펼쳐, 한눈에 보고 바로 뛴다.
   본 문항·별표·필기가 색으로 구분되니 "어디까지 했더라"도 같이 해결된다.
   ═══════════════════════════════════════════════ */
/* 레일 줄 수 — 기본은 두 줄.
   세로로 채우므로 윗줄이 101·103·105…, 아랫줄이 102·104·106… 으로 갈린다.
   대신 스크롤 길이가 절반이고, 한 칸 위아래가 곧 연속 번호라 위치를 잡기 쉽다.
   한 줄이 편하면 문항 고르기 창에서 끌 수 있다. */
/* 연도·회차 칸에 "2021~2026" 이나 "합본" 같은 글자가 들어와도
   묶고 줄 세울 때는 첫 숫자만 본다. 숫자가 없으면 0. */
const numOf = v => { const m = String(v ?? "").match(/\d+/); return m ? +m[0] : 0; };

const railTwo = () => LS.get("railTwo", 1) === 1;
function applyRailRows(){
  const rail = $("#rail"); if(!rail) return;
  rail.classList.toggle("two", railTwo() && S.questions.length > 40);
  sizeCols();
}

/* 2단 배치에서 각 칸이 쓸 수 있는 실제 높이를 재서 --colh 로 넘긴다.
   dvh 로 계산하면 태블릿 주소창이 접혔다 펴질 때마다 어긋나서, 화면 밖으로 밀려난
   해설 아랫부분에 손이 닿지 않는 일이 생긴다. 재서 넣으면 그런 일이 없다. */
function sizeCols(){
  const track = $("#track");
  if(!track) return;
  const h = track.clientHeight || 0;
  if(h < 120) return;
  const qh = document.querySelector(".qhead")?.offsetHeight || 52;
  document.documentElement.style.setProperty("--colh", Math.max(240, h - qh - 28) + "px");
}
addEventListener("resize", sizeCols);
addEventListener("orientationchange", () => setTimeout(sizeCols, 250));
window.visualViewport?.addEventListener("resize", sizeCols);

        <b>연도</b>는 목록을 묶는 제목 줄, <b>회차</b>는 왼쪽 <b>동그란 배지</b>에 그대로 나옵니다
        (숫자만 적으면 «3» → «3회»).<br>

function needLoginPop(){

}

function jumpGridClose(){ document.getElementById("jumpOv")?.remove(); }

function jumpGridOpen(){
  jumpGridClose();
  if(!S.questions.length) return;
  const ov = document.createElement("div");
  ov.className = "jumpov on"; ov.id = "jumpOv";

  /* 20개씩 묶어 구간 머리글을 달아 준다 — 번호가 200을 넘으면 눈이 길을 잃는다 */
  const CH = 20;
  let body = "";
  for(let s0 = 0; s0 < S.questions.length; s0 += CH){
    const part = S.questions.slice(s0, s0 + CH);
    body += `<div class="jsec"><div class="jhead">${part[0].number} – ${part[part.length-1].number}</div>
      <div class="jgrid">` + part.map((q, k) => {
        const i = s0 + k;
        const cls = [
          i === S.idx ? "now" : "",
          S.seen[q.id] ? "seen" : "",
          S.stars[q.id] ? "star" : "",
          S.anno[q.id]?.strokes?.length ? "ink" : ""
        ].filter(Boolean).join(" ");
        return `<button class="jb ${cls}" data-i="${i}">${q.number}</button>`;
      }).join("") + `</div></div>`;
  }

  const seen = S.questions.filter(q => S.seen[q.id]).length;
  const star = S.questions.filter(q => S.stars[q.id]).length;
  ov.innerHTML = `<div class="jumpbox">
    <div class="jtop">
      <b>문항 고르기</b>
      <span class="jstat">${S.questions.length}문항 · 본 것 ${seen} · 별표 ${star}</span>
      <button class="figbtn" data-jclose type="button">닫기</button>
    </div>
    <div class="jfind">
      <input id="jumpNum" type="number" inputmode="numeric" placeholder="번호 입력 후 Enter">
      <button class="figbtn save" data-jgo type="button">가기</button>
      <span class="jlegend"><i class="star"></i>별표 <i class="ink"></i>필기 <i class="seen"></i>본 것</span>
      <label class="jrow2"><input type="checkbox" id="jRow2"> 번호줄 두 줄 (끄면 한 줄)</label>
    </div>
    <div class="jbody">${body}</div>
  </div>`;
  document.body.appendChild(ov);

  ov.querySelector("[data-jclose]").onclick = jumpGridClose;
  ov.addEventListener("click", e => { if(e.target === ov) jumpGridClose(); });
  ov.querySelectorAll(".jb").forEach(b => b.onclick = () => { jumpGridClose(); jump(+b.dataset.i); });

  const go = () => {
    const n = +document.getElementById("jumpNum").value;
    const i = S.questions.findIndex(q => +q.number === n);
    if(i < 0) return toast(`${n}번을 찾지 못했습니다.`);
    jumpGridClose(); jump(i);
  };
  ov.querySelector("[data-jgo]").onclick = go;
  const r2 = document.getElementById("jRow2");
  r2.checked = railTwo();
  r2.onchange = () => { LS.set("railTwo", r2.checked ? 1 : 0); applyRailRows(); };
  const inp = document.getElementById("jumpNum");
  inp.addEventListener("keydown", e => { if(e.key === "Enter"){ e.preventDefault(); go(); } });

  /* 지금 문항이 화면 가운데 오게 */
  ov.querySelector(".jb.now")?.scrollIntoView({ block:"center" });
}

function build(){
  const track=$("#track"), rail=$("#rail");
  /* 10문항마다 세로 칸막이를 끼워 넣는다. 두 줄일 때는 두 줄을 가로질러 그어져
     "여기까지 10개" 가 한눈에 잡힌다. 50단위는 더 진하게 그어 큰 눈금으로 쓴다. */
  rail.innerHTML = S.questions.map((q,i)=>{
    const cls = [
      S.seen[q.id] ? "seen" : "",
      S.stars[q.id] ? "star" : "",
      S.anno[q.id]?.strokes?.length ? "ink" : "",
      (+q.number % 10 === 0) ? "tick" : ""
    ].filter(Boolean).join(" ");
    const bub = `<button class="bub ${cls}" data-i="${i}">${q.number}</button>`;
    const last = i === S.questions.length - 1;
    const edge = (+q.number % 10 === 0) && !last;
    return bub + (edge ? `<span class="sep${+q.number % 50 === 0 ? " big" : ""}"
      ${+q.number % 50 === 0 ? `data-n="${q.number}"` : ""}></span>` : "");
  }).join("");
  $$("#rail .bub").forEach(b=>b.onclick=()=>jump(+b.dataset.i));
  /* 가장 큰 번호의 자릿수로 동그라미 폭을 정한다 (2자리 30px, 3자리 38px, 4자리 46px) */
  const digits = String(Math.max(...S.questions.map(q => +q.number || 0), 0)).length;
  rail.style.setProperty("--bubw", (digits <= 2 ? 30 : digits === 3 ? 38 : 46) + "px");
  applyRailRows();

  track.innerHTML = S.questions.map((q,i)=>`
    <article class="slide" data-i="${i}"><div class="sheet-body" data-h="0"></div></article>`).join("");
  applyVeil();
  applyLayout(false);

  const io = new IntersectionObserver(es=>{
    es.forEach(e=>{ if(e.isIntersecting && e.intersectionRatio>.55) setActive(+e.target.dataset.i); });
  },{root:track,threshold:[.55]});
  $$("#track .slide").forEach(s=>io.observe(s));
}

/* 저장된 그림 크기(%). 없거나 이상하면 예전 그대로 100% */

/* 문항 화면(qhead 뒤에 오는 카드+해설)의 HTML. 필기 없는 문항은 이 그대로가 최종 렌더링이다 */
function cardHTML(q){

    </div>`).join("");

  const expInner = q.explanation_html
    ? `<div class="sheet-host">${q.explanation_html}</div>`
    : md(q.explanation_md || "");

  return `
    <div class="splitcols">
    <div class="qcard">
      ${q.subject_part?`<div class="part">${esc(q.subject_part)}</div>`:""}
      <div class="qtext" data-hl="q" data-qid="${q.id}">${md(stripQNo(q.question_text)).replace(/^<p>|<\/p>$/g,"")}</div>

        <img src="${esc(q.figure_url)}" alt="${esc(q.figure_note||"문제 그림")}" loading="lazy" decoding="async">
        ${q.figure_note?`<figcaption>${esc(q.figure_note)}</figcaption>`:""}
      </figure>`:""}
      ${S.loggedIn?`<div class="figbar">
        <button class="figbtn" data-edittext="${q.id}" type="button">본문 고치기</button>
        <button class="figbtn" data-figadd="${q.id}" type="button">${q.figure_url?"그림 바꾸기":"+ 그림 추가"}</button>
        ${q.figure_url?`<button class="figbtn del" data-figdel="${q.id}" type="button">그림 삭제</button>`:""}
        <span class="pastebox mini" data-pasteq="${q.id}" tabindex="0" role="button"
             aria-label="여기를 누르고 Ctrl+V 로 그림 붙여넣기"><b>Ctrl+V</b> · 끌어다 놓기</span>
        ${q.figure_url?`<div class="figsize" data-figsize="${q.id}">
          <span class="figlbl">크기</span>
          <input type="range" min="20" max="100" step="5" value="${figW(q)}" aria-label="그림 크기">
          <span class="figpct">${figW(q)}%</span>
          <button class="figbtn save" type="button" disabled>저장</button>
        </div>`:""}
      </div>`:""}
      ${chs?`<div class="choices">${chs}</div>`:""}
    </div>
    ${(expInner||q.answer)?`
    <div class="answer">
      <button class="cover" type="button">
        <svg viewBox="0 0 24 24"><path d="M3 3l18 18M10.6 10.6a3 3 0 004.2 4.2"/><path d="M9.4 5.2A9.6 9.6 0 0112 5c6.4 0 10 7 10 7a17 17 0 01-3.2 4M6.2 6.2A17 17 0 002 12s3.6 7 10 7a9.7 9.7 0 004.3-1"/></svg>
        가림판 내림 — 눌러서 이 문항만 확인
      </button>
      <div class="inner">
        <div class="exp">
          <div class="exp-h">해설${q.answer?` · 정답 ${q.answer}번`:""}</div>
          <div class="exp-b" data-hl="x" data-qid="${q.id}">${expInner||"<p>등록된 해설이 없습니다.</p>"}</div>
        ${easyHTML(q)}
        </div>

    </div>`;
}

function wireCard(root, slide){
  root.querySelector(".cover")?.addEventListener("click",()=>slide.classList.add("peek"));
  root.querySelector("[data-figadd]")?.addEventListener("click", e => figPick(e.currentTarget.dataset.figadd));
  root.querySelector("[data-figdel]")?.addEventListener("click", e => figRemove(e.currentTarget.dataset.figdel));
  root.querySelector("[data-edittext]")?.addEventListener("click", e => editQText(e.currentTarget.dataset.edittext, root));
  root.querySelector("[data-easygen]")?.addEventListener("click", e => easyGen(e.currentTarget.dataset.easygen, root));
  root.querySelector("[data-easydel]")?.addEventListener("click", async e => {
    const id = e.currentTarget.dataset.easydel;
    if(!confirm("이 문항에 이어 붙인 설명을 지웁니다. 원래 해설은 그대로 남습니다.")) return;
    const r = await sb.from("questions").update({ explanation_easy: null }).eq("id", id);
    if(r.error) return toast("지우지 못했습니다 — " + r.error.message);
    const q = S.questions.find(x => String(x.id) === String(id));
    if(q) q.explanation_easy = null;
    redrawCard(id);
  });
  wirePasteBox(root);
  wireFigSize(root);
}

/* 문제 본문 고쳐 쓰기 — 자동 변환이 뱉은 원문을 그대로 보여주고 손보게 한다.
   그려진 결과가 아니라 저장된 원문이어야, 수식이 안 그려지고 raw 로 새어 나올 때
   그 자리에서 지우거나 고칠 수 있다. 여러 줄이므로 저장·취소를 명시적으로 누른다
   — 칸 밖을 눌렀다고 저장해 버리면 길게 고치다가 사고가 난다. */
function editQText(qid, root){
  if(!S.loggedIn) return;
  const q = S.questions.find(x => String(x.id) === String(qid));
  const el = root.querySelector(".qtext");
  if(!q || !el || root.querySelector(".qtextedit")) return;

  const wrap = document.createElement("div");
  wrap.className = "qtextedit";
  wrap.innerHTML = `<textarea spellcheck="false"></textarea>
    <div class="qtebar">
      <button class="figbtn save" type="button" data-save>저장</button>
      <button class="figbtn" type="button" data-cancel>취소</button>
      <span class="fighint">저장하면 수식·마크다운으로 다시 그립니다 · <b>Ctrl+Enter</b> 저장, <b>Esc</b> 취소</span>
    </div>`;
  const ta = wrap.querySelector("textarea");
  ta.value = q.question_text || "";
  el.replaceWith(wrap);

  const grow = () => { ta.style.height = "auto"; ta.style.height = (ta.scrollHeight + 4) + "px"; };
  ta.addEventListener("input", grow);
  grow(); ta.focus();

  const cancel = () => wrap.replaceWith(el);
  const save = async () => {
    const val = ta.value;
    if(val === (q.question_text || "")) return cancel();
    const btn = wrap.querySelector("[data-save]");
    btn.disabled = true; btn.textContent = "저장 중…";
    const r = await sb.from("questions").update({ question_text: val }).eq("id", q.id);
    if(r.error){
      btn.disabled = false; btn.textContent = "저장";
      return toast("본문을 저장하지 못했습니다 — " + r.error.message);
    }
    q.question_text = val;
    redrawCard(q.id);        /* 마크다운·수식을 다시 그려야 하므로 이 문항만 새로 그린다 */
    toast("본문을 저장했습니다.");
  };

  wrap.querySelector("[data-cancel]").addEventListener("click", cancel);
  wrap.querySelector("[data-save]").addEventListener("click", save);
  ta.addEventListener("keydown", e => {
    if(e.key === "Escape"){ e.preventDefault(); cancel(); }
    else if(e.key === "Enter" && (e.ctrlKey || e.metaKey)){ e.preventDefault(); save(); }
  });
}

/* 붙여넣기 칸 — 초점을 쥐면 PASTE_TARGET 에 그 문항을 걸어둔다.
   초점이 없는 div 에는 paste 가 안 오는 브라우저가 있어서, 실제 처리는 창 전체의
   paste 처리기가 맡고 여기서는 "어느 문항이냐"만 넘긴다. 끌어다 놓기도 같이 받는다. */
let PASTE_TARGET = null;
function wirePasteBox(root){
  const box = root.querySelector("[data-pasteq]");
  if(!box) return;
  const qid = box.dataset.pasteq;
  box.addEventListener("focus", () => { PASTE_TARGET = qid; });
  box.addEventListener("blur",  () => { if(PASTE_TARGET === qid) PASTE_TARGET = null; });
  box.addEventListener("click", () => box.focus());
  ["dragenter","dragover"].forEach(t =>
    box.addEventListener(t, e => { e.preventDefault(); box.classList.add("over"); }));
  ["dragleave","dragend"].forEach(t =>
    box.addEventListener(t, () => box.classList.remove("over")));
  box.addEventListener("drop", e => {
    e.preventDefault(); box.classList.remove("over");
    const f = [...(e.dataTransfer?.files || [])].find(x => /^image\//.test(x.type));
    if(!f) return toast("이미지 파일만 붙일 수 있습니다.");
    figReplaceGuard(qid, f);
  });
}

/* 이미 그림이 있으면 한 번 물어보고 바꾼다 — 붙여넣기·끌어놓기 양쪽이 같이 쓴다 */
function figReplaceGuard(qid, file){
  const q = S.questions.find(x => String(x.id) === String(qid));
  if(!q) return;
  if(q.figure_url && !confirm(`${q.number}번에 이미 그림이 있습니다. 바꿀까요?`)) return;
  figAttach(q.id, file);
}

/* 그림 크기 — 슬라이더는 바로 눈에 보이게만 바꾸고, 저장을 눌러야 DB 에 남는다.
   미리 보고 되돌릴 수 있어야 해서 자동 저장으로 만들지 않았다. */
function wireFigSize(root){
  const bar = root.querySelector("[data-figsize]");
  if(!bar) return;
  const q = S.questions.find(x => String(x.id) === String(bar.dataset.figsize));
  if(!q) return;
  const range = bar.querySelector("input[type=range]");
  const pct   = bar.querySelector(".figpct");
  const save  = bar.querySelector(".save");
  const fig   = root.querySelector(".qfig");

  const paint = () => {
    const v = +range.value;
    pct.textContent = v + "%";
    fig?.style.setProperty("--figw", v + "%");
    save.disabled = (v === figW(q));
  };
  range.addEventListener("input", paint);
  save.addEventListener("click", async () => {
    const v = +range.value;
    save.disabled = true;
    const r = await sb.from("questions").update({ figure_width: v }).eq("id", q.id);
    if(r.error){
      save.disabled = false;
      /* 칸을 방금 만들었는데도 이 오류가 나는 일이 흔하다. Supabase 의 API 계층이
         표 구조를 따로 외워두고 있어서, 칸을 추가해도 바로 알아채지 못한다.
         이때는 SQL 을 다시 돌릴 게 아니라 그 기억을 새로 고쳐줘야 한다. */
      const m = r.error.message || String(r.error);
      const cache = r.error.code === "PGRST204" || /schema cache/i.test(m);
      return toast(cache
        ? "Supabase API 가 아직 figure_width 칸을 모릅니다 — SQL Editor 에서 notify pgrst, 'reload schema'; 를 한 번 돌리세요."
        : /figure_width/.test(m)
          ? "figure_width 칸이 없습니다 — supabase-그림크기-제목.sql 의 1번을 돌리세요. (" + m + ")"
          : "크기를 저장하지 못했습니다 — " + m);
    }
    q.figure_width = v;
    toast(`그림 크기를 ${v}% 로 저장했습니다.`);
  });
  paint();
}

/* 문제 제목(summary) 고쳐 쓰기 — 자동 요약이 엉뚱하게 잡힌 문항을 손으로 바로잡는다.
   Enter 나 칸 밖 누르기로 저장, Esc 로 취소. 저장에 실패하면 원래 제목으로 되돌린다. */
function editSummary(qid, head){
  if(!S.loggedIn) return;
  const q = S.questions.find(x => String(x.id) === String(qid));
  const span = head?.querySelector(".qsum");
  if(!q || !span || head.querySelector(".qsumin")) return;

  const rateTail = () => q.correct_rate != null ? ` · 정답률 ${q.correct_rate}%` : "";
  const input = document.createElement("input");
  input.className = "qsumin";
  input.type = "text";
  input.maxLength = 120;
  input.value = stripQNo(q.summary || "");
  input.placeholder = "이 문제를 한 줄로 — 예: 습공기선도 상태변화";
  span.replaceWith(input);
  input.focus(); input.select();

  let done = false;
  const close = async val => {
    if(done) return; done = true;
    input.replaceWith(span);
    if(val == null) return;
    const before = q.summary;
    if(val === stripQNo(before || "")) return;
    q.summary = val;
    span.textContent = val + rateTail();
    const r = await sb.from("questions").update({ summary: val || null }).eq("id", q.id);
    if(r.error){
      q.summary = before;
      span.textContent = stripQNo(before || "") + rateTail();
      return toast("제목을 저장하지 못했습니다 — " + r.error.message);
    }
    toast("제목을 저장했습니다.");
  };
  input.addEventListener("keydown", e => {
    if(e.key === "Enter"){ e.preventDefault(); close(input.value.trim()); }
    else if(e.key === "Escape"){ e.preventDefault(); close(null); }
  });
  input.addEventListener("blur", () => close(input.value.trim()));
}

/* ═══════════════════════════════════════════════
   문제 그림 직접 붙이기
   자동 변환이 놓친 그림을 여기서 바로 채운다.
   파일을 고르거나, 캡처해서 복사해 둔 이미지를 Ctrl+V 로 붙이면 된다.
   ═══════════════════════════════════════════════ */
const FIG_MAX_W = 1000;

/* 어떤 이미지든 정해진 폭·JPEG 로 줄여서 올린다 — 원본 그대로 올리면 몇 MB 씩 쌓인다 */
async function figShrink(file, maxW = FIG_MAX_W){
  const bmp = await createImageBitmap(file);
  const scale = Math.min(1, maxW / bmp.width);
  const cv = document.createElement("canvas");
  cv.width = Math.round(bmp.width * scale);
  cv.height = Math.round(bmp.height * scale);
  const ctx = cv.getContext("2d");
  ctx.fillStyle = "#fff"; ctx.fillRect(0, 0, cv.width, cv.height);   // 투명 배경(PNG)은 흰색으로
  ctx.drawImage(bmp, 0, 0, cv.width, cv.height);
  bmp.close?.();
  return await new Promise(r => cv.toBlob(r, "image/jpeg", 0.85));
}

async function figAttach(qid, file){
  const q = S.questions.find(x => String(x.id) === String(qid));
  if(!q) return;
  if(!file || !/^image\//.test(file.type)) return toast("이미지 파일만 붙일 수 있습니다.");
  toast("그림을 올리는 중…");
  try{
    const blob = await figShrink(file);
    const path = `manual/${q.exam_id || "x"}/q${q.number}_${Date.now()}.jpg`;
    const up = await sb.storage.from("qfig").upload(path, blob, { contentType:"image/jpeg", upsert:true });
    if(up.error) throw up.error;
    const url = sb.storage.from("qfig").getPublicUrl(path).data.publicUrl;
    const r = await sb.from("questions").update({ figure_url:url }).eq("id", q.id);
    if(r.error) throw r.error;
    q.figure_url = url;
    redrawCard(q.id);
    toast("그림을 붙였습니다.");
  }catch(e){ toast("붙이지 못했습니다 — " + e.message); }
}

async function figRemove(qid){
  const q = S.questions.find(x => String(x.id) === String(qid));
  if(!q || !confirm("이 문항의 그림을 지웁니다.")) return;
  const r = await sb.from("questions").update({ figure_url:null, figure_note:null }).eq("id", q.id);
  if(r.error) return toast("지우지 못했습니다 — " + r.error.message);
  q.figure_url = null; q.figure_note = null;
  redrawCard(q.id);
  toast("지웠습니다.");
}

/* 그 문항 슬라이드만 다시 그린다 — 전체를 다시 만들면 스크롤 위치가 튄다 */
function redrawCard(qid){
  const i = S.questions.findIndex(x => String(x.id) === String(qid));
  if(i < 0) return;
  const body = document.querySelector(`#track .slide[data-i="${i}"] .sheet-body`);
  if(!body) return;
  body.dataset.h = "0";          /* hydrate 가 "이미 그렸다"고 판단하는 표시를 지운다 */
  body.__ink = null; body.__zoom = null;
  hydrate(i);
}

let FIG_INPUT = null;
function figPick(qid){
  if(!FIG_INPUT){
    FIG_INPUT = document.createElement("input");
    FIG_INPUT.type = "file"; FIG_INPUT.accept = "image/*"; FIG_INPUT.style.display = "none";
    document.body.appendChild(FIG_INPUT);
  }
  FIG_INPUT.value = "";
  FIG_INPUT.onchange = e => { const f = e.target.files[0]; if(f) figAttach(qid, f); };
  FIG_INPUT.click();
}

/* 붙여넣기 — 붙여넣기 칸에 초점이 있으면 그 문항으로, 아니면 지금 보고 있는 문항으로 */
addEventListener("paste", e => {
  if(!S.loggedIn) return;
  if(/^(INPUT|TEXTAREA)$/.test(e.target?.tagName)) return;
  const item = [...(e.clipboardData?.items || [])].find(i => i.type.startsWith("image/"));

  /* 핵심개념 자료 칸이 초점을 쥐고 있으면 그쪽이 먼저다 — 회차 목록 화면에서도 붙는다 */
  if(NOTE_PASTE){
    if(!item) return toast("클립보드에 이미지가 없습니다.");
    e.preventDefault();
    const f = item.getAsFile();
    if(f) noteUpload(NOTE_PASTE.subjectId, NOTE_PASTE.box, [f]);
    return;
  }

  if(!$("#v-study").classList.contains("on")) return;
  if(!item){ if(PASTE_TARGET) toast("클립보드에 이미지가 없습니다."); return; }
  const q = PASTE_TARGET
    ? S.questions.find(x => String(x.id) === String(PASTE_TARGET))
    : S.questions[S.idx];
  if(!q) return;
  e.preventDefault();
  const file = item.getAsFile();
  if(file) figReplaceGuard(q.id, file);
});

let TOAST_T = 0;
function toast(msg){
  let el = document.getElementById("toast");
  if(!el){
    el = document.createElement("div");
    el.id = "toast";
    document.body.appendChild(el);
  }
  el.textContent = msg;
  el.classList.add("on");
  clearTimeout(TOAST_T);
  TOAST_T = setTimeout(() => el.classList.remove("on"), 2200);
}

/* 필기 모드로 들어가기 — 처음이면 그 자리에서 qcard/answer 를 가상 페이지로 바꿔 끼운다 */
function onInkClick(q, body, i){
  if(!S.loggedIn){ $("#inkPop").classList.add("on"); return; }
  const qinkBtn = body.querySelector(".qink");
  /* 이미 필기 중이면 같은 버튼으로 빠져나온다 — 도구모음의 "닫기"를 못 찾아도 갇히지 않게 */
  if(body.__ink && body.__ink.editing){
    body.__ink.setEditing(false);
    maybeRestoreCard(q, body, i);
    return;
  }
  if(!body.__ink){
    const oldZoomwrap = body.querySelector(".zoomwrap");
    const inner = oldZoomwrap.querySelector(".qcard").outerHTML +
                  (oldZoomwrap.querySelector(".answer")?.outerHTML || "");
    const tmp = document.createElement("div");
    tmp.innerHTML = inkToolsHTML() + wrapZoom(inkPageHTML(q, inner));
    const head = body.querySelector(".qhead");
    [...tmp.children].reverse().forEach(el => head.after(el));
    oldZoomwrap.remove();

    const zoomwrap = body.querySelector(".zoomwrap");
    const zoomstage = body.querySelector(".zoomstage");
    const wrap = body.querySelector(".inkwrap");
    const page = body.querySelector(".inkpage");
    const canvas = body.querySelector(".inkcanvas");
    const tools = body.querySelector(".inktools");
    wireCard(page, body.closest(".slide"));
    body.__zoom = setupZoom(zoomwrap, zoomstage);
    body.__ink = setupInkPage(q.id, wrap, page, canvas, tools,
                              editing => {
                                body.__inkEditing = editing;
                                qinkBtn.classList.toggle("on", editing);
                                /* 도구모음의 "닫기"로 빠져나온 경우에도 원래 카드로 되돌린다 */
                                if(!editing) setTimeout(()=> maybeRestoreCard(q, body, i), 0);
                              }, body.__zoom);
    tex(page);
    hlApply(page);
    requestAnimationFrame(()=> body.__ink?.resize?.());
  }
  body.__ink.setEditing(true);
}

/* 필기를 닫았는데 그린 획이 하나도 없으면, 문항을 원래의 반응형 카드로 되돌린다.
   필기 모드는 잉크와 글자를 맞추려고 고정폭(400px) 가상 페이지를 쓰는데, 이 구조가 그대로
   남아 있으면 넓은 화면에서 한 단으로 굳어 좌우 2단 배치가 먹지 않기 때문이다.
   획이 하나라도 있으면 좌표를 지켜야 하므로 가상 페이지를 유지한다. */
function maybeRestoreCard(q, body, i){
  if(body.__ink?.editing) return;             // 아직 필기 중이면 손대지 않는다
  const strokes = S.anno[q.id]?.strokes;
  if(strokes && strokes.length) return;      // 필기가 있으면 그대로 둔다
  if(!body.querySelector(".inkpage")) return; // 이미 일반 카드면 할 일 없음
  delete body.__ink; delete body.__zoom; body.__inkEditing = false;
  body.dataset.h = "0";
  hydrate(i);
}

/* 근처 문항만 실제로 그린다 (60문항 한 번에 안 그림) */
function hydrate(i){
  const slide = $(`#track .slide[data-i="${i}"]`); if(!slide) return;
  const body = slide.firstElementChild;
  if(body.dataset.h==="1") return;
  body.dataset.h="1";
  const q = S.questions[i];
  const starred = !!S.stars[q.id];
  const anno = S.anno[q.id];
  const hasInk = !!(anno && anno.strokes && anno.strokes.length);

  const headHTML = `
    <div class="qhead">
      <button class="qno" data-jumpopen type="button" title="문항 고르기 (G)">${q.number}</button>
      <span class="qsum">${esc(stripQNo(q.summary||""))}${q.correct_rate!=null?` · 정답률 ${q.correct_rate}%`:""}</span>
      ${S.loggedIn?`<button class="qedit" data-editsum="${q.id}" type="button" aria-label="제목 고치기" title="제목 고치기 (본문은 카드 안 '본문 고치기')">
        <svg viewBox="0 0 24 24"><path d="M4 6h16"/><path d="M4 11h9"/><path d="M4 16h5"/><path d="M14.5 19.5l5.5-5.5 2 2-5.5 5.5H14.5z"/></svg>
      </button>`:""}
      <button class="qink ${hasInk?"has":""}" aria-label="필기">
        <svg viewBox="0 0 24 24"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 013 3L7 19l-4 1 1-4z"/></svg>
      </button>
      <button class="qnote" data-qnote type="button" aria-label="핵심개념 바로 보기" title="즐겨찾기한 핵심개념 자료 (N)">
        <svg viewBox="0 0 24 24"><path d="M6 3h12v18l-6-4.5L6 21z"/></svg>
      </button>
      <button class="qstar ${starred?"on":""}" data-id="${q.id}" aria-label="북마크">
        <svg viewBox="0 0 24 24"><path d="M12 3l2.6 5.6 6 .8-4.4 4.2 1.1 6.1L12 16.9 6.7 19.7l1.1-6.1L3.4 9.4l6-.8z"/></svg>
      </button>
      <button class="delx" data-delq="${q.id}">삭제</button>
    </div>`;

  const content = cardHTML(q);
  body.innerHTML = headHTML + (hasInk
    ? inkToolsHTML() + wrapZoom(inkPageHTML(q, content))
    : wrapZoom(content));

  body.querySelector(".qstar")?.addEventListener("click",e=>{
    const el=e.currentTarget, id=el.dataset.id;
    S.stars[id] = !S.stars[id]; if(!S.stars[id]) delete S.stars[id];
    LS.set("stars",S.stars); el.classList.toggle("on",!!S.stars[id]);
    $(`#rail .bub[data-i="${i}"]`)?.classList.toggle("star",!!S.stars[id]);
  });
  body.querySelector("[data-jumpopen]")?.addEventListener("click", jumpGridOpen);
  body.querySelector(".qink")?.addEventListener("click", ()=> onInkClick(q, body, i));
  body.querySelector("[data-qnote]")?.addEventListener("click", () => pinOpen());
  body.querySelector("[data-editsum]")?.addEventListener("click", e =>
    editSummary(e.currentTarget.dataset.editsum, body.querySelector(".qhead")));
  body.querySelector("[data-delq]")?.addEventListener("click", ()=>
    confirmDelete(`${q.number}번 문항을 지웁니다.`, ()=>deleteQuestion(q.id), ()=>{
      S.questions = S.questions.filter(x=>x.id !== q.id);
      if(!S.questions.length){ S.exam=null; return go(`#/s/${S.subject.id}`); }
      build();
      jump(Math.min(i, S.questions.length-1), false);
    }));

  const zoomwrap = body.querySelector(".zoomwrap");
  const zoomstage = body.querySelector(".zoomstage");
  body.__zoom = setupZoom(zoomwrap, zoomstage);

  if(hasInk){
    const wrap = body.querySelector(".inkwrap");
    const page = body.querySelector(".inkpage");
    const canvas = body.querySelector(".inkcanvas");
    const tools = body.querySelector(".inktools");
    const qinkBtn = body.querySelector(".qink");
    wireCard(page, slide);
    body.__ink = setupInkPage(q.id, wrap, page, canvas, tools,
                              editing => {
                                body.__inkEditing = editing;
                                qinkBtn.classList.toggle("on", editing);
                                /* 도구모음의 "닫기"로 빠져나온 경우에도 원래 카드로 되돌린다 */
                                if(!editing) setTimeout(()=> maybeRestoreCard(q, body, i), 0);
                              }, body.__zoom);
    tex(page);
    hlApply(page);
    requestAnimationFrame(()=> body.__ink?.resize?.());
  }else{
    wireCard(zoomstage, slide);
    tex(zoomstage);
    hlApply(zoomstage);
  }
  $(`#rail .bub[data-i="${i}"]`)?.classList.toggle("star",starred);
}



function setActive(i){
  setTimeout(edgeSync, 0);
  if(S.idx===i && $(`#rail .bub.now`)) return;
  S.idx=i;
  const q=S.questions[i]; if(!q) return;
  S.seen[q.id]=1; LS.set("seen",S.seen);
  /* 섞어 보기 덱은 회차가 아니라 임시 묶음이다 —
     이어보기 위치를 저장하면 실제 회차 진도가 망가지고, 주소도 #/e/mix:… 로 깨진다. */
  if(!S.exam?._mix){
    LS.set(`pos:${S.exam.id}`,i);
    history.replaceState(null,"",`#/e/${S.exam.id}/${q.number}`);
  }

  [i-2,i-1,i,i+1,i+2].forEach(k=>{ if(k>=0&&k<S.questions.length) hydrate(k); });
  $$("#rail .bub").forEach((b,k)=>{
    b.classList.toggle("now",k===i);
    b.classList.toggle("seen",!!S.seen[S.questions[k].id]);
  });
  const chip=$(`#rail .bub[data-i="${i}"]`);
  chip?.scrollIntoView({behavior:"smooth",block:"nearest",inline:"center"});
  $("#foot").textContent = `${q.number} / ${S.questions[S.questions.length-1].number}`;
}

function jump(i,smooth=true){
  const slide=$(`#track .slide[data-i="${i}"]`); if(!slide) return;
  hydrate(i);
  requestAnimationFrame(sizeCols);   /* 헤더 높이가 문항마다 달라질 수 있어 그릴 때마다 다시 잰다 */
  const track=$("#track");
  /* 세로 넘김 모드에서는 스크롤 축이 위아래로 바뀐다 */
  if(track.classList.contains("vert"))
    track.scrollTo({top:i*track.clientHeight, behavior:smooth?"smooth":"auto"});
  else
    track.scrollTo({left:i*track.clientWidth, behavior:smooth?"smooth":"auto"});
  setActive(i);
}

/* ═══════════════════════════════════════════════
   한눈에 보기 — 문제·해설·쉬운 풀이를 한 화면에 나란히
   ───────────────────────────────────────────────
   실기 뷰어에 있던 것을 필기에도 그대로 들여왔다.
   카드를 위아래로 오래 굴리지 않고 «문제를 보면서» 해설을 읽으라는 화면이다.
   폰에서는 위아래로 나뉘고 아래쪽은 탭으로 갈아 끼운다.
   ═══════════════════════════════════════════════ */
let GVSEG = "x";
const gvOn = () => $("#gvl")?.classList.contains("on");

function gvDraw(){
  const q = S.questions?.[S.idx];
  if(!q) return gvClose();

  $("#gvTitle").textContent = `${q.number}번`;
  $("#gvSub").textContent   = `${S.idx + 1} / ${S.questions.length}`
    + (q.subject_part ? ` · ${q.subject_part}` : "");
  const gp = $("#gvPrev"), gn = $("#gvNext");
  if(gp) gp.disabled = S.idx <= 0;
  if(gn) gn.disabled = S.idx >= S.questions.length - 1;

  const chs = (Array.isArray(q.choices) ? q.choices : []).map((c, k) => `
    <div class="gch ${q.answer === k + 1 ? "ok" : ""}">
      <span class="b">${k + 1}</span>
      <span class="t">${md(autoMath(String(c))).replace(/^<p>|<\/p>$/g, "")}</span>
    </div>`).join("");

  $("#gvLeft").innerHTML = `<div class="glab">문제</div>
    <div class="gq">${md(stripQNo(q.question_text)).replace(/^<p>|<\/p>$/g, "")}</div>
    ${q.figure_url ? `<img src="${esc(q.figure_url)}" alt="${esc(q.figure_note || "문제 그림")}" loading="lazy">` : ""}
    ${chs ? `<div style="margin-top:6px">${chs}</div>` : ""}`;

  const expInner = q.explanation_html
    ? `<div class="sheet-host">${q.explanation_html}</div>`
    : md(q.explanation_md || "");
  const easy = (q.explanation_easy || "").trim();

  $("#gvRight").innerHTML = `
    <div class="gseg ${GVSEG === "x" ? "on" : ""}" data-gseg="x">
      <div class="glab">해설${q.answer ? ` · 정답 ${q.answer}번` : ""}</div>
      ${expInner || `<div class="miss">등록된 해설이 없습니다.</div>`}
    </div>
    <div class="gseg ${GVSEG === "e" ? "on" : ""}" data-gseg="e">
      <div class="glab">쉬운 풀이</div>
      ${easy ? md(easy) : `<div class="miss">아직 «쉬운 풀이» 가 없습니다.<br>문항 화면에서 만들어 두면 여기에도 같이 뜹니다.</div>`}
    </div>`;

  $$("#gvl .gtabs button").forEach(b => b.classList.toggle("on", b.dataset.gseg === GVSEG));
  tex($("#gvl"));
  $$("#gvl .gpane").forEach(p => p.scrollTop = 0);
}

function gvOpen(){
  if(!S.questions?.length) return;
  $("#gvl").classList.add("on");
  document.body.classList.add("gvlopen");
  gvDraw();
}
function gvClose(){
  $("#gvl")?.classList.remove("on");
  document.body.classList.remove("gvlopen");
}
function gvStep(d){
  const n = S.questions?.length || 0;
  const i = Math.max(0, Math.min(n - 1, S.idx + d));
  if(i === S.idx) return;
  jump(i, false);          /* 뒤에 있는 카드도 같이 따라오게 해서 닫으면 그 자리 */
  gvDraw();
}
$("#gvClose")?.addEventListener("click", gvClose);

/* ── 손가락으로 좌우로 밀어 넘기기 ──
   판을 열어 놓고 문항을 바꾸려면 지금까지는 위쪽 단추를 눌러야 했다.
   폰에서는 그 단추 한 줄이 화면의 십분의 일을 먹는다. 밀어서 넘기는 것으로 바꾼다.

   조심할 것이 셋 있다.
     ① 세로 스크롤을 방해하면 안 된다  → 가로로 더 많이 움직였을 때만 넘긴다.
     ② 두 손가락(확대)은 넘김이 아니다  → 손가락이 하나일 때만 센다.
     ③ 표처럼 «옆으로 굴러가는» 칸 안에서 시작한 밀기는 그 칸의 것이다
        → 그런 칸에서 시작했으면 넘기지 않는다. */
(() => {
  const gvl = $("#gvl"); if(!gvl) return;
  const MIN = 52;          /* 이만큼은 밀어야 넘어간다 (짧게 스치는 것은 무시) */
  const SLOPE = 1.5;       /* 가로가 세로보다 이 배는 커야 «옆으로 민 것» 으로 본다 */
  let sx = 0, sy = 0, on = false, live = false;

  const scrollsX = el => {
    for(let n = el; n && n !== gvl; n = n.parentElement){
      if(n.scrollWidth > n.clientWidth + 4){
        const st = getComputedStyle(n).overflowX;
        if(st === "auto" || st === "scroll") return true;
      }
    }
    return false;
  };

  gvl.addEventListener("touchstart", e => {
    on = live = false;
    if(e.touches.length !== 1) return;
    if(scrollsX(e.target)) return;
    /* 글자를 고르는 중이면 넘기지 않는다.
       (getSelection() 이 null 인 브라우저도 있어 «고른 것이 있을 때» 만 막는다 —
        반대로 쓰면 아무 데서도 안 넘어간다) */
    const sel = getSelection();
    if(sel && sel.rangeCount > 0 && !sel.isCollapsed) return;
    sx = e.touches[0].clientX; sy = e.touches[0].clientY; on = true;
  }, { passive:true });

  gvl.addEventListener("touchmove", e => {
    if(!on || e.touches.length !== 1) return;
    const dx = e.touches[0].clientX - sx, dy = e.touches[0].clientY - sy;
    if(!live){
      if(Math.abs(dx) < 12 && Math.abs(dy) < 12) return;
      /* 처음 움직인 방향으로 «세로냐 가로냐» 를 한 번만 정한다.
         중간에 마음이 바뀌면 스크롤이 덜컹거린다. */
      live = Math.abs(dx) > Math.abs(dy) * SLOPE;
      if(!live){ on = false; return; }
    }
    if(e.cancelable) e.preventDefault();   /* 가로로 정해졌으면 세로 스크롤은 막는다 */
  }, { passive:false });

  gvl.addEventListener("touchend", e => {
    if(!on || !live){ on = live = false; return; }
    const t = e.changedTouches[0];
    const dx = t.clientX - sx, dy = t.clientY - sy;
    on = live = false;
    if(Math.abs(dx) < MIN || Math.abs(dx) < Math.abs(dy) * SLOPE) return;
    gvStep(dx < 0 ? 1 : -1);               /* 왼쪽으로 밀면 다음 문항 */
  }, { passive:true });

  gvl.addEventListener("touchcancel", () => { on = live = false; }, { passive:true });
})();
$("#gvPrev")?.addEventListener("click", () => gvStep(-1));
$("#gvNext")?.addEventListener("click", () => gvStep(1));
$$("#gvl .gtabs button").forEach(b => b.onclick = () => { GVSEG = b.dataset.gseg; gvDraw(); });
$("#glance")?.addEventListener("click", gvOpen);
addEventListener("keydown", e => {
  if(!gvOn()) return;
  if(e.key === "Escape"){ e.preventDefault(); gvClose(); }
  else if(e.key === "ArrowRight"){ e.preventDefault(); gvStep(1); }
  else if(e.key === "ArrowLeft"){ e.preventDefault(); gvStep(-1); }
}, true);

/* 학습 화면에서만 뜬다. 섞어 보기가 아니면 아래 두 단추가 없으므로 맨 아래로 내려온다. */
function glanceSync(){
  const b = $("#glance"); if(!b) return;
  const on = !!(S.questions?.length) && $("#v-study")?.classList.contains("on");
  b.hidden = !on;
  b.classList.toggle("solo", !S.exam?._mix);
  if(!on) gvClose();
}

/* ── 화면 좌우 넘김 단추 ──
   마우스 드래그 넘김을 없앤 자리를 이 단추가 대신한다.
   스크롤할 때마다 잠깐 또렷해졌다가 다시 흐려진다 — 읽는 데 방해되지 않게. */
let EDGE_T = null;
function edgeWake(){
  const a = $("#edgePrev"), b = $("#edgeNext");
  if(!a || !b) return;
  a.classList.add("wake"); b.classList.add("wake");
  clearTimeout(EDGE_T);
  EDGE_T = setTimeout(() => { a.classList.remove("wake"); b.classList.remove("wake"); }, 1600);
}
function edgeSync(){
  glanceSync();
  if(gvOn()) gvDraw();
  const a = $("#edgePrev"), b = $("#edgeNext");
  if(!a || !b) return;
  const n = S.questions?.length || 0;
  document.body.classList.toggle("reading", n > 1 && !!$("#track"));
  a.disabled = S.idx <= 0;
  b.disabled = S.idx >= n - 1;
}
$("#edgePrev")?.addEventListener("click", () => { jump(Math.max(0, S.idx - 1)); edgeWake(); });
$("#edgeNext")?.addEventListener("click", () => {
  jump(Math.min((S.questions?.length || 1) - 1, S.idx + 1)); edgeWake();
});
addEventListener("scroll", edgeWake, true);
addEventListener("wheel",  edgeWake, { passive:true });

/* ── 상단 제목을 누르면 잘린 글을 펼쳐 본다 ──
   ★ 이 손잡이는 원래 <style> 안에 잘못 들어가 있었다. 스타일시트에 자바스크립트가
     섞이면 CSS 해석기가 그 자리에서 헤매다가 «바로 다음 규칙» 을 통째로 삼킨다.
     여기서 삼켜진 것이 .edgenav 였고, 그래서 position:fixed 가 통째로 사라져
     좌우 넘김 단추가 화면 가운데가 아니라 문서 맨 위에 그냥 얹혀 있었다.
     제자리(스크립트)로 옮긴다. */
$(".top .grow")?.addEventListener("click", () => {
  const t = document.querySelector(".top"); if(!t) return;
  /* 아래 문항 레일이 --head 를 기준으로 붙어 있어, 펼친 채로 두면 결국 겹친다.
     그래서 «잠깐 보고 저절로 접히는» 것으로 못 박는다. */
  const on = t.classList.toggle("wide");
  clearTimeout(t._t);
  if(on) t._t = setTimeout(() => t.classList.remove("wide"), 4000);
});

/* ── 가림판 ── */
function applyVeil(){
  $("#track")?.classList.toggle("veiled",S.veil);
  $$("#track .slide").forEach(s=>s.classList.remove("peek"));
  $("#veilBtn").classList.toggle("on",S.veil);
  $("#veilTxt").textContent = S.veil ? "해설 가림" : "해설 보임";
  $("#veilIcon").innerHTML = S.veil
    ? '<path d="M3 3l18 18M10.6 10.6a3 3 0 004.2 4.2"/><path d="M9.4 5.2A9.6 9.6 0 0112 5c6.4 0 10 7 10 7a17 17 0 01-3.2 4M6.2 6.2A17 17 0 002 12s3.6 7 10 7a9.7 9.7 0 004.3-1"/>'
    : '<path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7-10-7-10-7z"/><circle cx="12" cy="12" r="3"/>';
}
$("#veilBtn").onclick = ()=>{ S.veil=!S.veil; LS.set("veil",S.veil); applyVeil(); };

/* ── 화면 배치 (세로 넘김 / 가로 넘김 / 좌우 2단) ──
   세 가지를 버튼 하나로 돌려 쓴다. 고른 값은 기기에 저장돼 다음에 열 때도 그대로다. */
const LAYOUTS = [
  { id:"swipe-x", label:"가로 넘김",
    icon:'<path d="M4 5h16v14H4z"/><path d="M9 12h6M13 9l3 3-3 3"/>' },
  { id:"swipe-y", label:"세로 넘김",
    icon:'<path d="M4 5h16v14H4z"/><path d="M12 9v6M9 13l3 3 3-3"/>' },
  { id:"split",   label:"좌우 2단",
    icon:'<path d="M4 5h16v14H4z"/><path d="M12 5v14"/>' },
];
function applyLayout(restore = true){
  const track = $("#track"); if(!track) return;
  const cur = LAYOUTS.find(l => l.id === S.layout) || LAYOUTS[0];
  track.classList.toggle("vert",  cur.id === "swipe-y");
  track.classList.toggle("split", cur.id === "split");
  $("#layoutIcon").innerHTML = cur.icon;
  $("#layoutBtn").title = `화면 배치 — 지금은 "${cur.label}" (눌러서 바꾸기)`;
  /* 배치를 바꾸면 스크롤 좌표계가 달라지므로 현재 문항 위치를 다시 잡아준다.
     (build 직후에는 아직 이동할 위치가 정해지지 않았으므로 건너뛴다) */
  if(!restore) return;
  requestAnimationFrame(()=>{
    jump(S.idx, false);
    $$("#track .slide").forEach(s => s.firstElementChild?.__ink?.resize?.());
  });
}
$("#layoutBtn").onclick = ()=>{
  const i = LAYOUTS.findIndex(l => l.id === S.layout);
  S.layout = LAYOUTS[(i + 1) % LAYOUTS.length].id;
  LS.set("layout", S.layout);
  applyLayout();
};

/* ── F9 가림막 ──
   화면 전체를 흰색으로 덮는다. 어느 화면에서든(과목·회차·문항) 동작하고,
   덮인 동안에는 어떤 조작도 아래로 통과하지 않는다.
   아무 키·클릭·터치로 해제. 자리를 비울 때 어깨너머 시선을 막는 용도. */
const blankEl = $("#blank");
function setBlank(on){
  blankEl.classList.toggle("on", on);
  if(on) blankEl.focus?.();
}
const blankOn = () => blankEl.classList.contains("on");
addEventListener("keydown", e=>{
  if(e.key === "F9"){ e.preventDefault(); setBlank(!blankOn()); return; }
  if(blankOn()){ e.preventDefault(); e.stopPropagation(); setBlank(false); }
}, true);   // capture 단계 — 다른 단축키보다 먼저 가로챈다
["pointerdown","wheel","touchstart"].forEach(ev =>
  blankEl.addEventListener(ev, e=>{ e.preventDefault(); setBlank(false); }, {passive:false}));

/* ── 키보드 ── */
addEventListener("keydown",e=>{
  if(!$("#v-study").classList.contains("on")) return;
  if(/^(INPUT|TEXTAREA)$/.test(e.target.tagName)) return;

  /* 자료가 떠 있으면 Esc 로 닫는 것부터. 다른 단축키가 뒤에서 끼어들지 않게 여기서 끝낸다 */
  if(document.getElementById("noteOv")?.classList.contains("on")){
    if(e.key === "Escape" || e.key === "n" || e.key === "N"){ e.preventDefault(); pinClose(); }
    return;
  }

  if(document.getElementById("jumpOv")){
    if(e.key === "Escape"){ e.preventDefault(); jumpGridClose(); }
    return;                       /* 고르기 창이 떠 있으면 뒤쪽 단축키는 먹지 않게 */
  }
  if((e.key === "g" || e.key === "G") && !e.ctrlKey && !e.metaKey
     && !$(`#track .slide[data-i="${S.idx}"] .sheet-body`)?.__ink?.editing){
    e.preventDefault(); jumpGridOpen(); return;
  }

  /* 필기 중이면 포토샵처럼 알파벳 한 글자로 도구를 바꾼다 (V=이동, P=펜, H=형광펜, U=밑줄, E=지우개) */
  const ink = $(`#track .slide[data-i="${S.idx}"] .sheet-body`)?.__ink;
  if(ink?.editing && !e.ctrlKey && !e.metaKey){
    const map = {v:"move", p:"pen", h:"hi", u:"ul", e:"er"};
    const t = map[e.key.toLowerCase()];
    if(t){ e.preventDefault(); ink.setTool(t); return; }
    if(e.key==="Escape"){ e.preventDefault(); ink.setEditing(false); return; }
  }

  if(e.key==="n" || e.key==="N"){ e.preventDefault(); pinOpen(); return; }
  if(e.key==="ArrowRight" || e.key==="PageDown") jump(Math.min(S.idx+1,S.questions.length-1));
  if(e.key==="ArrowLeft"  || e.key==="PageUp")   jump(Math.max(S.idx-1,0));
  if(e.key==="L" || e.key==="l"){ e.preventDefault(); $("#layoutBtn").click(); }
  if(e.key===" "){ e.preventDefault(); $("#veilBtn").click(); }
});

function fail(el,big,sub){
  el.innerHTML = `<div class="empty" style="grid-column:1/-1"><div class="big">${big}</div><div>${sub}</div></div>`;
}
inkRefresh();
/* 세션은 새로고침 직후 조금 늦게 살아나고, 시간이 지나면 만료되기도 한다.
   그때마다 고치기 단추가 알아서 나타나고 사라지도록 붙여 둔다.

   ★ supabase-js v2 의 이 콜백은 인증 잠금을 쥔 채로 불린다. 그 안에서 getSession() 이나
     sb.from(...) 을 부르면 같은 잠금을 다시 기다리다 영영 굳는다. 화면 전체가 로딩
     상태로 멈춰버리므로, 잠금 밖으로 빠져나온 뒤(setTimeout 0)에 처리하고
     세션도 다시 묻지 않고 콜백이 준 값을 그대로 쓴다. */
sb?.auth?.onAuthStateChange?.((_evt, session) => {
  setTimeout(() => inkRefresh(session ?? null), 0);
});
route();

/* 홈 화면 설치 + 오프라인 */
if("serviceWorker" in navigator && location.protocol.startsWith("http"))
  addEventListener("load",()=>navigator.serviceWorker.register("./sw.js?v=228").catch(()=>{}));
</script>
<script>
/* ══════════════════════════════════════════════════════════════
   배경 음악 — 브라우저가 «그 자리에서 연주한다»

   음원 파일을 싣지 않는다. 녹음물은 전부 누군가의 저작물이고,
   남의 곡을 얹어 두면 그것부터 문제가 된다.
   그래서 화음 진행과 멜로디만 적어 두고 WebAudio 로 직접 소리를 만든다.
   화성 진행·음계는 공용 문법이라 누구의 것도 아니다.

     모드 1 «재즈»    — 포트폴리오 읽기전용에 깔린 것과 같은 엔진.
                        워킹 베이스 + 스윙 라이드 + ii-V-I 컴핑.
     모드 2 «판타지»  — 90년대 말 한국 온라인 RPG 마을 BGM 결.
                        3/4 왈츠 · 90BPM · D장조,
                        플루트/클라리넷 리드 + 하프 아르페지오 + 피아노 +
                        따뜻한 스트링 패드 + 첼레스타 장식음 + 아주 여린 타악.
                        일부러 얇고 건조하게 — 옛 사운드폰트 질감을 노렸다.

   · 저절로 켜지지 않는다. 눌러야 시작한다(브라우저도 그렇게만 허용한다).
   · 고른 모드는 이 기기에 기억해 두고, 다음에 들어오면 첫 조작 때 이어 튼다.
   ══════════════════════════════════════════════════════════════ */
(function(){
  const KEY  = "bgm-mode";                       /* "off" | "jazz" | "fantasy" */
  const NAME = { jazz:"가사 없는 재즈", fantasy:"판타지 마을" };
  const A = { ctx:null, master:null, wet:null, noise:null,
              mode:"off", timer:null, t:0, bar:0 };

  const hz = m => 440 * Math.pow(2, (m - 69) / 12);
  const $1 = s => document.querySelector(s);

  /* ── 소리 만드는 재료 ─────────────────────────────────── */
  function init(){
    if(A.ctx) return;
    const C = new (window.AudioContext || window.webkitAudioContext)();
    A.ctx = C;

    const m = C.createGain(); m.gain.value = 0.0001; m.connect(C.destination);
    A.master = m;

    /* 잔향 흉내 — 짧은 되울림 한 줄. 컨볼루션까지 갈 필요는 없다.
       고리 안에 DelayNode 가 있어야 WebAudio 가 순환 연결을 허락한다. */
    const d  = C.createDelay(0.6); d.delayTime.value = 0.15;
    const fb = C.createGain();     fb.gain.value = 0.32;
    const lp = C.createBiquadFilter(); lp.type = "lowpass"; lp.frequency.value = 2600;
    const wet = C.createGain();    wet.gain.value = 1;
    wet.connect(d); d.connect(lp); lp.connect(fb); fb.connect(d); lp.connect(m);
    A.wet = wet;

    /* 심벌·탬버린에 쓸 잡음 한 덩어리 */
    const n = C.createBuffer(1, C.sampleRate * 2, C.sampleRate);
    const dd = n.getChannelData(0);
    for(let i = 0; i < dd.length; i++) dd[i] = Math.random() * 2 - 1;
    A.noise = n;
  }

  /* 한 음. send 를 주면 그만큼 잔향으로도 보낸다. vib 를 주면 떨림을 얹는다(플루트) */
  function tone(t, midi, dur, vol, type, cut, atk, send, vib){
    const C = A.ctx;
    const o = C.createOscillator(); o.type = type; o.frequency.value = hz(midi);
    const f = C.createBiquadFilter(); f.type = "lowpass"; f.frequency.value = cut;
    const g = C.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(Math.max(0.0002, vol), t + (atk || 0.012));
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(f).connect(g);
    g.connect(A.master);
    if(send){
      const s = C.createGain(); s.gain.value = send;
      g.connect(s); s.connect(A.wet);
    }
    let lfo = null, lg = null;
    if(vib){
      lfo = C.createOscillator(); lfo.frequency.value = 5.2;
      lg = C.createGain(); lg.gain.setValueAtTime(0, t);
      lg.gain.linearRampToValueAtTime(vib, t + Math.min(0.35, dur * 0.6));
      lfo.connect(lg).connect(o.frequency);
      lfo.start(t); lfo.stop(t + dur + 0.03);
    }
    o.start(t); o.stop(t + dur + 0.03);
  }

  function noise(t, dur, freq, q, vol, send){
    const C = A.ctx;
    const src = C.createBufferSource(); src.buffer = A.noise; src.loop = true;
    const bp = C.createBiquadFilter(); bp.type = "bandpass";
    bp.frequency.value = freq; bp.Q.value = q;
    const g = C.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(Math.max(0.0002, vol), t + 0.004);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    src.connect(bp).connect(g);
    g.connect(A.master);
    if(send){ const s = C.createGain(); s.gain.value = send; g.connect(s); s.connect(A.wet); }
    src.start(t); src.stop(t + dur + 0.03);
  }

  /* ══════════════════════════════════════════════
     모드 1 — 가사 없는 재즈
     ══════════════════════════════════════════════ */
  const QUAL = {
    m7: { chord:[0,3,7,10], voice:[3,10,14] },
    d7: { chord:[0,4,7,10], voice:[4,10,14] },
    M7: { chord:[0,4,7,11], voice:[4,11,14] },
    h7: { chord:[0,3,6,10], voice:[3,10,13] }
  };
  const TUNE = [
    [[62,"m7"]], [[67,"d7"]], [[60,"M7"]], [[60,"M7"]],
    [[64,"h7"]], [[69,"d7"]], [[62,"m7"]], [[62,"m7"]],
    [[67,"m7"]], [[60,"d7"]], [[65,"M7"]], [[65,"M7"]],
    [[62,"h7"]], [[67,"d7"]], [[60,"m7"]], [[62,"m7"],[67,"d7"]]
  ];
  const JBPM = 132, SWING = 0.64;

  function jazzBar(t0){
    const beat = 60 / JBPM;
    const bar  = TUNE[A.bar % TUNE.length];
    const next = TUNE[(A.bar + 1) % TUNE.length][0];
    const pick = b => bar.length === 1 ? bar[0] : (b < 2 ? bar[0] : bar[1]);

    for(let b = 0; b < 4; b++){
      const t = t0 + b * beat;
      const [root, q] = pick(b);
      const ch = QUAL[q];

      noise(t, 0.9, 7200, 0.7, b % 2 === 0 ? 0.055 : 0.04, 0.2);
      if(b === 1 || b === 3) noise(t + beat * SWING, 0.5, 7600, 0.7, 0.032, 0.2);
      if(b === 1 || b === 3) noise(t, 0.12, 4200, 1.4, 0.07);

      let n;
      if(b === 0) n = root - 24;
      else if(b === 3){
        const tgt = next[0] - 24;
        n = tgt + (Math.random() < 0.5 ? 1 : -1);
      } else n = root - 24 + ch.chord[1 + Math.floor(Math.random() * 3)];
      while(n < 33) n += 12; while(n > 52) n -= 12;
      tone(t, n, beat * 0.92, 0.16, "triangle", 520);

      const hit = (b === 0 && Math.random() < 0.55) || (b === 1 && Math.random() < 0.5)
               || (b === 2 && Math.random() < 0.35) || (b === 3 && Math.random() < 0.45);
      if(hit){
        const off = Math.random() < 0.5 ? 0 : beat * SWING;
        ch.voice.map(iv => {
          let m = root + iv;
          while(m < 60) m += 12; while(m > 78) m -= 12;
          return m;
        }).forEach((m, i) => tone(t + off + i * 0.006, m, 1.05, 0.045, "triangle", 2400, 0.012, 0.25));
      }
    }
    A.bar++;
    return t0 + beat * 4;
  }

  /* ══════════════════════════════════════════════
     모드 2 — 판타지 마을 (3/4 · 90BPM · D장조)

     화음 진행 16마디. 밝게 시작해 6·7마디에서 살짝 그늘이 지고 돌아온다.
     r = 화음을 쌓을 기준음, q = 반음 간격, b = 베이스 음.
     ══════════════════════════════════════════════ */
  const FBPM = 90;
  const PROG = [
    { r:62, q:[0,4,7],    b:38 },  /* D    */
    { r:69, q:[0,4,7],    b:37 },  /* A/C# */
    { r:59, q:[0,3,7],    b:35 },  /* Bm   */
    { r:66, q:[0,3,7],    b:42 },  /* F#m  */
    { r:67, q:[0,4,7],    b:43 },  /* G    */
    { r:62, q:[0,4,7],    b:38 },  /* D    */
    { r:64, q:[0,3,7,10], b:40 },  /* Em7  */
    { r:69, q:[0,4,7,10], b:45 },  /* A7   */
    { r:62, q:[0,4,7],    b:38 },  /* D    */
    { r:69, q:[0,4,7],    b:37 },  /* A/C# */
    { r:59, q:[0,3,7],    b:35 },  /* Bm   */
    { r:67, q:[0,4,7],    b:43 },  /* G    */
    { r:64, q:[0,3,7,10], b:40 },  /* Em7  */
    { r:69, q:[0,4,7,10], b:45 },  /* A7   */
    { r:62, q:[0,4,7],    b:38 },  /* D    */
    { r:69, q:[0,4,7,10], b:45 }   /* A7 — 다시 처음으로 */
  ];
  /* 멜로디 — [박, 음, 길이(박)]. 웅장하게 가지 않는다.
     «작은 마을을 걷다가 처음 보는 숲으로 들어가는» 정도의 걸음걸이. */
  const MEL = [
    [[0,78,1],[1,76,1],[2,74,1]],
    [[0,73,2],[2,74,1]],
    [[0,76,1],[1,78,1],[2,79,1]],
    [[0,78,3]],
    [[0,79,1],[1,81,1],[2,83,1]],
    [[0,81,2],[2,78,1]],
    [[0,76,1],[1,78,1],[2,79,1]],
    [[0,78,2],[2,73,1]],
    [[0,74,1],[1,78,1],[2,81,1]],
    [[0,83,2],[2,81,1]],
    [[0,78,1],[1,79,1],[2,78,1]],
    [[0,76,3]],
    [[0,76,1],[1,79,1],[2,78,1]],
    [[0,73,1],[1,74,1],[2,76,1]],
    [[0,74,3]],
    [[0,69,1],[1,73,1],[2,74,1]]
  ];

  /* 화음을 원하는 높이대로 쌓는다 */
  const voiceUp = (r, q, lo, hi) => q.map(iv => {
    let m = r + iv;
    while(m < lo) m += 12; while(m > hi) m -= 12;
    return m;
  });

  function fantasyBar(t0){
    const beat = 60 / FBPM;
    const i  = A.bar % PROG.length;
    const ch = PROG[i];
    const bar = t0;
    const chord = voiceUp(ch.r, ch.q, 60, 74);

    /* ── 따뜻한 스트링 패드 — 마디를 통째로 받친다. 아주 여리게 ── */
    chord.forEach((m, k) => tone(bar, m - 12, beat * 3.15, 0.020,
      "sawtooth", 1300, 0.55, 0.5));

    /* ── 왈츠 반주 — 쿵 짝 짝 ── */
    tone(bar, ch.b, beat * 0.95, 0.085, "triangle", 420, 0.02, 0.15);          /* 베이스 */
    for(const b of [1, 2])
      chord.forEach((m, k) => tone(bar + b * beat + k * 0.005, m, beat * 0.7,
        0.030, "triangle", 2200, 0.01, 0.3));                                   /* 피아노 */

    /* ── 하프 아르페지오 — 8분음표로 여섯 번, 마디마다 오르내림을 바꾼다 ── */
    const up = (A.bar % 2 === 0);
    const harp = chord.concat([chord[0] + 12]);
    for(let e = 0; e < 6; e++){
      const k = up ? e % harp.length : (harp.length - 1 - (e % harp.length));
      tone(bar + e * beat / 2, harp[k] + 12, 0.55, 0.028, "triangle", 3600, 0.006, 0.45);
    }

    /* ── 리드 — 8마디마다 플루트 ↔ 클라리넷 ── */
    const flute = (Math.floor(A.bar / 8) % 2) === 0;
    for(const [b, m, d] of MEL[i]){
      tone(bar + b * beat, m, d * beat * 0.94, flute ? 0.075 : 0.062,
           flute ? "sine" : "square", flute ? 2600 : 1500,
           flute ? 0.09 : 0.05, 0.4, flute ? 2.6 : 1.2);
    }

    /* ── 첼레스타 · 오르골 장식음 — 네 마디에 한 번, 아주 짧게 ── */
    if(i % 4 === 3){
      const c = chord[0] + 24;
      tone(bar + beat * 2, c, 0.9, 0.030, "sine", 6000, 0.004, 0.6);
      tone(bar + beat * 2.5, c + 4, 0.8, 0.024, "sine", 6000, 0.004, 0.6);
    }

    /* ── 아주 여린 타악 — 있는 줄도 모를 만큼만 ── */
    (function kick(){
      const C = A.ctx, o = C.createOscillator(), g = C.createGain();
      o.type = "sine";
      o.frequency.setValueAtTime(105, bar);
      o.frequency.exponentialRampToValueAtTime(45, bar + 0.11);
      g.gain.setValueAtTime(0.0001, bar);
      g.gain.exponentialRampToValueAtTime(0.055, bar + 0.006);
      g.gain.exponentialRampToValueAtTime(0.0001, bar + 0.20);
      o.connect(g).connect(A.master);
      o.start(bar); o.stop(bar + 0.24);
    })();
    noise(bar + beat,     0.09, 6800, 1.1, 0.020, 0.3);      /* 탬버린 */
    noise(bar + beat * 2, 0.09, 6800, 1.1, 0.016, 0.3);
    if(i % 8 === 0) noise(bar, 1.1, 9000, 0.6, 0.016, 0.4);  /* 아주 약한 심벌 */

    A.bar++;
    return bar + beat * 3;
  }

  /* ── 앞질러 예약해 두는 시계 ── */
  function loop(){
    const C = A.ctx;
    const step = A.mode === "jazz" ? jazzBar : fantasyBar;
    let guard = 0;
    while(A.t < C.currentTime + 0.8 && guard++ < 8)
      A.t = step(Math.max(A.t, C.currentTime + 0.05));
  }

  /* ── 켜고 끄기 ─────────────────────────────────── */
  function stop(fade){
    if(!A.ctx) return;
    const C = A.ctx;
    clearInterval(A.timer); A.timer = null;
    A.mode = "off";
    A.master.gain.cancelScheduledValues(C.currentTime);
    A.master.gain.setValueAtTime(Math.max(0.0001, A.master.gain.value), C.currentTime);
    A.master.gain.exponentialRampToValueAtTime(0.0001, C.currentTime + (fade === 0 ? 0.05 : 0.8));
  }

  function play(mode){
    init();
    const C = A.ctx;
    C.resume?.();
    clearInterval(A.timer);
    A.mode = mode; A.bar = 0; A.t = C.currentTime + 0.15;
    const vol = mode === "jazz" ? 0.14 : 0.17;
    A.master.gain.cancelScheduledValues(C.currentTime);
    A.master.gain.setValueAtTime(0.0001, C.currentTime);
    A.master.gain.exponentialRampToValueAtTime(vol, C.currentTime + 1.8);  /* 살며시 올라온다 */
    loop();
    A.timer = setInterval(loop, 200);
  }

  function set(mode, remember){
    if(mode === "off") stop(); else play(mode);
    if(remember !== false){ try{ localStorage.setItem(KEY, mode); }catch(e){} }
    paint();
  }

  /* ── 단추 · 작은 차림표 ────────────────────────── */
  function paint(){
    const btn = $1("#bgmBtn"), txt = $1("#bgmTxt");
    if(!btn) return;
    const on = A.mode !== "off";
    btn.classList.toggle("on", on);
    if(txt) txt.textContent = on ? NAME[A.mode] : "음악";
    btn.title = on ? `${NAME[A.mode]} 재생 중 — 눌러서 바꾸거나 끄기` : "배경 음악 켜기";
    document.querySelectorAll("#bgmPop [data-m]").forEach(b =>
      b.classList.toggle("on", b.dataset.m === A.mode));
  }

  function wire(){
    const btn = $1("#bgmBtn"), pop = $1("#bgmPop");
    if(!btn || !pop) return;
    const wrap = btn.closest(".bgm") || btn.parentElement;
    btn.addEventListener("click", e => {
      e.stopPropagation();
      wrap.classList.toggle("open");
    });
    pop.addEventListener("click", e => {
      const b = e.target.closest("[data-m]"); if(!b) return;
      e.stopPropagation();
      wrap.classList.remove("open");
      set(b.dataset.m);
    });
    document.addEventListener("click", e => {
      if(!e.target.closest?.(".bgm")) wrap.classList.remove("open");
    });
    addEventListener("keydown", e => { if(e.key === "Escape") wrap.classList.remove("open"); });
    paint();

    /* 지난번에 켜 두었다면 이어서 튼다.
       다만 브라우저는 «사람이 무언가 건드리기 전» 에는 소리를 못 내게 막는다.
       그래서 첫 클릭·터치·스크롤을 기다렸다가 그때 시작한다. */
    let saved = "off";
    try{ saved = localStorage.getItem(KEY) || "off"; }catch(e){}
    if(saved === "jazz" || saved === "fantasy"){
      const evs = ["pointerdown","keydown","wheel","touchstart"];
      const kick = () => { if(A.mode === "off") set(saved, false); off(); };
      const off  = () => evs.forEach(v => removeEventListener(v, kick));
      evs.forEach(v => addEventListener(v, kick, { passive:true }));
    }
  }

  if(document.readyState === "loading")
    document.addEventListener("DOMContentLoaded", wire);
  else wire();

  window.BGM = { set, stop, get mode(){ return A.mode; } };
})();
</script>

<script>
(function(){
  'use strict';
  const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
  const KEY='gichul:done:v1', SUM='gichul:donesum:v1';
  const rd=k=>{try{return JSON.parse(localStorage.getItem(k)||'{}')}catch(e){return{}}};
  const wr=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};
  let DONE=rd(KEY);
  const qs=()=>{try{return (window.S&&Array.isArray(S.questions))?S.questions:[]}catch(e){return[]}};

  function bump(id,r){
    id=String(id); const p=DONE[id]||{n:0};
    p.n=(p.n|0)+1; p.r=r; p.at=Date.now(); DONE[id]=p; wr(KEY,DONE); paint();
  }
  function clear(id){ delete DONE[String(id)]; wr(KEY,DONE); paint(); }

  /* ── 문항줄 좌우 단추 ── */
  function buildRail(){
    const rail=$('#rail'); if(!rail||rail.parentElement.classList.contains('railhost')) return;
    const host=document.createElement('div'); host.className='railhost';
    rail.parentNode.insertBefore(host,rail); host.appendChild(rail);
    const L=document.createElement('button'); L.type='button'; L.className='railar l'; L.textContent='‹'; L.setAttribute('aria-label','문항 목록 왼쪽으로');
    const R=document.createElement('button'); R.type='button'; R.className='railar r'; R.textContent='›'; R.setAttribute('aria-label','문항 목록 오른쪽으로');
    host.append(L,R);
    const step=()=>Math.max(140,Math.round(rail.clientWidth*0.75));
    L.onclick=()=>rail.scrollBy({left:-step(),behavior:'smooth'});
    R.onclick=()=>rail.scrollBy({left:step(),behavior:'smooth'});
    const sync=()=>{ const max=rail.scrollWidth-rail.clientWidth-2;
      L.classList.toggle('off',rail.scrollLeft<=2); R.classList.toggle('off',rail.scrollLeft>=max); };
    rail.addEventListener('scroll',sync,{passive:true});
    addEventListener('resize',sync);
    new MutationObserver(()=>{setTimeout(()=>{sync();markBubs()},60)}).observe(rail,{childList:true});
    setTimeout(sync,150);
  }

  /* ── 진도 띠 ── */
  function buildBar(){
    const host=$('.railhost')||$('#rail'); if(!host||$('.wprog')) return;
    const bar=document.createElement('div'); bar.className='wprog';
    bar.innerHTML=`<span class="wlab">진도</span><b id="wPct">0%</b>
      <span class="wbar"><i class="ok" id="wOk" style="width:0"></i><i class="no" id="wNo" style="width:0"></i></span>
      <span id="wNum">0 / 0</span>
      <button type="button" class="wgo" id="wResume">이어풀기</button>`;
    host.parentNode.insertBefore(bar,host);
    $('#wResume',bar).onclick=()=>{
      const list=qs(); const i=list.findIndex(q=>!DONE[String(q.id)]);
      if(i<0) return alert('이 회차의 문항을 모두 체크했습니다.');
      if(typeof window.jump==='function') window.jump(i);
    };
  }

  /* ── 문항 머리에 체크 붙이기 ── */
  function dress(){
    $$('#track .qhead').forEach(h=>{
      const star=h.querySelector('.qstar'); const id=star?.dataset?.id; if(!id) return;
      let w=h.querySelector('.wchk');
      if(!w){
        w=document.createElement('span'); w.className='wchk';
        w.innerHTML=`<span class="wn"></span>
          <button type="button" class="ok" data-wr="ok" title="맞음 (1)">✓ 맞음</button>
          <button type="button" class="no" data-wr="no" title="틀림 (2)">✕ 틀림</button>`;
        star.parentNode.insertBefore(w,star);
        w.addEventListener('click',e=>{
          const b=e.target.closest('[data-wr]'); if(!b)return;
          e.preventDefault(); e.stopPropagation();
          const p=DONE[String(id)];
          if(p && p.r===b.dataset.wr && e.shiftKey) clear(id); else bump(id,b.dataset.wr);
        });
      }
      const p=DONE[String(id)];
      w.querySelector('.wn').textContent=p?`${p.n}회`:'';
      w.querySelector('[data-wr="ok"]').classList.toggle('on',p?.r==='ok');
      w.querySelector('[data-wr="no"]').classList.toggle('on',p?.r==='no');
    });
  }

  function markBubs(){
    const list=qs();
    $$('#rail .bub').forEach(b=>{ const q=list[+b.dataset.i]; if(!q)return;
      b.classList.toggle('done',!!DONE[String(q.id)]); });
    $$('.jb').forEach(b=>{ const q=list[+b.dataset.i]; if(!q)return;
      b.classList.toggle('done',!!DONE[String(q.id)]); });
  }

  let queued=false;
  function paint(){ if(queued)return; queued=true; requestAnimationFrame(()=>{queued=false;real()}); }
  function real(){
    const list=qs(), total=list.length;
    let ok=0,no=0;
    list.forEach(q=>{ const p=DONE[String(q.id)]; if(!p)return; p.r==='no'?no++:ok++; });
    const done=ok+no, pct=total?Math.round(done/total*100):0;
    const set=(id,v)=>{const e=document.getElementById(id); if(e)e.textContent=v};
    set('wPct',pct+'%'); set('wNum',`${done} / ${total}`);
    const a=document.getElementById('wOk'), b=document.getElementById('wNo');
    if(a)a.style.width=(total?ok/total*100:0)+'%';
    if(b)b.style.width=(total?no/total*100:0)+'%';
    const bar=document.querySelector('.wprog');
    if(bar) bar.title=`맞음 ${ok} · 틀림 ${no} · 남음 ${Math.max(0,total-done)}`;
    dress(); markBubs();
    /* 회차 목록에서도 보이도록 요약을 남긴다 */
    try{
      const ex=window.S&&S.exam; if(ex&&ex.id&&total){ const s=rd(SUM); s[ex.id]={d:done,t:total}; wr(SUM,s); }
    }catch(e){}
  }

  /* 회차 목록에 진도 막대 얹기 */
  function paintExams(){
    const s=rd(SUM);
    $$('#exams .row').forEach(row=>{
      const id=row.dataset.id; const v=s[id]; if(!v||!v.t) return;
      let p=row.querySelector('.exprog');
      if(!p){ p=document.createElement('span'); p.className='exprog'; p.innerHTML='<i></i>'; row.appendChild(p); }
      p.firstChild.style.width=Math.round(v.d/v.t*100)+'%';
      p.title=`진도 ${v.d}/${v.t}`;
    });
  }

  /* 1 · 2 단축키 */
  addEventListener('keydown',e=>{
    if(/INPUT|TEXTAREA|SELECT/.test(e.target?.tagName||''))return;
    if(e.key!=='1'&&e.key!=='2')return;
    const list=qs(); let i=0; try{ i=window.S?.idx|0 }catch(x){}
    const q=list[i]; if(!q)return;
    e.preventDefault(); bump(q.id,e.key==='1'?'ok':'no');
  });

  const boot=setInterval(()=>{
    if(!document.getElementById('rail')) return;
    clearInterval(boot);
    buildRail(); buildBar(); paint();
    const t=document.getElementById('track');
    if(t) new MutationObserver(()=>paint()).observe(t,{childList:true,subtree:true});
    const ex=document.getElementById('exams');
    if(ex) new MutationObserver(()=>paintExams()).observe(ex,{childList:true});
    setInterval(()=>{ if(document.getElementById('v-study')?.classList.contains('on')) paint(); },2500);
  },150);
  setTimeout(()=>clearInterval(boot),20000);
})();
</script>
