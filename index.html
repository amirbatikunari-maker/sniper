<!DOCTYPE html>
<html lang="ko" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="description" content="sniper 기술 블로그 · 공부와 개발 기록">
<meta name="theme-color" content="#F4F5F7">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#F4F5F7">
<title>sniper</title>
<link rel="manifest" href="./manifest.json">
<link rel="icon" href="./icon.svg">
<link rel="apple-touch-icon" href="./icon.svg">
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/static/pretendard.css">
<link rel="stylesheet" href="./style.css">
</head>
<body data-page="list">

<!-- 좁은 화면에서만 보이는 위쪽 띠 -->
<header class="top">
  <div class="topin">
    <button class="ico" id="btnMenu" title="메뉴 열기" aria-label="메뉴 열기">☰</button>
    <a class="brand" href="./index.html">
      <span id="siteTitle">sniper</span>
      <span id="siteTagline"></span>
    </a>
    <button class="ico" id="btnThemeM" title="밝게/어둡게">◐</button>
  </div>
</header>
<div class="sideScrim" id="scrim"></div>

<div class="shell">

  <aside class="side" id="side">
    <a class="brand" href="./index.html">
      <span id="siteTitle">sniper</span>
      <span id="siteTagline"></span>
    </a>

    <div class="profile" id="profile"></div>

    <button class="btn sideWrite" id="btnWriteSide">✎ 새 글 쓰기</button>

    <div class="sideSearch">
      <input id="q" type="search" placeholder="제목·본문 찾기" aria-label="제목·본문 검색" autocomplete="off"><div id="recentSearches" class="recentSearches" hidden></div>
    </div>

    <div class="sideHead">글 모음</div>
    <div class="navList" id="navFixed"></div>

    <div class="sideHead">
      카테고리
      <button id="btnCatMgr" title="게시판 만들기·이름 바꾸기·순서·삭제">관리</button>
    </div>
    <div class="navList" id="navCats"></div>

    <div class="sideHead" style="padding-top:16px">더 보기</div>
    <div class="navList">
      <a class="navItem" href="./work.html" id="navWork"><span class="nm">WORK</span><span class="badge">로그인</span></a>
      <a class="navItem" href="./about.html"><span class="nm">소개</span></a>
    </div>

    <div class="sideFoot">
      <button class="ico" id="btnTheme" title="밝게/어둡게">◐</button>
      <button class="ico" id="btnSetup" title="화면 설정">⚙</button>
      <button class="ico" id="btnDock" title="AI 를 오른쪽에 붙박이로">▤</button>
      <button class="btn ghost sm" id="btnUser" style="flex:1">로그인</button>
    </div>
  </aside>

  <main id="main" class="main">
    <div class="mainIn">
      <div class="listBar">
        <h1 id="viewTitle">전체</h1>
        <span class="cnt" id="cnt"></span>
        <span class="sp"></span>
        <select class="sortSel" id="sortSel" title="정렬">
          <option value="new">최신순</option>
          <option value="old">오래된순</option>
          <option value="views">조회 많은순</option>
          <option value="title">제목순</option>
        </select>
        <div class="seg" id="viewSeg">
          <button data-v="rows">목록</button>
          <button data-v="cards">카드</button>
        </div>
      </div>
      <div id="list">
        <div class="skel"></div><div class="skel"></div><div class="skel"></div>
      </div>
      <footer class="madeby" id="madeby"></footer>
    </div>
  </main>

</div>

<button class="fabWrite" id="btnWrite" title="새 글 쓰기">✎ 글쓰기</button><div class="cmdPal" id="cmdPal" hidden role="dialog" aria-modal="true" aria-label="빠른 명령"><div class="cmdBox"><input id="cmdInput" placeholder="검색 · 글쓰기 · WORK …" autocomplete="off"><div id="cmdList"></div><div class="cmdHint">Enter 실행 · Esc 닫기</div></div></div>

<div class="bulk" id="bulk">
  <span id="bulkCnt">0개 고름</span>
  <button id="bulkPub">공개로</button>
  <button id="bulkArch">보관함</button>
  <button class="del" id="bulkDel">지우기</button>
  <button id="bulkNone">해제</button>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="./config.js"></script>
<script src="./app.js"></script>
<script src="./ai-chat.js" defer></script>
<script src="./ai-plus.js" defer></script>
<script src="./music.js" defer></script>
<script>
const { sb, $, $$, esc, fmtDate, toast, ask } = App;

let CATS = [], POSTS = [], SEL = "all", KEY = "", VIEW = "rows", SORT = "new";
let DEEP = new Set(), PICKED = new Set();

/* 왼쪽 «글 모음» 칸 — 관리자만 보이는 것도 있다 */
const FIXED = [
  { k:"all",       nm:"전체 글",  admin:false },
  { k:"pinned",    nm:"고정한 글", admin:false },
  { k:"draft",     nm:"초안",      admin:true  },
  { k:"archived",  nm:"보관함",    admin:true  },
];

/* ── 시작 ───────────────────────────────────────────── */
(async function start(){
  await App.loadSettings();
  await App.refreshMe();
  VIEW = App.settings.view === "cards" ? "cards" : "rows";
  SORT = App.settings.sort || "new";
  App.drawProfile();
  App.drawMadeBy();
  App.initDock();
  wire();

  if(!sb){
    $("#list").innerHTML = `<div class="empty"><b>Supabase 설정이 비어 있습니다</b>
      config.js 의 SUPABASE_URL 과 키를 채워 주세요.</div>`;
    return;
  }
  await loadCats();
  await loadPosts();
})();

/* ── 단추 연결 ─────────────────────────────────────── */
function wire(){
  const side = $("#side"), scrim = $("#scrim");
  const openSide  = () => document.body.classList.add("sideOpen");
  const closeSide = () => document.body.classList.remove("sideOpen");
  $("#btnMenu").onclick = openSide;
  scrim.onclick = closeSide;
  side.addEventListener("click", e => { if(e.target.closest(".navItem")) closeSide(); });

  const flipTheme = () => {
    const now = App.settings.theme;
    const next = now === "dark" ? "light" : (now === "light" ? "auto" : "dark");
    App.saveSettings({ theme: next });
    toast(next === "auto" ? "기기 설정을 따라갑니다" : (next === "dark" ? "어둡게" : "밝게"));
  };
  $("#btnTheme").onclick = flipTheme;
  $("#btnThemeM").onclick = flipTheme;

  $("#btnSetup").onclick = setupBox;
  $("#btnCatMgr").onclick = catBox;
  $("#btnUser").onclick = () => App.loginBox();
  $("#btnWrite").onclick = $("#btnWriteSide").onclick = () => location.href = "./write.html";

  $$("#viewSeg button").forEach(b => b.onclick = () => {
    VIEW = b.dataset.v;
    App.saveSettings({ view: VIEW });
    drawSeg(); draw();
  });
  drawSeg();

  $("#sortSel").value = SORT;
  $("#sortSel").onchange = e => {
    SORT = e.target.value;
    App.saveSettings({ sort: SORT });
    draw();
  };

  // «/» 를 누르면 바로 찾기 칸으로
  document.addEventListener("keydown", e => {
    if(e.key === "/" && !/^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement?.tagName)){
      e.preventDefault();
      document.body.classList.add("sideOpen");
      $("#q").focus(); $("#q").select();
    }
    if(e.key === "Escape"){ document.body.classList.remove("sideOpen"); closeCmd(); }
    if((e.ctrlKey||e.metaKey) && e.key.toLowerCase()==='k'){ e.preventDefault(); openCmd(); }
  });


  const recentKey = "sniper.recentSearches";
  function recent(){ try{return JSON.parse(localStorage.getItem(recentKey)||"[]");}catch{return [];} }
  function paintRecent(){ const r=recent(); const box=$("#recentSearches"); if(!box)return; box.innerHTML=r.map(x=>`<button type="button" data-rsearch="${esc(x)}">${esc(x)}</button>`).join(""); box.hidden=!r.length; $$("[data-rsearch]",box).forEach(b=>b.onclick=()=>{ $("#q").value=b.dataset.rsearch; KEY=b.dataset.rsearch; DEEP=new Set(); box.hidden=true; draw(); deepSearch(); }); }
  function rememberSearch(k){ if(!k)return; const a=[k,...recent().filter(x=>x!==k)].slice(0,8); try{localStorage.setItem(recentKey,JSON.stringify(a));}catch{} }
  $("#q").addEventListener("focus",paintRecent);
  $("#q").addEventListener("keydown",e=>{ if(e.key==='Enter' && KEY) rememberSearch(KEY); if(e.key==='Escape') $("#recentSearches").hidden=true; });

  let hTimer = null;
  $("#q").addEventListener("input", e => {
    KEY = e.target.value.trim();
    DEEP = new Set();
    draw();
    clearTimeout(hTimer);
    hTimer = setTimeout(deepSearch, 350);
  });

  $("#bulkNone").onclick = () => { PICKED.clear(); draw(); };
  $("#bulkDel").onclick  = bulkDelete;
  $("#bulkPub").onclick  = () => bulkStatus("published", "공개로 돌렸습니다");
  $("#bulkArch").onclick = () => bulkStatus("archived", "보관함으로 옮겼습니다");

  if(App.me) $("#btnUser").textContent = App.canEdit() ? "내 계정" : "권한 없음";
  const work = $("#navWork");
  if(work){
    if(App.me){ work.querySelector(".badge")?.remove(); }
    else work.classList.add("mutedNav");
    work.onclick = e => {
      if(!App.me){ e.preventDefault(); App.loginBox(); }
    };
  }
}

function openCmd(){ const p=$("#cmdPal"); if(!p)return; p.hidden=false; const i=$("#cmdInput"); i.value=""; paintCmd(""); i.focus(); }
function closeCmd(){ const p=$("#cmdPal"); if(p)p.hidden=true; }
function paintCmd(q){ const rows=[{k:"search",t:"글 검색",s:"검색창으로 이동"},{k:"write",t:"새 글 쓰기",s:"작성 화면"},{k:"work",t:"WORK",s:"코딩 에이전트"},{k:"theme",t:"테마 전환",s:"밝게 / 어둡게"}].filter(x=>(x.t+x.s).toLowerCase().includes(String(q).toLowerCase())); const b=$("#cmdList"); if(!b)return; b.innerHTML=rows.map((x,i)=>`<button class="cmdItem" data-cmd="${x.k}" ${i===0?'data-active="1"':''}><b>${x.t}</b><span>${x.s}</span></button>`).join(""); $$("[data-cmd]",b).forEach(x=>x.onclick=()=>runCmd(x.dataset.cmd)); }
function runCmd(k){ closeCmd(); if(k==='search'){ $("#q").focus(); return; } if(k==='write'){location.href='./write.html';return;} if(k==='work'){ if(App.me)location.href='./work.html'; else App.loginBox(); return;} if(k==='theme'){ const n=App.settings.theme==='dark'?'light':'dark'; App.saveSettings({theme:n}); }}

function drawSeg(){
  $$("#viewSeg button").forEach(b => b.classList.toggle("on", b.dataset.v === VIEW));
}

/* ── 카테고리 ───────────────────────────────────────── */
async function loadCats(){
  const { data, error } = await sb.from("blog_categories").select("*").order("sort_order").order("name");
  if(error){
    $("#list").innerHTML = `<div class="empty"><b>표가 아직 없습니다</b>
      02-blog.sql 을 Supabase SQL Editor 에서 한 번 돌려 주세요.<br>
      <span class="muted sm">${esc(error.message)}</span></div>`;
    return;
  }
  CATS = data || [];
  drawNav();
}

function countOf(kind){
  if(kind === "all")      return POSTS.filter(p => p.status === "published").length;
  if(kind === "pinned")   return POSTS.filter(p => p.pinned).length;
  if(kind === "draft")    return POSTS.filter(p => p.status === "draft").length;
  if(kind === "archived") return POSTS.filter(p => p.status === "archived").length;
  const branch = new Set(App.catBranch(CATS, kind));
  return POSTS.filter(p => branch.has(String(p.category_id)) && p.status !== "archived").length;
}

let FOLDED = new Set(JSON.parse(localStorage.getItem("blog:folded") || "[]"));

function saveFolded(){
  try{ localStorage.setItem("blog:folded", JSON.stringify([...FOLDED])); }catch{}
}

function drawNav(){
  const admin = App.canEdit();
  $("#navFixed").innerHTML = FIXED.filter(f => !f.admin || admin).map(f =>
    `<button class="navItem${SEL===f.k?" on":""}" data-c="${f.k}">
       <span class="nm">${f.nm}</span><span class="ct">${countOf(f.k)}</span></button>`).join("");

  const tree = App.catTree(CATS);
  const hasKid = id => CATS.some(c => String(c.parent_id) === String(id));

  // 접힌 부모 밑에 있는 것은 감춘다
  const hidden = new Set();
  for(const c of tree){
    const pid = c.parent_id == null ? null : String(c.parent_id);
    if(pid && (FOLDED.has(pid) || hidden.has(pid))) hidden.add(String(c.id));
  }

  $("#navCats").innerHTML = tree.length
    ? tree.map(c => {
        const id = String(c.id), kid = hasKid(c.id), fold = FOLDED.has(id);
        return `<button class="navItem${SEL===id?" on":""}${hidden.has(id)?" navHidden":""}"
                  data-c="${id}" data-depth="${c.depth}">
          ${kid ? `<span class="navTw" data-tw="${id}" title="${fold?"펼치기":"접기"}">${fold?"▸":"▾"}</span>`
                : `<span class="dot" style="background:${esc(c.color||"#9CA3AF")}"></span>`}
          <span class="nm">${c.emoji?c.emoji+" ":""}${esc(c.name)}</span>
          <span class="ct">${countOf(c.id)}</span></button>`;
      }).join("")
    : `<p class="muted sm" style="padding:4px 9px">아직 없습니다.${admin?" 위 «관리» 로 만드세요.":""}</p>`;

  $$("#navCats .navTw").forEach(t => t.onclick = e => {
    e.stopPropagation();
    const id = t.dataset.tw;
    FOLDED.has(id) ? FOLDED.delete(id) : FOLDED.add(id);
    saveFolded(); drawNav();
  });

  $$(".navItem[data-c]").forEach(b => b.onclick = () => {
    SEL = b.dataset.c; PICKED.clear(); drawNav(); draw();
  });
}

/* ── 글 ─────────────────────────────────────────────── */
async function loadPosts(){
  let q = sb.from("blog_posts")
    .select("id,slug,title,excerpt,cover_url,category_id,tags,status,pinned,view_count,published_at,updated_at")
    .order("pinned", { ascending:false })
    .order("published_at", { ascending:false, nullsFirst:false })
    .order("updated_at", { ascending:false })
    .limit(300);
  if(!App.canEdit()) q = q.eq("status","published");

  const { data, error } = await q;
  if(error){
    $("#list").innerHTML = `<div class="empty"><b>글을 못 읽었습니다</b>
      <span class="muted sm">${esc(error.message)}</span></div>`;
    return;
  }
  POSTS = data || [];
  drawNav();
  draw();
}

let searching = false;
async function deepSearch(){
  const k = KEY;
  if(!sb || k.length < 2 || searching) return;
  searching = true;
  try{
    const pat = `%${k.replace(/[%_]/g, m => "\\" + m)}%`;
    let q = sb.from("blog_posts")
      .select("id,slug,title,excerpt,cover_url,category_id,tags,status,pinned,view_count,published_at,updated_at")
      .or(`title.ilike.${pat},body_text.ilike.${pat},excerpt.ilike.${pat}`)
      .order("published_at", { ascending:false, nullsFirst:false })
      .limit(60);
    if(!App.canEdit()) q = q.eq("status","published");

    const { data, error } = await q;
    if(error || !data) return;
    const have = new Set(POSTS.map(p => p.id));
    POSTS = POSTS.concat(data.filter(p => !have.has(p.id)));
    DEEP = new Set([...(DEEP||[]), ...data.map(p => p.id)]);
    if(KEY === k){ drawNav(); draw(); }
  }catch{}
  finally{ searching = false; }
}

function visible(){
  let rows = POSTS;
  if(SEL === "all")            rows = rows.filter(p => p.status === "published");
  else if(SEL === "pinned")    rows = rows.filter(p => p.pinned);
  else if(SEL === "draft")     rows = rows.filter(p => p.status === "draft");
  else if(SEL === "archived")  rows = rows.filter(p => p.status === "archived");
  else {
    // 하위 게시판이 있으면 그 안의 글까지 함께 보여 줍니다
    const branch = new Set(App.catBranch(CATS, SEL));
    rows = rows.filter(p => branch.has(String(p.category_id)) && p.status !== "archived");
  }

  if(KEY){
    const k = KEY.toLowerCase();
    rows = rows.filter(p =>
      (p.title||"").toLowerCase().includes(k) ||
      (p.excerpt||"").toLowerCase().includes(k) ||
      (p.tags||[]).some(t => t.toLowerCase().includes(k)) ||
      DEEP.has(p.id));
  }

  // 고정한 글은 어떤 정렬에서도 늘 맨 위
  const when = p => new Date(p.published_at || p.updated_at || 0).getTime();
  const by = {
    new:   (a,b) => when(b) - when(a),
    old:   (a,b) => when(a) - when(b),
    views: (a,b) => (b.view_count||0) - (a.view_count||0),
    title: (a,b) => (a.title||"").localeCompare(b.title||"", "ko"),
  }[SORT] || ((a,b) => when(b) - when(a));

  return [...rows].sort((a,b) => (b.pinned?1:0) - (a.pinned?1:0) || by(a,b));
}

function titleOf(){
  const f = FIXED.find(x => x.k === SEL);
  if(f) return f.nm;
  const c = CATS.find(x => String(x.id) === SEL);
  return c ? (c.emoji?c.emoji+" ":"") + c.name : "전체 글";
}

function draw(){
  const rows = visible();
  $("#viewTitle").textContent = titleOf();
  $("#cnt").textContent = KEY ? `${rows.length}건 찾음` : `${rows.length}`;

  if(!rows.length){
    $("#list").innerHTML = `<div class="empty">
      <b>${KEY ? "찾는 글이 없습니다" : "아직 글이 없습니다"}</b>
      ${KEY ? "제목·본문·태그를 모두 뒤졌습니다. 다른 낱말로 찾아보세요."
            : (App.canEdit() ? "왼쪽 «새 글 쓰기» 로 첫 글을 남겨 보세요." : "곧 채워집니다.")}
    </div>`;
    drawBulk();
    return;
  }

  const catOf = id => CATS.find(c => c.id === id);
  const badges = p => `
    ${p.pinned ? `<span class="pin-b">고정</span>` : ""}
    ${p.status !== "published" ? `<span class="draft">${p.status==="draft"?"초안":"보관"}</span>` : ""}`;
  const tagHtml = (p, n) => (p.tags||[]).slice(0, n)
    .map(t => `<span class="tag" data-tag="${esc(t)}">#${esc(t)}</span>`).join("");

  if(VIEW === "cards"){
    $("#list").className = "cards";
    $("#list").innerHTML = rows.map(p => {
      const c = catOf(p.category_id);
      return `<div class="card-i">
        <a href="./post.html?id=${p.id}" style="text-decoration:none;color:inherit;display:block">
          ${p.cover_url ? `<img class="cover" src="${esc(p.cover_url)}" alt="${esc(p.title)}" loading="lazy">` : ""}
          <div class="in">
            <div class="sub">
              ${c ? `<span class="d" style="background:${esc(c.color||"#9CA3AF")}"></span>${esc(c.name)}` : ""}
              <span class="when">${fmtDate(p.published_at || p.updated_at)}</span>
              ${badges(p)}
            </div>
            <h2>${esc(p.title)}</h2>
            ${p.excerpt ? `<p>${esc(p.excerpt)}</p>` : ""}
          </div>
        </a>
        <div class="acts">
          <button title="수정" data-edit="${p.id}">✎</button>
          <button class="del" title="지우기" data-del="${p.id}">🗑</button>
        </div>
      </div>`;
    }).join("");
  }else{
    // 제목은 왼쪽, 요약이 가운데를 채우고, 분류·날짜는 오른쪽 끝에 붙는다
    $("#list").className = "rows";
    $("#list").innerHTML = rows.map(p => {
      const c = catOf(p.category_id);
      return `<div class="row-i">
        <input class="sel" type="checkbox" data-pick="${p.id}" ${PICKED.has(p.id)?"checked":""} title="고르기">
        ${p.cover_url ? `<img class="thumb" src="${esc(p.cover_url)}" alt="${esc(p.title)}" loading="lazy">` : ""}
        <a class="txt" href="./post.html?id=${p.id}">
          <span class="ttl">${esc(p.title)}</span>
          ${p.excerpt ? `<span class="exc">${esc(p.excerpt)}</span>` : `<span class="exc"></span>`}
        </a>
        <div class="rmeta">
          ${badges(p)}
          ${tagHtml(p, 1)}
          ${c ? `<span class="catb"><i class="d" style="background:${esc(c.color||"#9CA3AF")}"></i>${esc(c.name)}</span>` : ""}
          <span class="when">${fmtDate(p.published_at || p.updated_at)}</span>
        </div>
        <div class="acts">
          <button title="수정" data-edit="${p.id}">✎</button>
          <button class="del" title="지우기" data-del="${p.id}">🗑</button>
        </div>
      </div>`;
    }).join("");
  }

  $$("[data-edit]").forEach(b => b.onclick = e => {
    e.preventDefault(); location.href = "./write.html?id=" + b.dataset.edit;
  });
  $$("[data-del]").forEach(b => b.onclick = e => { e.preventDefault(); delOne(b.dataset.del); });
  $$("[data-pick]").forEach(b => b.onchange = () => {
    b.checked ? PICKED.add(b.dataset.pick) : PICKED.delete(b.dataset.pick);
    drawBulk();
  });
  // 태그를 누르면 그 태그로 찾는다
  $$("[data-tag]").forEach(b => b.onclick = e => {
    e.preventDefault(); e.stopPropagation();
    KEY = b.dataset.tag;
    $("#q").value = KEY;
    SEL = "all"; DEEP = new Set();
    drawNav(); draw();
  });
  drawBulk();
}

/* ── 지우기 ────────────────────────────────────────── */
function drawBulk(){
  const n = PICKED.size;
  $("#bulk").classList.toggle("on", n > 0);
  $("#bulkCnt").textContent = `${n}개 고름`;
}

async function delOne(id){
  const p = POSTS.find(x => String(x.id) === String(id));
  const ok = await ask("이 글을 지웁니다", `«${esc(p?.title || "제목 없음")}» — 되돌릴 수 없습니다.`, "지우기", true);
  if(!ok) return;
  try{
    await App.deletePosts([id]);
    POSTS = POSTS.filter(x => String(x.id) !== String(id));
    PICKED.delete(id);
    drawNav(); draw();
    toast("지웠습니다");
  }catch(e){ toast(e.message, "err"); }
}

async function bulkDelete(){
  const n = PICKED.size;
  const ok = await ask(`${n}개 글을 지웁니다`, "되돌릴 수 없습니다.", "지우기", true);
  if(!ok) return;
  try{
    const ids = [...PICKED];
    await App.deletePosts(ids);
    POSTS = POSTS.filter(p => !PICKED.has(p.id));
    PICKED.clear();
    drawNav(); draw();
    toast(`${n}개를 지웠습니다`);
  }catch(e){ toast(e.message, "err"); }
}

async function bulkStatus(status, msg){
  try{
    const ids = [...PICKED];
    await App.setPostStatus(ids, status);
    POSTS.forEach(p => { if(PICKED.has(p.id)) p.status = status; });
    PICKED.clear();
    drawNav(); draw();
    toast(msg);
  }catch(e){ toast(e.message, "err"); }
}

/* ── 카테고리 관리 ──────────────────────────────────── */
function catBox(){
  if(!App.canEdit()) return toast("로그인해야 게시판을 손댈 수 있습니다.", "err");

  const ov = document.createElement("div");
  ov.className = "ov";
  ov.innerHTML = `<div class="ovbox" style="max-width:560px">
    <h3>게시판 관리</h3>
    <p class="muted sm">이름·색을 바로 고칠 수 있습니다. «상위» 를 정하면 하위 게시판이 됩니다.
       ↑↓ 는 같은 층 안에서 순서를 바꿉니다.</p>
    <div id="catList" style="margin:10px 0 4px"></div>

    <label>새 게시판 만들기</label>
    <div class="catRow">
      <input type="text" id="ncEmoji" placeholder="🛠" style="width:46px;flex:none;text-align:center">
      <input type="text" id="ncName" placeholder="이름 (예: 설비 점검)">
      <select id="ncParent" style="width:130px;flex:none;margin:0;padding:6px 8px;font-size:13px"></select>
      <input type="color" id="ncColor" value="#1D4ED8">
      <button class="btn sm" id="ncAdd">추가</button>
    </div>

    <div class="row" style="justify-content:flex-end;margin-top:16px">
      <button class="btn ghost" id="ncClose">닫기</button>
    </div>
  </div>`;
  document.body.appendChild(ov);
  ov.onclick = e => { if(e.target === ov) ov.remove(); };
  $("#ncClose", ov).onclick = () => ov.remove();

  /* 상위로 고를 수 있는 목록 — 자기 자신과 «자기 밑에 있는 것» 은 뺍니다 */
  const parentOpts = (self) => {
    const banned = self ? new Set(App.catBranch(CATS, self)) : new Set();
    const tree = App.catTree(CATS);
    return `<option value="">— 최상위 —</option>` + tree
      .filter(c => !banned.has(String(c.id)) && c.depth < 2)
      .map(c => `<option value="${c.id}">${"　".repeat(c.depth)}${esc(c.name)}</option>`).join("");
  };

  const paint = () => {
    const tree = App.catTree(CATS);
    $("#catList", ov).innerHTML = tree.length ? tree.map((c,i) => `
      <div class="catRow" data-id="${c.id}" style="padding-left:${c.depth*16}px">
        ${c.depth ? `<span style="color:var(--ink-3);font-size:11px">└</span>` : ""}
        <input type="text" value="${esc(c.emoji||"")}" data-f="emoji"
               style="width:42px;flex:none;text-align:center" placeholder="—">
        <input type="text" value="${esc(c.name)}" data-f="name">
        <select data-f="parent_id" style="width:120px;flex:none;margin:0;padding:5px 7px;font-size:12.5px"
                title="상위 게시판">${parentOpts(c.id)}</select>
        <input type="color" value="${esc(c.color||"#9CA3AF")}" data-f="color">
        <button class="mini" data-up="${i}" title="위로">↑</button>
        <button class="mini" data-down="${i}" title="아래로">↓</button>
        <button class="mini del" data-del="${c.id}" title="지우기">🗑</button>
      </div>`).join("") : `<p class="muted">아직 없습니다.</p>`;

    // 상위 선택값 채우기
    $$("#catList .catRow", ov).forEach(row => {
      const c = CATS.find(x => String(x.id) === row.dataset.id);
      const sel = $('[data-f="parent_id"]', row);
      if(sel) sel.value = c?.parent_id ? String(c.parent_id) : "";
    });

    $("#ncParent", ov).innerHTML = parentOpts(null);

    /* 고치면 바로 저장 */
    $$("#catList [data-f]", ov).forEach(inp => inp.onchange = async () => {
      const id = inp.closest(".catRow").dataset.id;
      const f = inp.dataset.f;
      let val = inp.value;

      if(f === "parent_id"){
        const patch = { parent_id: val ? +val : null };
        const { error } = await sb.from("blog_categories").update(patch).eq("id", id);
        if(error) return toast(error.message.includes("column") 
          ? "03-upgrade.sql 을 먼저 돌려 주세요 (parent_id 칸이 없습니다)." : error.message, "err");
      } else {
        const patch = { [f]: (val||"").trim() || null };
        if(f === "name"){
          if(!patch.name) return paint();
          patch.slug = App.slugify(patch.name);
        }
        const { error } = await sb.from("blog_categories").update(patch).eq("id", id);
        if(error) return toast(error.message, "err");
      }
      await loadCats(); paint(); draw();
    });

    /* 같은 층 안에서 순서 바꾸기 */
    const move = async (from, to) => {
      const arr = App.catTree(CATS);
      if(to < 0 || to >= arr.length) return;
      const a = arr[from], b = arr[to];
      if(String(a.parent_id||"") !== String(b.parent_id||"")) return toast("같은 층 안에서만 옮길 수 있습니다.");
      const sa = a.sort_order ?? from, sbo = b.sort_order ?? to;
      await sb.from("blog_categories").update({ sort_order: sbo }).eq("id", a.id);
      await sb.from("blog_categories").update({ sort_order: sa }).eq("id", b.id);
      await loadCats(); paint(); draw();
    };
    $$("[data-up]", ov).forEach(b => b.onclick = () => move(+b.dataset.up, +b.dataset.up - 1));
    $$("[data-down]", ov).forEach(b => b.onclick = () => move(+b.dataset.down, +b.dataset.down + 1));

    $$("#catList [data-del]", ov).forEach(b => b.onclick = async () => {
      const id = b.dataset.del;
      const c = CATS.find(x => String(x.id) === id);
      const branch = App.catBranch(CATS, id);
      const kids = branch.length - 1;
      const n = POSTS.filter(p => branch.includes(String(p.category_id))).length;
      const ok = await ask(`«${esc(c?.name||"")}» 을 지웁니다`,
        [kids ? `하위 게시판 ${kids}개도 함께 지워집니다.` : "",
         n ? `안에 든 글 ${n}개는 지워지지 않고 «분류 없음» 이 됩니다.` : "글은 없습니다."]
          .filter(Boolean).join("<br>"), "지우기", true);
      if(!ok) return;
      const { error } = await sb.from("blog_categories").delete().eq("id", id);
      if(error) return toast(error.message, "err");
      if(branch.includes(SEL)) SEL = "all";
      await loadCats(); await loadPosts(); paint();
    });
  };
  paint();

  $("#ncAdd", ov).onclick = async () => {
    const name = $("#ncName", ov).value.trim();
    if(!name) return $("#ncName", ov).focus();
    const parent = $("#ncParent", ov).value;
    const row = {
      slug: App.slugify(name), name,
      emoji: $("#ncEmoji", ov).value.trim() || null,
      color: $("#ncColor", ov).value,
      sort_order: CATS.filter(c => String(c.parent_id||"") === String(parent||"")).length + 1,
    };
    if(parent) row.parent_id = +parent;

    const { error } = await sb.from("blog_categories").insert(row);
    if(error) return toast(error.message.includes("parent_id")
      ? "03-upgrade.sql 을 먼저 돌려 주세요 (parent_id 칸이 없습니다)." : error.message, "err");
    $("#ncName", ov).value = ""; $("#ncEmoji", ov).value = "";
    await loadCats(); paint();
  };
  $("#ncName", ov).addEventListener("keydown", e => { if(e.key === "Enter") $("#ncAdd", ov).click(); });
}

/* ── 화면 설정 ──────────────────────────────────────── */

/* 밝은 것부터 어두운 것까지 골고루. 어떤 걸 골라도 글자색은 자동으로 맞습니다. */
const ACCENTS = [
  "#1D4ED8","#2563EB","#0EA5E9","#0891B2","#0F766E","#059669",
  "#65A30D","#CA8A04","#EA580C","#DC2626","#BE123C","#DB2777",
  "#9333EA","#6D28D9","#4F46E5","#475569","#7C3F1D","#111827",
];

function setupBox(){
  const s = App.settings;
  const ov = document.createElement("div");
  ov.className = "ov";
  ov.innerHTML = `<div class="ovbox">
    <h3>화면 설정</h3>

    <label>블로그 이름</label>
    <input id="stTitle" value="${esc(s.title)}">
    <input id="stTag" value="${esc(s.tagline)}" placeholder="한 줄 소개">

    <label>밝기</label>
    <div class="chips" id="stTheme">
      ${[["auto","기기 따라"],["light","밝게"],["dark","어둡게"]]
        .map(([k,t])=>`<button class="chip${s.theme===k?" on":""}" data-v="${k}">${t}</button>`).join("")}
    </div>

    <label>강조색</label>
    <div class="swatches" id="stAccent">
      ${ACCENTS.map(c=>`<button class="sw${(s.accent||"").toLowerCase()===c.toLowerCase()?" on":""}"
          data-v="${c}" style="background:${c}" title="${c}"></button>`).join("")}
      <span class="swPick" title="직접 고르기">＋<input type="color" id="stAccPick" value="${esc(s.accent||"#1D4ED8")}"></span>
    </div>
    <div class="accPeek" id="accPeek">
      연한 배경 위 글자
      <span class="chipDemo">색 위 글자</span>
      <code id="accHex">${esc((s.accent||"#1D4ED8").toUpperCase())}</code>
    </div>

    <label>배경</label>
    <div class="chips" id="stBgKind">
      ${[["plain","없음"],["gradient","그러데이션"],["pattern","무늬"],["image","사진"]]
        .map(([k,t])=>`<button class="chip${s.bg_kind===k?" on":""}" data-v="${k}">${t}</button>`).join("")}
    </div>
    <div id="stBgVal" style="margin-top:8px"></div>

    <label>배경 흐리기 <span id="lbBlur" class="muted sm">${s.bg_blur||0}px</span></label>
    <input class="range" id="stBlur" type="range" min="0" max="24" value="${s.bg_blur||0}">
    <label>배경 연하게 <span id="lbDim" class="muted sm">${s.bg_dim||0}%</span></label>
    <input class="range" id="stDim" type="range" min="0" max="90" value="${s.bg_dim||0}">

    <label>글꼴 · 본문 폭</label>
    <div class="chips" id="stFont">
      ${[["pretendard","고딕"],["serif","명조"],["mono","고정폭"]]
        .map(([k,t])=>`<button class="chip${s.font===k?" on":""}" data-v="${k}">${t}</button>`).join("")}
      <span style="width:10px"></span>
      ${[["narrow","좁게"],["wide","넓게"]]
        .map(([k,t])=>`<button class="chip${s.width===k?" on":""}" data-w="${k}">${t}</button>`).join("")}
    </div>

    <label>맨 아래 만든이 줄</label>
    <div class="chips" id="stFooter">
      <button class="chip${s.footer_on===false?"":" on"}" data-fo="1">보이기</button>
      <button class="chip${s.footer_on===false?" on":""}" data-fo="0">숨기기</button>
    </div>
    <input id="stFooterTxt" style="margin-top:7px" placeholder="덧붙일 한마디 (선택)"
           value="${esc(s.footer_text||"")}">

    <div class="row" style="justify-content:flex-end;margin-top:16px">
      <button class="btn" id="stClose">다 됐어요</button>
    </div>
    ${App.canEdit()?"":`<p class="muted sm">로그인하면 이 설정이 다른 기기에도 따라옵니다.</p>`}
  </div>`;
  document.body.appendChild(ov);
  ov.onclick = e => { if(e.target === ov) ov.remove(); };
  $("#stClose", ov).onclick = () => ov.remove();

  const pick = (sel, attr, key) => $$(sel + " [data-"+attr+"]", ov).forEach(b => b.onclick = () => {
    $$(sel + " [data-"+attr+"]", ov).forEach(x => x.classList.remove("on"));
    b.classList.add("on");
    App.saveSettings({ [key]: b.dataset[attr] });
    if(key === "bg_kind") bgVals();
  });

  pick("#stTheme",  "v", "theme");
  pick("#stBgKind", "v", "bg_kind");
  pick("#stFont",   "v", "font");

  // 강조색 — 프리셋을 누르거나 색판에서 직접 고르거나
  const setAccent = hex => {
    App.saveSettings({ accent: hex });
    App.drawMadeBy();
    $("#accHex", ov).textContent = hex.toUpperCase();
    $("#stAccPick", ov).value = hex;
    $$("#stAccent .sw", ov).forEach(x =>
      x.classList.toggle("on", x.dataset.v.toLowerCase() === hex.toLowerCase()));
  };
  $$("#stAccent .sw", ov).forEach(b => b.onclick = () => setAccent(b.dataset.v));
  $("#stAccPick", ov).oninput = e => setAccent(e.target.value);
  $$("#stFont [data-w]", ov).forEach(b => b.onclick = () => {
    $$("#stFont [data-w]", ov).forEach(x => x.classList.remove("on"));
    b.classList.add("on"); App.saveSettings({ width: b.dataset.w });
  });

  $$("#stFooter [data-fo]", ov).forEach(b => b.onclick = () => {
    $$("#stFooter [data-fo]", ov).forEach(x => x.classList.remove("on"));
    b.classList.add("on");
    App.saveSettings({ footer_on: b.dataset.fo === "1" });
    App.drawMadeBy();
  });
  $("#stFooterTxt", ov).oninput = e => {
    App.saveSettings({ footer_text: e.target.value });
    App.drawMadeBy();
  };

  $("#stTitle", ov).oninput = e => { App.saveSettings({ title: e.target.value }); App.drawMadeBy(); };
  $("#stTag", ov).oninput   = e => App.saveSettings({ tagline: e.target.value });
  $("#stBlur", ov).oninput  = e => { $("#lbBlur", ov).textContent = e.target.value+"px"; App.saveSettings({ bg_blur:+e.target.value }); };
  $("#stDim", ov).oninput   = e => { $("#lbDim", ov).textContent = e.target.value+"%";  App.saveSettings({ bg_dim:+e.target.value }); };

  function bgVals(){
    const k = App.settings.bg_kind, box = $("#stBgVal", ov);
    if(k === "plain"){ box.innerHTML = ""; return; }

    if(k === "image"){
      box.innerHTML = `<input id="bgUrl" placeholder="사진 주소(https://…)" value="${esc(App.settings.bg_value||"")}">
        <div class="row"><button class="btn ghost sm" id="bgUp">기기에서 고르기</button></div>
        <input type="file" id="bgFile" accept="image/*" hidden>`;
      $("#bgUrl", ov).oninput = e => App.saveSettings({ bg_value: e.target.value.trim() });
      $("#bgUp", ov).onclick = () => $("#bgFile", ov).click();
      $("#bgFile", ov).onchange = async e => {
        const f = e.target.files[0]; if(!f) return;
        if(!App.canEdit()) return toast("로그인해야 사진을 올릴 수 있습니다.", "err");
        try{
          toast("올리는 중…");
          const { url } = await App.uploadImage(f, "bg");
          $("#bgUrl", ov).value = url;
          App.saveSettings({ bg_value: url });
          toast("배경을 바꿨습니다");
        }catch(err){ toast(err.message, "err"); }
      };
      return;
    }

    const src = k === "gradient" ? App.GRADIENTS : App.PATTERNS;
    box.innerHTML = `<div class="chips">` + Object.keys(src).map(n =>
      `<button class="chip${App.settings.bg_value===n?" on":""}" data-bv="${esc(n)}">${esc(n)}</button>`).join("") + `</div>`;
    $$("[data-bv]", box).forEach(b => b.onclick = () => {
      $$("[data-bv]", box).forEach(x => x.classList.remove("on"));
      b.classList.add("on"); App.saveSettings({ bg_value: b.dataset.bv });
    });
  }
  bgVals();
}
</script>
</body>
</html>
