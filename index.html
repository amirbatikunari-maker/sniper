<!DOCTYPE html>
<html lang="ko" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#F6F7F9">
<title>sniper</title>
<link rel="manifest" href="./manifest.json">
<link rel="icon" href="./icon.svg">
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/static/pretendard.css">
<link rel="stylesheet" href="./style.css">
</head>
<body data-page="list">

<header class="top">
  <div class="topin">
    <a class="brand" href="./index.html">
      <span id="siteTitle">sniper</span>
      <span id="siteTagline"></span>
    </a>
    <button class="ico" id="btnSearch" title="찾기">🔍</button>
    <button class="ico" id="btnTheme"  title="밝게/어둡게">◐</button>
    <button class="ico" id="btnSetup"  title="화면 설정">⚙</button>
    <button class="ico" id="btnUser"   title="로그인">👤</button>
  </div>
</header>

<main class="wrap">
  <input class="search" id="q" type="search" placeholder="제목·본문에서 찾기" hidden>
  <div class="cats" id="cats"></div>
  <div class="list" id="list">
    <div class="skel"></div><div class="skel"></div><div class="skel"></div>
  </div>
</main>

<button class="fabWrite" id="btnWrite" title="새 글 쓰기">✎</button>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="./config.js"></script>
<script src="./app.js"></script>
<script src="./ai-chat.js" defer></script>
<script src="./music.js" defer></script>
<script>
const { sb, $, $$, esc, fmtDate, toast } = App;

let CATS = [], POSTS = [], SEL = "all", KEY = "";

/* ── 시작 ───────────────────────────────────────────── */
(async function start(){
  await App.loadSettings();
  await App.refreshMe();
  wireTop();

  if(!sb){
    $("#list").innerHTML = `<div class="empty">config.js 의 Supabase 값이 비어 있습니다.</div>`;
    return;
  }
  await loadCats();
  await loadPosts();
})();

/* ── 위쪽 단추들 ────────────────────────────────────── */
function wireTop(){
  $("#btnUser").onclick  = () => App.loginBox();
  $("#btnWrite").onclick = () => location.href = "./write.html";
  $("#btnSetup").onclick = () => setupBox();

  $("#btnTheme").onclick = () => {
    const now = App.settings.theme;
    const next = now === "dark" ? "light" : (now === "light" ? "auto" : "dark");
    App.saveSettings({ theme: next });
    toast(next === "auto" ? "기기 설정 따라감" : (next === "dark" ? "어둡게" : "밝게"));
  };

  $("#btnSearch").onclick = () => {
    const box = $("#q");
    box.hidden = !box.hidden;
    if(!box.hidden) box.focus();
    else { KEY = ""; box.value = ""; draw(); }
  };
  let hTimer = null;
  $("#q").addEventListener("input", e => {
    KEY = e.target.value.trim();
    DEEP = new Set();
    draw();                                   // 이미 받아 둔 글에서 바로 걸러 보여 주고
    clearTimeout(hTimer);
    hTimer = setTimeout(deepSearch, 350);     // 잠시 뒤 «본문까지» 서버에 물어본다
  });
}

/* ── 카테고리 ───────────────────────────────────────── */
async function loadCats(){
  const { data, error } = await sb.from("blog_categories").select("*").order("sort_order").order("name");
  if(error){
    $("#list").innerHTML = `<div class="empty">표가 아직 없습니다 — <b>02-blog.sql</b> 을 SQL Editor 에서 한 번 돌려 주세요.<br><span class="muted sm">${esc(error.message)}</span></div>`;
    return;
  }
  CATS = data || [];
  drawCats();
}

function drawCats(){
  const all = `<button class="cat${SEL==="all"?" on":""}" data-c="all">전체</button>`;
  const rest = CATS.map(c =>
    `<button class="cat${SEL===String(c.id)?" on":""}" data-c="${c.id}">${c.emoji?c.emoji+" ":""}${esc(c.name)}</button>`).join("");
  const admin = App.canEdit()
    ? `<button class="cat" data-c="__new" title="카테고리 관리">＋</button>` : "";
  $("#cats").innerHTML = all + rest + admin;

  $$("#cats .cat").forEach(b => b.onclick = () => {
    if(b.dataset.c === "__new") return catBox();
    SEL = b.dataset.c; drawCats(); draw();
  });
}

/* ── 글 ─────────────────────────────────────────────── */
async function loadPosts(){
  // 로그인해서 글쓰기 권한이 있으면 초안까지 보인다
  let q = sb.from("blog_posts")
    .select("id,slug,title,excerpt,cover_url,category_id,tags,status,pinned,view_count,published_at,updated_at")
    .order("pinned", { ascending:false })
    .order("published_at", { ascending:false, nullsFirst:false })
    .order("updated_at", { ascending:false })
    .limit(200);
  if(!App.canEdit()) q = q.eq("status","published");

  const { data, error } = await q;
  if(error){
    $("#list").innerHTML = `<div class="empty">글을 못 읽었습니다.<br><span class="muted sm">${esc(error.message)}</span></div>`;
    return;
  }
  POSTS = data || [];
  draw();
}

/* 목록에 올라온 200개 밖의 글, 그리고 본문 속 낱말까지 서버에서 찾는다.
   찾은 것은 POSTS 에 합쳐 두므로 다음부터는 바로 걸러집니다. */
let searching = false;
async function deepSearch(){
  const k = KEY;
  if(!sb || k.length < 2 || searching) return;
  searching = true;
  try{
    const pat = `%${k.replace(/[%_]/g, m => "\\" + m)}%`;
    let q = sb.from("blog_posts")
      .select("id,slug,title,excerpt,cover_url,category_id,tags,status,pinned,view_count,published_at,updated_at")
      .or(`title.ilike.${pat},body_text.ilike.${pat},excerpt.ilike.${pat}`)
      .order("published_at", { ascending:false, nullsFirst:false })
      .limit(60);
    if(!App.canEdit()) q = q.eq("status","published");

    const { data, error } = await q;
    if(error || !data) return;

    const have = new Set(POSTS.map(p => p.id));
    const add = data.filter(p => !have.has(p.id));
    if(add.length){
      POSTS = POSTS.concat(add);
      DEEP = new Set([...(DEEP||[]), ...data.map(p => p.id)]);
      if(KEY === k) draw();
    }else{
      DEEP = new Set([...(DEEP||[]), ...data.map(p => p.id)]);
      if(KEY === k) draw();
    }
  }catch{}
  finally{ searching = false; }
}

let DEEP = new Set();     // 본문에서 낱말이 발견된 글 번호

function draw(){
  let rows = POSTS;
  if(SEL !== "all") rows = rows.filter(p => String(p.category_id) === SEL);
  if(KEY){
    const k = KEY.toLowerCase();
    rows = rows.filter(p =>
      (p.title||"").toLowerCase().includes(k) ||
      (p.excerpt||"").toLowerCase().includes(k) ||
      (p.tags||[]).some(t => t.toLowerCase().includes(k)) ||
      DEEP.has(p.id));                              // 본문에서 찾은 글
  }

  if(!rows.length){
    $("#list").innerHTML = `<div class="empty">${KEY ? "찾는 글이 없습니다. <span class='muted sm'>(제목·본문·태그를 모두 뒤졌습니다)</span>" : "아직 글이 없습니다."}${App.canEdit()?"<br><br><a href='./write.html'>첫 글 쓰기 →</a>":""}</div>`;
    return;
  }

  const catOf = id => CATS.find(c => c.id === id);

  $("#list").innerHTML = rows.map(p => {
    const c = catOf(p.category_id);
    return `<a class="item${p.pinned?" pin":""}" href="./post.html?id=${p.id}">
      ${p.cover_url ? `<img class="cover" src="${esc(p.cover_url)}" alt="" loading="lazy">` : ""}
      <div class="meta">
        ${c ? `<span class="dot" style="background:${esc(c.color||"#9CA3AF")}"></span>${c.emoji?c.emoji+" ":""}${esc(c.name)}` : ""}
        <span>${fmtDate(p.published_at || p.updated_at)}</span>
        ${p.pinned ? "<span>📌</span>" : ""}
        ${p.status !== "published" ? `<span class="draft">${p.status==="draft"?"초안":"보관"}</span>` : ""}
      </div>
      <h2>${esc(p.title)}</h2>
      ${p.excerpt ? `<p>${esc(p.excerpt)}</p>` : ""}
      ${(p.tags||[]).length ? `<div class="tags">${p.tags.map(t=>`<span class="tag">#${esc(t)}</span>`).join("")}</div>` : ""}
    </a>`;
  }).join("");
}

/* ── 카테고리 관리 ──────────────────────────────────── */
function catBox(){
  const ov = document.createElement("div");
  ov.className = "ov";
  ov.innerHTML = `<div class="ovbox">
    <h3>카테고리</h3>
    <div id="catList"></div>
    <label>새 카테고리</label>
    <input id="ncName" placeholder="이름 (예: 설비 점검)">
    <div class="row">
      <input id="ncEmoji" placeholder="🛠" style="width:74px;flex:none">
      <input id="ncColor" type="color" value="#1D4ED8" style="width:60px;flex:none;padding:3px">
      <button class="btn" id="ncAdd">추가</button>
      <button class="btn ghost" id="ncClose">닫기</button>
    </div>
  </div>`;
  document.body.appendChild(ov);
  ov.onclick = e => { if(e.target === ov) ov.remove(); };
  $("#ncClose", ov).onclick = () => ov.remove();

  const paint = () => {
    $("#catList", ov).innerHTML = CATS.map(c => `
      <div class="row" style="align-items:center;margin:0 0 7px">
        <span class="dot" style="width:11px;height:11px;border-radius:50%;background:${esc(c.color||"#999")}"></span>
        <span style="flex:1">${c.emoji?c.emoji+" ":""}${esc(c.name)}</span>
        <button class="btn ghost sm" data-del="${c.id}">삭제</button>
      </div>`).join("") || `<p class="muted">아직 없습니다.</p>`;

    $$("[data-del]", ov).forEach(b => b.onclick = async () => {
      if(!confirm("이 카테고리를 지웁니다. (글은 지워지지 않고 분류만 빠집니다)")) return;
      const { error } = await sb.from("blog_categories").delete().eq("id", b.dataset.del);
      if(error) return toast(error.message, "err");
      await loadCats(); paint(); draw();
    });
  };
  paint();

  $("#ncAdd", ov).onclick = async () => {
    const name = $("#ncName", ov).value.trim();
    if(!name) return;
    const { error } = await sb.from("blog_categories").insert({
      slug: App.slugify(name), name,
      emoji: $("#ncEmoji", ov).value.trim() || null,
      color: $("#ncColor", ov).value,
      sort_order: CATS.length + 1,
    });
    if(error) return toast(error.message, "err");
    $("#ncName", ov).value = ""; $("#ncEmoji", ov).value = "";
    await loadCats(); paint();
  };
}

/* ── 화면 설정 ──────────────────────────────────────── */
function setupBox(){
  const s = App.settings;
  const ov = document.createElement("div");
  ov.className = "ov";
  ov.innerHTML = `<div class="ovbox">
    <h3>화면 설정</h3>

    <label>블로그 이름</label>
    <input id="stTitle" value="${esc(s.title)}">
    <input id="stTag" value="${esc(s.tagline)}" placeholder="한 줄 소개">

    <label>밝기</label>
    <div class="chips" id="stTheme">
      ${[["auto","기기 따라"],["light","밝게"],["dark","어둡게"]]
        .map(([k,t])=>`<button class="chip${s.theme===k?" on":""}" data-v="${k}">${t}</button>`).join("")}
    </div>

    <label>강조색</label>
    <div class="swatches" id="stAccent">
      ${["#1D4ED8","#0F766E","#B45309","#9333EA","#BE123C","#111827"]
        .map(c=>`<button class="sw${s.accent===c?" on":""}" data-v="${c}" style="background:${c}"></button>`).join("")}
    </div>

    <label>배경</label>
    <div class="chips" id="stBgKind">
      ${[["plain","없음"],["gradient","그러데이션"],["pattern","무늬"],["image","사진"]]
        .map(([k,t])=>`<button class="chip${s.bg_kind===k?" on":""}" data-v="${k}">${t}</button>`).join("")}
    </div>
    <div id="stBgVal" style="margin-top:9px"></div>

    <label>배경 흐리기 <span id="lbBlur" class="muted sm">${s.bg_blur||0}px</span></label>
    <input class="range" id="stBlur" type="range" min="0" max="24" value="${s.bg_blur||0}">
    <label>배경 연하게 <span id="lbDim" class="muted sm">${s.bg_dim||0}%</span></label>
    <input class="range" id="stDim" type="range" min="0" max="90" value="${s.bg_dim||0}">

    <label>글꼴 · 폭</label>
    <div class="chips" id="stFont">
      ${[["pretendard","고딕"],["serif","명조"],["mono","고정폭"]]
        .map(([k,t])=>`<button class="chip${s.font===k?" on":""}" data-v="${k}">${t}</button>`).join("")}
      <span style="width:10px"></span>
      ${[["narrow","좁게"],["wide","넓게"]]
        .map(([k,t])=>`<button class="chip${s.width===k?" on":""}" data-w="${k}">${t}</button>`).join("")}
    </div>

    <div class="row" style="margin-top:18px">
      <button class="btn" id="stClose">다 됐어요</button>
      ${App.canEdit()?"":`<span class="muted sm" style="align-self:center">로그인하면 이 설정이 다른 기기에도 따라옵니다</span>`}
    </div>
  </div>`;
  document.body.appendChild(ov);
  ov.onclick = e => { if(e.target === ov) ov.remove(); };
  $("#stClose", ov).onclick = () => ov.remove();

  const pick = (sel, attr, key) => $$(sel + " [data-"+attr+"]", ov).forEach(b => b.onclick = () => {
    $$(sel + " [data-"+attr+"]", ov).forEach(x => x.classList.remove("on"));
    b.classList.add("on");
    App.saveSettings({ [key]: b.dataset[attr] });
    if(key === "bg_kind") bgVals();
  });

  pick("#stTheme",  "v", "theme");
  pick("#stAccent", "v", "accent");
  pick("#stBgKind", "v", "bg_kind");
  pick("#stFont",   "v", "font");
  $$("#stFont [data-w]", ov).forEach(b => b.onclick = () => {
    $$("#stFont [data-w]", ov).forEach(x => x.classList.remove("on"));
    b.classList.add("on"); App.saveSettings({ width: b.dataset.w });
  });

  $("#stTitle", ov).oninput = e => App.saveSettings({ title: e.target.value });
  $("#stTag", ov).oninput   = e => App.saveSettings({ tagline: e.target.value });
  $("#stBlur", ov).oninput  = e => { $("#lbBlur", ov).textContent = e.target.value+"px"; App.saveSettings({ bg_blur:+e.target.value }); };
  $("#stDim", ov).oninput   = e => { $("#lbDim", ov).textContent = e.target.value+"%";  App.saveSettings({ bg_dim:+e.target.value }); };

  function bgVals(){
    const k = App.settings.bg_kind, box = $("#stBgVal", ov);
    if(k === "plain"){ box.innerHTML = ""; return; }

    if(k === "image"){
      box.innerHTML = `<input id="bgUrl" placeholder="사진 주소(https://…)" value="${esc(App.settings.bg_value||"")}">
        <div class="row"><button class="btn ghost sm" id="bgUp">기기에서 고르기</button></div>
        <input type="file" id="bgFile" accept="image/*" hidden>`;
      $("#bgUrl", ov).oninput = e => App.saveSettings({ bg_value: e.target.value.trim() });
      $("#bgUp", ov).onclick = () => $("#bgFile", ov).click();
      $("#bgFile", ov).onchange = async e => {
        const f = e.target.files[0]; if(!f) return;
        if(!App.canEdit()) return toast("로그인해야 사진을 올릴 수 있습니다.", "err");
        try{
          toast("올리는 중…");
          const { url } = await App.uploadImage(f, "bg");
          $("#bgUrl", ov).value = url;
          App.saveSettings({ bg_value: url });
          toast("배경 바꿨습니다");
        }catch(err){ toast(err.message, "err"); }
      };
      return;
    }

    const src = k === "gradient" ? App.GRADIENTS : App.PATTERNS;
    box.innerHTML = `<div class="chips">` + Object.keys(src).map(n =>
      `<button class="chip${App.settings.bg_value===n?" on":""}" data-bv="${esc(n)}">${esc(n)}</button>`).join("") + `</div>`;
    $$("[data-bv]", box).forEach(b => b.onclick = () => {
      $$("[data-bv]", box).forEach(x => x.classList.remove("on"));
      b.classList.add("on"); App.saveSettings({ bg_value: b.dataset.bv });
    });
  }
  bgVals();
}
</script>
</body>
</html>
