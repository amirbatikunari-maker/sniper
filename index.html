<div id="blank"><div class="tip">아무 키나 누르거나 화면을 누르면 돌아옵니다</div></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>
<script src="./config.js"></script>
<script>
/* ═══════════════════════════════════════════════
   상태
   ═══════════════════════════════════════════════ */
const CFG = window.APP_CONFIG || {};
const sb = (window.supabase && CFG.SUPABASE_URL && !CFG.SUPABASE_URL.includes("xxxx"))
  ? window.supabase.createClient(CFG.SUPABASE_URL, CFG.SUPABASE_ANON_KEY)
  : null;

const LS = {
  get:(k,d)=>{try{return JSON.parse(localStorage.getItem(k)) ?? d}catch(e){return d}},
  set:(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
};
let S = {
  subjects:[], exams:[], questions:[], exam:null, subject:null,
  idx:0, veil:LS.get("veil",false), stars:LS.get("stars",{}), seen:LS.get("seen",{}),
  layout:LS.get("layout","swipe-x"),
  loggedIn:false, anno:{}   // anno[question_id] = {strokes, page_width}
};
/* 진도 표시 층이 상태를 읽을 수 있도록 열어 둔다 (읽기 전용) */
try{ Object.defineProperty(window,"S",{configurable:true,get:()=>S}); }catch(e){}

const $  = s=>document.querySelector(s);
const $$ = s=>[...document.querySelectorAll(s)];
const esc = s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

/* 본문 맨 앞에 다시 붙어 있는 문항 번호("1. ", "23) ", "(4) ", "문제 5. ")를 지운다.
   화면 왼쪽에 이미 번호 배지가 따로 있으므로 중복이고, 예전에 올린 회차에도 남아 있어서
   저장된 값을 고치지 않고 화면에 그릴 때 걸러낸다.
   숫자 뒤에 반드시 공백이 와야만 지우므로 "1.5kg", "2단압축", "20℃" 같은 진짜 본문은 건드리지 않는다. */
function stripQNo(s){
  return String(s??"").replace(
    /^[\s\u00A0]*(?:문제|문항)?[\s\u00A0]*(?:[[(][\s\u00A0]*\d{1,3}[\s\u00A0]*[\])]|\d{1,3}[\s\u00A0]*[.)])[\s\u00A0]+/,
    ""
  );
}

/* ═══════════════════════════════════════════════
   필기 — 로그인
   ═══════════════════════════════════════════════ */
/* session 을 넘겨받으면 getSession() 을 부르지 않는다.
   onAuthStateChange 콜백 안에서 getSession() 을 부르면 잠금이 서로를 기다려 굳어버리기 때문이다. */
async function inkRefresh(session){
  if(!sb) return;
  const was = S.loggedIn;
  if(session === undefined){
    const {data} = await sb.auth.getSession();
    session = data.session;
  }
  S.loggedIn = !!session;
  $("#inkPopIn").hidden = S.loggedIn;
  $("#inkPopOut").hidden = !S.loggedIn;
  $("#inkAuthBtn").classList.toggle("on", S.loggedIn);
  $$(".qink").forEach(b => b.classList.toggle("loggedin", S.loggedIn));
  if(!S.loggedIn) setManage(false);
  /* 고치기 단추들은 로그인 여부를 보고 그릴지 말지를 정한다. 그래서 로그인 상태가
     바뀌면 이미 그려둔 문항을 다시 그려야 단추가 나타나거나 사라진다.
     필기 중인 문항은 건드리지 않는다 — 다시 그리면 그리던 획이 날아간다. */
  if(was !== S.loggedIn){
    redrawOpenCards();
    redrawOpenNotes();     /* 자료 패널은 문항 카드가 아니라서 위 함수가 못 건드린다 */
  }
}

/* 펼쳐져 있는 핵심개념 자료 패널을 다시 그린다.
   버튼은 로그인 여부와 무관하게 늘 그려지고 눌렀을 때 막는 구조라 없어도 동작은 하지만,
   로그인 직후 화면이 그대로면 "된 건가?" 싶어서 한 번 새로 그려 준다. */
function redrawOpenNotes(){
  const np = document.getElementById("notePanel");
  if(np && np.dataset.subject && np.dataset.open === "1") drawNotes(+np.dataset.subject, np);
}

function redrawOpenCards(){
  $$("#track .slide .sheet-body").forEach(body => {
    if(body.dataset.h !== "1" || body.__ink?.editing) return;
    body.dataset.h = "0"; body.__ink = null; body.__zoom = null;
    hydrate(+body.parentElement.dataset.i);
  });
}
$("#inkAuthBtn")?.addEventListener("click", ()=> $("#inkPop").classList.toggle("on"));
document.addEventListener("click", e=>{
  if(!e.target.closest(".inkauth")) $("#inkPop")?.classList.remove("on");
});
$("#inkLoginBtn")?.addEventListener("click", async ()=>{
  if(!sb) return;
  const {error} = await sb.auth.signInWithPassword({email:$("#inkEm").value.trim(), password:$("#inkPw").value});
  if(error){ $("#inkErr").textContent = "로그인 실패 — " + error.message; return; }
  $("#inkErr").textContent = "";
  $("#inkEm").value = ""; $("#inkPw").value = "";
  $("#inkPop")?.classList.remove("on");     /* 로그인됐으면 창을 닫아 준다 */
  await inkRefresh();
  toast("로그인했습니다. 이제 자료를 넣고 고칠 수 있습니다.");
});
$("#inkLogoutBtn")?.addEventListener("click", async ()=>{ if(sb){ await sb.auth.signOut(); await inkRefresh(); } });

/* ═══════════════════════════════════════════════
   정리 모드 — 과목·회차·문항 삭제
   삭제 단추는 항상 그려두고 CSS(body.manage)로만 보였다 숨긴다.
   로그인하지 않으면 스위치 자체를 켤 수 없고, 실제 권한은 서버(RLS)가 판단한다.
   ═══════════════════════════════════════════════ */
S.manage = false;
function setManage(on){
  S.manage = !!on && S.loggedIn;
  document.body.classList.toggle("manage", S.manage);
  const b = $("#manageBtn");
  if(b) b.textContent = S.manage ? "정리 모드 끄기" : "정리 모드 켜기";
}
$("#manageBtn")?.addEventListener("click", ()=> setManage(!S.manage));

/* 테이블 이름이 환경마다 다를 수 있어(뷰인지 원본 표인지) 후보를 차례로 시도한다 */
async function delTry(cands, build){
  let last = "";
  for(const t of cands){
    const {error} = await build(sb.from(t).delete());
    if(!error) return t;
    last = error.message || String(error);
  }
  throw new Error(last || "삭제하지 못했습니다");
}
const T_EXAM = ["exams","exam","exam_list"];
const T_SUBJ = ["subjects","subject","subject_list"];

/* 문항에 딸린 필기부터 지워야 외래키에 걸리지 않는다 */
async function wipeQuestions(examId){
  const {data:qs} = await sb.from("questions").select("id").eq("exam_id", examId);
  const ids = (qs||[]).map(q=>q.id);
  if(ids.length){
    for(let i=0;i<ids.length;i+=200)
      await sb.from("annotations").delete().in("question_id", ids.slice(i,i+200));
  }
  await delTry(["questions"], b => b.eq("exam_id", examId));
  ids.forEach(id => { delete S.anno[id]; delete S.hl[id]; delete S.stars[id]; delete S.seen[id]; });
  LS.set("hl",S.hl); LS.set("stars",S.stars); LS.set("seen",S.seen);
  return ids.length;
}
async function deleteExam(examId){
  const n = await wipeQuestions(examId);
  await delTry(T_EXAM, b => b.eq("id", examId));
  LS.set(`pos:${examId}`, 0);
  return n;
}
async function deleteSubject(subjectId){
  const {data:exs} = await sb.from("exam_list").select("id").eq("subject_id", subjectId);
  let n = 0;
  for(const e of (exs||[])) n += await deleteExam(e.id);
  await delTry(T_SUBJ, b => b.eq("id", subjectId));
  return n;
}
async function deleteQuestion(qid){
  await sb.from("annotations").delete().eq("question_id", qid);
  await delTry(["questions"], b => b.eq("id", qid));
  delete S.anno[qid]; delete S.hl[qid]; delete S.stars[qid]; delete S.seen[qid];
  LS.set("hl",S.hl); LS.set("stars",S.stars); LS.set("seen",S.seen);
}
/* 삭제는 되돌릴 수 없으니 한 번 더 묻는다 */
async function confirmDelete(label, run, after){
  if(!confirm(`${label}\n\n되돌릴 수 없습니다. 지울까요?`)) return;
  try{
    const n = await run();
    alert(typeof n === "number" ? `지웠습니다. (문항 ${n}개)` : "지웠습니다.");
    after?.();
  }catch(err){
    alert("지우지 못했습니다 — " + err.message +
      "\n\n로그인 계정에 삭제 권한(RLS)이 없거나, 표 이름이 다를 수 있습니다.");
  }
}

/* ═══════════════════════════════════════════════
   필기 — 저장/불러오기
   문항이 로드될 때 이 회차의 필기를 한 번에 가져온다 (문항마다 따로 요청하지 않음)
   ═══════════════════════════════════════════════ */
async function loadAnnotations(questionIds){
  if(!sb || !questionIds.length) return;
  const {data} = await sb.from("annotations").select("question_id,strokes,page_width").in("question_id", questionIds);
  (data||[]).forEach(r => S.anno[r.question_id] = {strokes:r.strokes||[], page_width:r.page_width||400});
}
const saveTimers = {};
function saveAnnotation(qid){
  clearTimeout(saveTimers[qid]);
  saveTimers[qid] = setTimeout(async ()=>{
    if(!sb) return;
    const a = S.anno[qid]; if(!a) return;
    const el = document.querySelector(`.inkpage[data-qid="${qid}"]`)
                 ?.closest(".sheet-body")?.querySelector(".itsave");
    if(el) el.textContent = "저장 중…";
    const {error} = await sb.from("annotations").upsert(
      { question_id: qid, strokes: a.strokes, page_width: a.page_width },
      { onConflict: "question_id" }
    );
    if(el) el.textContent = error ? "저장 실패" : "저장됨";
  }, 700);
}

/* ═══════════════════════════════════════════════
   필기 — 그리기 엔진
   좌표는 항상 "가상 페이지(400px 고정폭)" 안의 픽셀 단위로 저장한다.
   화면 폭이 바뀌면 이 페이지 전체를 scale() 로 키우고 줄일 뿐,
   글자는 절대 다시 줄바꿈되지 않으므로 잉크가 글자와 어긋나지 않는다.
   ═══════════════════════════════════════════════ */
const PAGE_W = 400;
const PALETTE = ["#E0342B","#1D4ED8","#10233D","#0EA05A"];
const HI_PALETTE = ["#FDE047","#86EFAC","#93C5FD","#FCA5A5"];

/* ── 두 손가락 핀치 확대/축소 (문항+해설 영역 공통, 필기 있든 없든) ──
   여기서는 브라우저의 zoom 속성을 쓰지 않는다. zoom 은 실제 레이아웃 크기까지
   바꿔서 필기가 쓰는 auto-fit 배율 계산과 두 번 겹쳐 계산될 위험이 있다.
   대신 순수 transform: translate() scale() 만 쓴다 — 이건 화면에 그려지는
   방식만 바꿀 뿐 실제 크기(clientWidth 등)는 안 바꾸므로, 안쪽의 필기 auto-fit
   로직과 서로 간섭하지 않는다. (getBoundingClientRect 는 이 변환들을 전부
   합쳐서 알려주므로, 펜 좌표 계산은 확대 배율에 관계없이 항상 정확하다.)

   손가락 개수로 완전히 딱 나눈다 — 예외 없음:
   · 손가락 둘 → 오직 확대/축소만.
   · 손가락 하나 → 오직 좌우 넘기기만. 확대된 상태여도 마찬가지.
     (확대해서 화면 밖으로 나간 부분을 보고 싶으면 손가락 둘로 다시 위치를 잡아 핀치하거나,
      더블탭/리셋 버튼으로 1배로 돌아온 뒤 다시 필요한 곳을 확대하면 된다) */
function setupZoom(zoomwrap, zoomstage){
  const pts = new Map();
  let zoom = 1, tx = 0, ty = 0;
  let startDist = 0, startZoom = 1, startMid = {x:0,y:0}, startTx = 0, startTy = 0;
  let lastTap = 0, dragStart = null;
  let panMode = false;   /* 이동(손) 도구가 켜졌을 때 true */
  const resetBtn = zoomwrap.querySelector(".zoomreset");

  /* 손도구로 직접 끌어 옮기는 상황(이동 도구 + 확대 상태)에서만 브라우저의 기본 스크롤을 끈다.
     그 외에는 pan-y 로 둬서 세로 스크롤은 늘 네이티브가 매끄럽게 처리하게 한다.
     (둘 다 켜져 있으면 한 번 끌 때 화면이 두 배로 움직인다) */
  function syncTouch(){
    zoomwrap.style.touchAction = (panMode && zoom > 1.02) ? "none" : "pan-y";
  }
  function apply(){
    zoomstage.style.transform = `translate(${tx}px,${ty}px) scale(${zoom})`;
    zoomwrap.classList.toggle("zoomed", zoom > 1.02);
    syncTouch();
  }
  function clamp(){
    const ww = zoomwrap.clientWidth, wh = zoomwrap.clientHeight;
    const sw = zoomstage.offsetWidth * zoom, sh = zoomstage.offsetHeight * zoom;
    const minTx = Math.min(0, ww - sw), maxTx = Math.max(0, ww - sw);
    const minTy = Math.min(0, wh - sh), maxTy = Math.max(0, wh - sh);
    tx = sw <= ww ? (ww - sw) / 2 : Math.min(maxTx, Math.max(minTx, tx));
    ty = sh <= wh ? Math.min(0, ty) : Math.min(maxTy, Math.max(minTy, ty));
  }
  function zoomAt(nz, ax, ay){
    nz = Math.min(3, Math.max(1, nz));
    const rect = zoomwrap.getBoundingClientRect();
    const px = (ax - rect.left - tx) / zoom;
    const py = (ay - rect.top  - ty) / zoom;
    zoom = nz;
    tx = ax - rect.left - px*zoom;
    ty = ay - rect.top  - py*zoom;
    clamp(); apply();
  }
  function resetZoom(){ zoom = 1; tx = 0; ty = 0; apply(); zoomwrap.classList.remove("zoomed"); }

  const track = $("#track");
  /* 필기 캔버스 위에서 시작한 한 손가락 동작은 "그리는 중"이므로 넘기기·끌기로 해석하면 안 된다.
     (가로로 밑줄을 긋다가 다음 문제로 넘어가 버리는 것을 막는다.)
     두 손가락 핀치는 그대로 살려둔다 — 필기 중에도 확대는 되어야 하니까. */
  const onInkCanvas = ev => !!ev.target?.classList?.contains?.("inkcanvas");
  /* 슬라이더나 단추 위에서 시작한 드래그도 마찬가지다. 그림 크기를 가로로 끄는 동작이
     "다음 문항으로 넘기기"로 읽히면 슬라이더를 아예 못 쓴다. */
  const onControl = ev => !!ev.target?.closest?.("input,button,select,textarea,[data-pasteq]");
  /* 마우스를 누른 자리가 «읽는 글» 위였는지 기억해 둔다.
     글 위에서 끄는 것은 형광펜을 칠하려는 것이고, 빈 자리에서 끄는 것은 넘기려는 것이다. */
  let MOUSE_ON_TEXT = false;
  zoomwrap.addEventListener("pointerdown", ev=>{
    if(ev.pointerType === "mouse")
      MOUSE_ON_TEXT = !!ev.target.closest?.(
        "[data-hl], .qtext, .exp-b, .eb, .opt, .opt .t, p, li, td, th, h2, h3, h4, code, mark");
    pts.set(ev.pointerId, {x:ev.clientX, y:ev.clientY});
    if(pts.size === 1){
      dragStart = (onInkCanvas(ev) || onControl(ev)) ? null
        : {x:ev.clientX, y:ev.clientY, t:Date.now(), scrollLeft:track.scrollLeft, tx0:tx, ty0:ty};
    }
    if(pts.size === 2){
      dragStart = null; // 둘째 손가락이 닿으면 스와이프 판정은 취소하고 오직 핀치로만 다룬다
      const [a,b] = [...pts.values()];
      startDist = Math.hypot(a.x-b.x, a.y-b.y) || 1;
      startZoom = zoom; startTx = tx; startTy = ty;
      startMid = {x:(a.x+b.x)/2, y:(a.y+b.y)/2};
    }
  });
  let dragMode = null; // null(방향 판정 전) | "h"(좌우 넘기기) | "v"(세로는 손 안 댐)

  zoomwrap.addEventListener("pointermove", ev=>{
    if(!pts.has(ev.pointerId)) return;
    pts.set(ev.pointerId, {x:ev.clientX, y:ev.clientY});

    if(pts.size === 2){
      ev.preventDefault();
      const [a,b] = [...pts.values()];
      const dist = Math.hypot(a.x-b.x, a.y-b.y);
      const mid = {x:(a.x+b.x)/2, y:(a.y+b.y)/2};
      const rect = zoomwrap.getBoundingClientRect();
      const nz = Math.min(3, Math.max(1, startZoom * (dist/startDist)));
      const px = (startMid.x - rect.left - startTx) / startZoom;
      const py = (startMid.y - rect.top  - startTy) / startZoom;
      zoom = nz;
      tx = mid.x - rect.left - px*zoom;
      ty = mid.y - rect.top  - py*zoom;
      clamp(); apply();
      return;
    }

    /* 손가락 하나: 처음 8px 정도 움직일 때까지는 방향을 정하지 않는다(성급하게 가로로 단정 안 함).
       가로로 판정되면 그때부터 손가락을 실시간으로 따라 화면을 옮긴다 — 네이티브 스크롤처럼 */
    if(!dragStart) return;
    const dx = ev.clientX - dragStart.x, dy = ev.clientY - dragStart.y;

    /* 이동(손) 도구 + 확대 상태 → 한 손가락 드래그로 화면을 끌어 옮긴다.
       확대돼 있지 않으면 옮길 곳이 없으므로 평소대로(세로 스크롤 / 좌우 넘기기) 둔다. */
    if(panMode && zoom > 1.02){
      if(dragMode === null){
        if(Math.abs(dx) < 3 && Math.abs(dy) < 3) return;
        dragMode = "pan";
      }
      if(dragMode === "pan"){
        ev.preventDefault();
        tx = dragStart.tx0 + dx; ty = dragStart.ty0 + dy;
        clamp(); apply();
        return;
      }
    }

    if(dragMode === null){
      /* ★ 마우스로 끄는 것은 «글자 고르기» 로만 쓴다.
         예전에는 조금만 가로로 끌어도 다음 문항으로 넘어가서, 형광펜 칠하려고 문장을
         끌면 화면이 넘어가 버렸다. 마우스는 이제 절대 넘김으로 읽지 않는다.
         손가락 스와이프는 그대로 살려 둔다 — 폰에서는 그게 제일 편하다.
         마우스로 넘길 때는 화면 좌우의 ‹ › 단추나 방향키를 쓰면 된다. */
      /* 마우스는 «글자 위» 에서 시작했을 때만 넘김에서 뺀다.
         빈 여백·그림 위에서 끄는 것은 넘길 뜻이므로 받아 준다.
         대신 문턱을 120px 로 크게 잡아, 살짝 흔든 것으로는 안 넘어가게 한다. */
      if(ev.pointerType === "mouse"){
        if(MOUSE_ON_TEXT){ dragMode = "v"; return; }
        if(Math.abs(dx) < 120 || Math.abs(dx) < Math.abs(dy) * 2){ return; }
        dragMode = "h";
        return;
      }
      const MIN = 18;
      if(Math.abs(dx) < MIN && Math.abs(dy) < MIN) return;
      if(track.classList.contains("vert")) dragMode = "v";
      /* 가로가 세로보다 확실히 우세할 때만 넘김으로 본다 */
      else dragMode = Math.abs(dx) > Math.abs(dy) * 1.6 ? "h" : "v";
    }
    if(dragMode === "h"){
      ev.preventDefault();
      track.scrollLeft = dragStart.scrollLeft - dx;
    }
    /* dragMode === "v" 면 아무것도 안 하고 그대로 둔다 — 세로 스크롤은 늘 네이티브가 처리 */
  }, {passive:false});

  function release(ev){
    pts.delete(ev.pointerId);
    if(pts.size) return; // 아직 손가락이 남아있으면 아무 판정도 하지 않는다

    if(dragMode === "h" && dragStart){
      /* 놓을 때 속도까지 봐서, 살짝만 밀어도 빠르게 밀었으면 넘어가지도록 */
      const dx = ev.clientX - dragStart.x;
      const dt = Math.max(1, Date.now() - dragStart.t);
      const vx = dx / dt;
      const w = track.clientWidth || 1;
      let target = S.idx;
      /* 넘어가는 데 필요한 거리·속도도 올렸다 (화면 폭의 18% → 32%, 속도 0.35 → 0.75) */
      const mouse = ev.pointerType === "mouse";
      if(Math.abs(dx) > w*(mouse ? 0.32 : 0.24) || Math.abs(vx) > (mouse ? 0.75 : 0.5)){
        target = dx < 0 ? Math.min(S.idx+1, S.questions.length-1) : Math.max(S.idx-1, 0);
      }
      jump(target); // 가장 가까운 문항으로 부드럽게 스냅 (안 넘어가도 제자리로 스냅됨)
    }
    const moved = dragStart ? Math.hypot(ev.clientX - dragStart.x, ev.clientY - dragStart.y) : 0;
    const wasDrag = dragMode !== null;
    dragStart = null; dragMode = null;

    /* 끌어서 옮긴 동작은 탭으로 세지 않는다 — 안 그러면 두 번 끌었을 때 더블탭으로 오인된다 */
    if(wasDrag || moved > 10){ lastTap = 0; return; }
    const now = Date.now();
    if(now - lastTap < 320){ zoom>1.02 ? resetZoom() : zoomAt(2, ev.clientX, ev.clientY); }
    lastTap = now;
  }
  zoomwrap.addEventListener("pointerup", release);
  zoomwrap.addEventListener("pointercancel", ()=>{ pts.clear(); dragStart = null; dragMode = null; });
  resetBtn?.addEventListener("click", e=>{ e.stopPropagation(); resetZoom(); });
  new ResizeObserver(()=>{ if(zoom>1){ clamp(); apply(); } }).observe(zoomwrap);

  return {
    setPan(on){ panMode = !!on; zoomwrap.classList.toggle("panmode", panMode); syncTouch(); },
    reset: resetZoom,
    get zoom(){ return zoom; }
  };
}


function setupInkPage(qid, wrap, page, canvas, tools, onEditingChange, zoomCtl){
  const ctx = canvas.getContext("2d");
  const state = { tool:"pen", color:PALETTE[0], hiColor:HI_PALETTE[0], editing:false, drawing:false, cur:null,
                  opa:{ pen:1, hi:1, ul:1 } };   // 도구별 진하기(0~1) — 각각 따로 기억한다

  function factor(){ return wrap.clientWidth / PAGE_W; }

  function resize(){
    const f = factor();
    const h = page.scrollHeight;
    page.style.transform = `scale(${f})`;
    canvas.style.transform = `scale(${f})`;
    canvas.width = PAGE_W; canvas.height = h;
    canvas.style.width = PAGE_W + "px"; canvas.style.height = h + "px";
    wrap.style.height = Math.round(h * f) + "px";
    redraw();
  }
  new ResizeObserver(resize).observe(wrap);
  new ResizeObserver(resize).observe(page);

  function strokeStyle(s){
    /* 획마다 저장된 진하기(opa, 0~1)가 있으면 그것을 쓴다.
       예전에 저장한 획에는 이 값이 없으므로, 그때의 기본값을 그대로 적용해 그림이 바뀌지 않게 한다. */
    const base = s.tool === "hi" ? 0.42 : 1;
    const alpha = (s.opa != null ? s.opa : 1) * base;
    if(s.tool === "hi") return { alpha, w:s.w||22, cap:"square" };
    if(s.tool === "ul") return { alpha, w:s.w||3,  cap:"round" };
    return { alpha, w:s.w||2.4, cap:"round" };
  }
  function redraw(){
    ctx.clearRect(0,0,canvas.width,canvas.height);
    const strokes = (S.anno[qid]?.strokes)||[];
    for(const s of strokes) paintStroke(s);
  }
  function paintStroke(s){
    if(!s.pts || s.pts.length < 2) return;
    const st = strokeStyle(s);
    ctx.globalAlpha = st.alpha;
    ctx.strokeStyle = s.color;
    ctx.lineJoin = "round"; ctx.lineCap = st.cap;
    ctx.beginPath();
    ctx.moveTo(s.pts[0][0], s.pts[0][1]);
    for(let i=1;i<s.pts.length;i++){
      const p = s.pts[i];
      ctx.lineWidth = st.w * (s.tool==="pen" ? (p[2]!=null ? 0.6+p[2]*1.2 : 1) : 1);
      ctx.lineTo(p[0], p[1]);
    }
    ctx.stroke();
    ctx.globalAlpha = 1;
  }
  function toVirtual(ev){
    const r = canvas.getBoundingClientRect();
    const f = factor();
    return [ (ev.clientX - r.left)/f, (ev.clientY - r.top)/f, ev.pressure || 0.5 ];
  }
  function ensureAnno(){
    if(!S.anno[qid]) S.anno[qid] = { strokes:[], page_width:PAGE_W };
    return S.anno[qid];
  }
  function eraseNear(vx, vy){
    const a = ensureAnno();
    const R = 14;
    const before = a.strokes.length;
    a.strokes = a.strokes.filter(s => !(s.pts||[]).some(p => Math.hypot(p[0]-vx, p[1]-vy) < R));
    if(a.strokes.length !== before){ redraw(); saveAnnotation(qid); }
  }

  /* ── 그은 채로 1초 멈추면 직선으로 펴주기 ──────────────────────
     손을 떼지 않고 제자리에 약 1초 있으면, 지금까지 그은 획을 "시작점 → 지금 위치" 직선으로 바꾼다.
     그 뒤로는 손가락을 따라 끝점만 움직이므로, 자를 대고 긋는 것처럼 각도를 맞춘 뒤 떼면 된다.
     (펜·형광펜에만 적용. 밑줄은 원래 직선이고, 지우개는 해당 없음) */
  const HOLD_MS = 900, HOLD_MOVE = 2.5;
  let holdTimer = null, straight = false;
  function clearHold(){ clearTimeout(holdTimer); holdTimer = null; }
  function armHold(){
    clearHold();
    if(state.tool !== "pen" && state.tool !== "hi") return;
    holdTimer = setTimeout(()=>{
      if(!state.drawing || !state.cur || state.cur.pts.length < 2) return;
      const pts = state.cur.pts;
      state.cur.pts = [pts[0], pts[pts.length-1]];
      straight = true;
      redraw(); paintStroke(state.cur);
      try{ navigator.vibrate?.(12); }catch(e){}   /* 직선으로 바뀐 순간을 손끝으로 알려준다 */
    }, HOLD_MS);
  }

  /* ── 펜 뒤꼭지·지우개 버튼 ──
     태블릿 펜은 지우개 쪽으로 뒤집거나 옆 버튼을 누르면
     pointerdown 에 button 5 (buttons 비트 32) 를 실어 보낸다.
     그 획 동안만 지우개로 바꿔 쓰고, 손을 떼면 원래 도구로 돌려놓는다.
     (도구 단추를 눌러 지우개로 바꿨다가 다시 펜으로 되돌리는 수고를 없앤다) */
  const TOOLNAME = { pen:"펜", hi:"형광펜", ul:"밑줄", er:"지우개", move:"이동" };
  const isEraserBtn = ev => ev.pointerType === "pen" && (ev.button === 5 || (ev.buttons & 32) !== 0);
  let penErase = null;              // 잠시 지우개로 쓰는 동안 원래 도구를 넣어 둔다
  const markTool = name =>
    tools.querySelectorAll("[data-tool]").forEach(x => x.classList.toggle("on", x.dataset.tool === name));

  canvas.addEventListener("pointerdown", ev=>{
    if(!state.editing) return;
    ev.preventDefault();
    canvas.setPointerCapture(ev.pointerId);
    straight = false; clearHold();
    if(isEraserBtn(ev) && state.tool !== "er"){
      penErase = state.tool;
      state.tool = "er";
      markTool("er");
    }
    if(state.tool === "er"){ state.drawing = true; eraseNear(...toVirtual(ev).slice(0,2)); return; }
    state.drawing = true;
    const col = state.tool === "hi" ? state.hiColor : state.color;
    state.cur = { tool: state.tool, color: col, w: strokeStyle({tool:state.tool}).w,
                  opa: state.opa[state.tool] ?? 1, pts:[toVirtual(ev)] };
    armHold();
  });
  canvas.addEventListener("pointermove", ev=>{
    if(!state.editing || !state.drawing) return;
    if(state.tool === "er"){ eraseNear(...toVirtual(ev).slice(0,2)); return; }
    const v = toVirtual(ev);

    if(straight){
      /* 이미 직선으로 바뀐 뒤 — 끝점만 따라간다. 잔상이 남지 않게 전체를 다시 그린다 */
      state.cur.pts[1] = v;
      redraw(); paintStroke(state.cur);
      return;
    }
    const last = state.cur.pts[state.cur.pts.length-1];
    state.cur.pts.push(v);
    paintStroke(state.cur); // 진행 중인 획을 즉시 눈에 보이게
    /* 실제로 움직였을 때만 대기 시간을 리셋한다 — 손을 멈추면 그때부터 1초를 센다 */
    if(Math.hypot(v[0]-last[0], v[1]-last[1]) > HOLD_MOVE) armHold();
  });
  function finish(){
    clearHold();
    /* 펜 지우개로 잠시 바뀌었으면 손을 떼는 순간 원래 도구로 돌려놓는다.
       state.drawing 검사보다 앞에 둔다 — 아무것도 못 지운 채 떼도 되돌아와야 한다. */
    const back = () => {
      if(!penErase) return;
      state.tool = penErase; penErase = null;
      markTool(state.tool); syncPointer(); syncOpa();
      toast(TOOLNAME[state.tool] + "으로 돌아왔습니다");
    };
    if(!state.drawing){ back(); return; }
    state.drawing = false;
    straight = false;
    if(state.tool === "er"){ back(); return; }   /* 지우개로 끝난 획도 원래 도구로 되돌린다 */
    if(state.cur && state.cur.pts.length >= 2){
      if(state.tool === "ul"){
        const pts = state.cur.pts;
        const y = pts.reduce((s,p)=>s+p[1],0)/pts.length;
        state.cur.pts = [[pts[0][0], y],[pts[pts.length-1][0], y]];
      }
      ensureAnno().strokes.push(state.cur);
      redraw();
      saveAnnotation(qid);
    }
    state.cur = null;
  }
  canvas.addEventListener("pointerup", finish);
  canvas.addEventListener("pointercancel", finish);
  /* 지우개일 때는 캔버스를 잠깐 벗어나도 계속 지우게 두지만,
     펜 뒤꼭지로 잠시 지우개가 된 상태라면 반드시 finish 를 거쳐 원래 도구로 돌아와야 한다. */
  canvas.addEventListener("pointerleave", ()=>{ if(state.tool!=="er" || penErase) finish(); });

  /* ── 도구 전환 ──
     "move"(이동) 는 그리는 도구가 아니라 손도구다. 이때는 캔버스가 아예 터치를 안 받게 해서
     (pointer-events:none) 필기 모드에 들어와 있어도 평소처럼 세로 스크롤·좌우 넘기기·핀치 확대가
     그대로 되고, 확대돼 있으면 한 손가락으로 화면을 끌어 옮길 수 있다. */
  function syncPointer(){
    const drawing = state.editing && state.tool !== "move";
    canvas.style.pointerEvents = drawing ? "auto" : "none";
    canvas.classList.toggle("edit", drawing);
    zoomCtl?.setPan(state.editing && state.tool === "move");
  }
  function setTool(name){
    if(!name) return;
    penErase = null;          /* 손으로 도구를 고른 순간, 펜 지우개 임시 상태는 없던 일로 */
    state.tool = name;
    tools.querySelectorAll("[data-tool]").forEach(x=>x.classList.toggle("on", x.dataset.tool===name));
    clearHold();
    if(state.drawing){ state.drawing = false; state.cur = null; straight = false; redraw(); }
    syncPointer();
    syncOpa();
  }
  tools.querySelectorAll("[data-tool]").forEach(b=>{
    b.onclick = ()=> setTool(b.dataset.tool);
  });

  /* 진하기 슬라이더 — 도구별로 값을 따로 기억하고, 도구를 바꾸면 그 도구의 값을 다시 보여준다.
     이미 그린 획은 건드리지 않는다(획마다 그릴 때의 진하기가 저장돼 있다). */
  const opaEl = tools.querySelector("[data-opa]");
  const opaVal = tools.querySelector("[data-opaval]");
  function syncOpa(){
    if(!opaEl) return;
    const t = (state.tool === "er") ? "pen" : state.tool;   // 지우개엔 진하기가 없다
    const v = Math.round((state.opa[t] ?? 1) * 100);
    opaEl.value = v;
    if(opaVal) opaVal.textContent = v + "%";
    opaEl.disabled = state.tool === "er";
    tools.querySelector(".itopa")?.style.setProperty("opacity", state.tool === "er" ? ".45" : "1");
  }
  opaEl?.addEventListener("input", ()=>{
    const t = (state.tool === "er") ? "pen" : state.tool;
    state.opa[t] = (+opaEl.value) / 100;
    if(opaVal) opaVal.textContent = opaEl.value + "%";
  });
  tools.querySelectorAll("[data-color]").forEach(b=>{
    b.style.background = b.dataset.color;
    b.onclick = ()=>{
      if(b.dataset.kind === "hi") state.hiColor = b.dataset.color; else state.color = b.dataset.color;
      tools.querySelectorAll(`[data-kind="${b.dataset.kind}"]`).forEach(x=>x.classList.toggle("on", x===b));
    };
  });
  tools.querySelector("[data-undo]").onclick = ()=>{
    const a = ensureAnno(); a.strokes.pop(); redraw(); saveAnnotation(qid);
  };
  tools.querySelector("[data-clear]").onclick = ()=>{
    if(!confirm("이 문항의 필기를 전부 지울까요?")) return;
    ensureAnno().strokes = []; redraw(); saveAnnotation(qid);
  };
  tools.querySelector("[data-close]").onclick = ()=> setEditing(false);

  /* silent=true 면 바깥에 알리지 않는다.
     처음 만들 때의 setEditing(false) 까지 바깥에 전해지면, "필기가 없으면 원래 카드로 되돌리기"가
     곧바로 발동해서 방금 만든 필기 페이지를 도로 부숴버린다. 초기화는 조용히 지나가야 한다. */
  function setEditing(on, silent){
    state.editing = on && S.loggedIn;
    tools.style.display = state.editing ? "flex" : "none";
    wrap.closest(".slide")?.classList.toggle("ink-editing", state.editing);
    if(!state.editing) zoomCtl?.setPan(false);
    syncPointer();
    if(!silent) onEditingChange?.(state.editing);
  }
  setEditing(false, true);
  syncOpa();
  resize();

  return { setEditing, setTool, redraw, resize, get editing(){ return state.editing; } };
}

/* ── 아주 작은 마크다운 (LaTeX 안 건드림) ── */
/* GFM 스타일 파이프 표(| a | b |\n|---|---|\n| 1 | 2 |) 를 인식해서 <table> 로 바꾼다.
   표가 아니면 null 을 돌려주므로, 호출하는 쪽에서 표가 아닌 다른 처리로 넘어간다. */
function tryTable(block){
  const lines = block.split("\n").filter(l => l.trim());
  if(lines.length < 2) return null;
  const isRow = l => /^\s*\|/.test(l);
  if(!isRow(lines[0])) return null;
  if(!/^\s*\|?[\s:|-]+\|?\s*$/.test(lines[1]) || !/-{2,}/.test(lines[1])) return null;
  const splitRow = l => l.trim().replace(/^\|/,"").replace(/\|$/,"").split("|").map(c=>c.trim());
  const header = splitRow(lines[0]);
  const rows = lines.slice(2).filter(isRow).map(splitRow);
  if(!rows.length) return null;
  let html = '<div class="mdtable"><table><thead><tr>' +
    header.map(h=>`<th>${h}</th>`).join("") + "</tr></thead><tbody>";
  for(const r of rows) html += "<tr>" + r.map(c=>`<td>${c}</td>`).join("") + "</tr>";
  html += "</tbody></table></div>";
  return html;
}
/* 그림 주소만 허용한다 — http(s) 와 data:image 뿐. javascript: 같은 건 통째로 버린다 */
function safeURL(u){
  const s = String(u||"").trim().replace(/&amp;/g,"&");
  return /^(https?:\/\/|data:image\/)/i.test(s) ? s : "";
}
function md(src){
  if(!src) return "";
  const keep=[];                       /* 원문 그대로 살려둘 조각(수식·그림·SVG) */
  const stash = m => `\u0000${keep.push(m)-1}\u0000`;
  let s = String(src);

  /* ① SVG 는 먼저 통째로 빼둔다 — esc 를 거치면 글자로 보여버린다.
        (자동 변환에서 우리 파이프라인이 만든 그림만 들어오는 자리다) */
  s = s.replace(/<svg[\s\S]*?<\/svg>/gi, m => stash(m));

  s = esc(s);

  /* ② 수식 */
  s = s.replace(/\$\$[\s\S]*?\$\$|\$[^$\n]+?\$/g, m=>stash(m));

  /* ③ 그림  ![설명](주소)  — 링크보다 먼저 처리해야 한다 */
  s = s.replace(/!\[([^\]]*)\]\(([^)\s]+)(?:\s+"[^"]*")?\)/g, (m,alt,url)=>{
    const u = safeURL(url);
    return u ? stash(`<img class="qimg" src="${u}" alt="${alt}" loading="lazy">`) : "";
  });
  /* ④ 링크  [글자](주소) */
  s = s.replace(/\[([^\]]+)\]\(([^)\s]+)\)/g, (m,txt,url)=>{
    const u = safeURL(url);
    return u ? stash(`<a href="${u}" target="_blank" rel="noopener">${txt}</a>`) : txt;
  });

  s = s.replace(/`([^`]+)`/g,"<code>$1</code>")
       .replace(/\*\*(.+?)\*\*/g,"<strong>$1</strong>")
       .replace(/^---$/gm,"<hr>");
  s = s.split(/\n{2,}/).map(block=>{
    const table = tryTable(block);
    if(table) return table;
    if(/^\s*[-•]\s/m.test(block) && block.split("\n").every(l=>/^\s*[-•]\s/.test(l)||!l.trim()))
      return "<ul>"+block.split("\n").filter(l=>l.trim()).map(l=>`<li>${l.replace(/^\s*[-•]\s/,"")}</li>`).join("")+"</ul>";
    if(/^\s*\d+[.)]\s/.test(block) && block.split("\n").every(l=>/^\s*\d+[.)]\s/.test(l)||!l.trim()))
      return "<ol>"+block.split("\n").filter(l=>l.trim()).map(l=>`<li>${l.replace(/^\s*\d+[.)]\s/,"")}</li>`).join("")+"</ol>";
    if(block.startsWith("<hr>")) return block;
    return "<p>"+block.replace(/\n/g,"<br>")+"</p>";
  }).join("");
  return s.replace(/\u0000(\d+)\u0000/g,(_,i)=>keep[i]);
}
/* 자동 변환이 수식 구분자($)를 빠뜨리고 LaTeX 만 넣어 둔 문항이 있다. 그러면 KaTeX 가
   수식인 줄 모르고 지나가서 \frac{1}{\omega L} 이 글자 그대로 화면에 남는다.
   $ 가 하나도 없고 한글도 없는데 LaTeX 명령만 들어 있으면, 그 줄은 통째로 수식으로 본다.
   한글이 섞인 줄은 어디까지가 수식인지 확실치 않아 손대지 않는다 — 멀쩡한 문장을
   깨뜨리는 쪽이 더 나쁘다. */
const TEX_CMD = /\\(frac|dfrac|tfrac|sqrt|over|cdot|times|div|pm|mp|le|leq|ge|geq|neq|approx|equiv|propto|sum|prod|int|infty|partial|log|ln|exp|sin|cos|tan|alpha|beta|gamma|delta|epsilon|zeta|eta|theta|kappa|lambda|mu|nu|xi|rho|sigma|tau|phi|chi|psi|omega|Gamma|Delta|Theta|Lambda|Xi|Pi|Sigma|Phi|Psi|Omega|left|right|begin|mathrm|mathbf|text|hat|bar|vec|dot|angle|circ)\b/;
function autoMath(s){
  const t = String(s ?? "").trim();
  if(!t || t.includes("$")) return s;
  if(/[가-힣]/.test(t)) return s;              /* 한글이 섞이면 건드리지 않는다 */
  if(/<svg|!\[|\\begin\{tikzpicture\}/.test(t)) return s;   /* 그림·tikz 는 대상 아님 */
  if(!TEX_CMD.test(t)) return s;
  return "$" + t + "$";
}

const tex = el=>{
  if(!window.renderMathInElement) return;
  try{ renderMathInElement(el,{delimiters:[
    {left:"$$",right:"$$",display:true},{left:"$",right:"$",display:false},
    {left:"\\[",right:"\\]",display:true},{left:"\\(",right:"\\)",display:false}
  ],throwOnError:false,ignoredTags:["script","noscript","style","textarea","pre","code","svg"]}); }catch(e){}
};

/* ═══════════════════════════════════════════════
   형광펜 — 드래그로 고른 글자에 노란 밑칠
   ───────────────────────────────────────────────
   저장 형식: S.hl[문항id][블록키] = [[시작글자, 끝글자], …]
   블록키는 data-hl 값(q=문제, c0~c3=보기, x=해설)이고,
   글자 번호는 그 블록 안의 텍스트를 처음부터 이어 세었을 때의 위치다.
   수식(.katex)·svg 안은 아예 세지 않는다 — KaTeX 가 만드는 숨은 글자까지
   세면 라이브러리가 바뀔 때마다 밑칠 위치가 통째로 밀리기 때문이다.
   ═══════════════════════════════════════════════ */
S.hl = LS.get("hl", {});

const hlGet = (qid,key) => (S.hl[qid]||{})[key] || [];
function hlSet(qid, key, ranges){
  const bag = S.hl[qid] || (S.hl[qid] = {});
  if(ranges.length) bag[key] = ranges; else delete bag[key];
  if(!Object.keys(bag).length) delete S.hl[qid];
  LS.set("hl", S.hl);
}
function hlMerge(list){
  /* 형광펜끼리, 취소선끼리만 이어 붙인다. 종류가 다르면 겹쳐도 따로 남긴다. */
  const out = [];
  for(const kind of ["h", "s"]){
    const a = list.filter(r => (r[2] === "s" ? "s" : "h") === kind && r[1] > r[0])
                  .map(r => [r[0], r[1], kind]).sort((x, y) => x[0] - y[0]);
    for(const r of a){
      const last = out[out.length-1];
      if(last && last[2] === kind && r[0] <= last[1]) last[1] = Math.max(last[1], r[1]);
      else out.push(r);
    }
  }
  return out;
}
function hlSubtract(ranges, s, e){
  const out = [];
  for(const r of ranges){
    const [a, b] = r, k = r[2] === "s" ? "s" : "h";
    if(b <= s || a >= e){ out.push([a, b, k]); continue; }
    if(a < s) out.push([a, s, k]);
    if(b > e) out.push([e, b, k]);
  }
  return out;
}

/* 블록 안의 텍스트 노드를 문서 순서대로, 글자 번호와 함께 모은다.
   ★ 수식(.katex)은 예전에 통째로 «건너뛰었다». KaTeX 가 만드는 숨은 글자까지 세면
      라이브러리가 바뀔 때마다 밑칠 위치가 밀리기 때문인데, 그 대가로
      수식에는 형광펜이 아예 안 칠해졌다(글자만 노랗고 식은 하얗게 남았다).
      그래서 «세지 않는다» 대신 «한 글자짜리 덩어리로 센다» 로 바꿨다.
      안쪽이 몇 글자든 밖에서는 언제나 1 이라 위치가 밀리지 않고,
      칠할 때는 수식 전체를 <mark> 로 감싼다. */
const HL_ATOM = ".katex-display, .katex, svg, math, .qfig, img";
function hlNodes(block){
  const out = [];
  let pos = 0;
  (function walk(node){
    for(const ch of node.childNodes){
      if(ch.nodeType === 3){
        if(!ch.nodeValue) continue;
        out.push({ node:ch, start:pos, end:pos + ch.nodeValue.length });
        pos += ch.nodeValue.length;
        continue;
      }
      if(ch.nodeType !== 1) continue;
      const tag = ch.tagName.toLowerCase();
      if(tag === "script" || tag === "style") continue;
      if(ch.matches?.(HL_ATOM)){
        out.push({ el:ch, atomic:true, start:pos, end:pos + 1 });
        pos += 1;
        continue;
      }
      walk(ch);
    }
  })(block);
  return out;
}
/* 선택 지점(노드+오프셋)을 블록 안 글자 번호로 옮긴다.
   수식 덩어리 안이나 블록 밖을 가리키면 그 덩어리 경계로 잘라 붙인다.
   bias 가 "e" 면 끝쪽으로, 아니면 시작쪽으로 붙인다 — 수식을 반만 고르는 일을 막는다. */
function hlPointAt(map, node, offset, bias){
  for(const t of map) if(t.node === node) return t.start + offset;
  if(!map.length) return 0;
  const el = node?.nodeType === 1 ? node : node?.parentElement;
  for(const t of map)
    if(t.atomic && (t.el === node || (el && t.el.contains(el))))
      return bias === "e" ? t.end : t.start;
  const p = document.createRange();
  try{ p.setStart(node, offset); }catch(e){ return 0; }
  p.collapse(true);
  for(const t of map){
    const tr = document.createRange();
    try{ t.atomic ? tr.selectNode(t.el) : tr.selectNodeContents(t.node); }catch(e){ continue; }
    if(p.compareBoundaryPoints(Range.START_TO_START, tr) <= 0) return t.start;
  }
  return map[map.length-1].end;
}

/* 저장된 글자 범위대로 <mark> 를 다시 씌운다 */
function hlPaint(block, ranges){
  block.querySelectorAll("mark.hlm").forEach(m => {
    const p = m.parentNode;
    while(m.firstChild) p.insertBefore(m.firstChild, m);
    p.removeChild(m);
  });
  block.normalize();
  if(!ranges || !ranges.length) return;
  const map = hlNodes(block);

  /* 형광펜과 취소선이 겹칠 수 있으므로, 구간을 그냥 잘라 넣지 않고
     글자마다 어떤 표시가 걸렸는지 적어둔 뒤 같은 표시가 이어지는 만큼 한 번에 감싼다. */
  const mkOf = kind => {
    const mk = document.createElement("mark");
    mk.className = "hlm" + (kind.includes("h") ? " hl" : "") + (kind.includes("s") ? " st" : "");
    return mk;
  };

  for(let i = map.length - 1; i >= 0; i--){
    const t = map[i], len = t.end - t.start;
    if(len <= 0) continue;

    /* 수식·그림 덩어리 — 완전히 덮였을 때만 통째로 감싼다 */
    if(t.atomic){
      let kind = "";
      for(const r of ranges){
        const k = r[2] === "s" ? "s" : "h";
        if(r[0] <= t.start && r[1] >= t.end && !kind.includes(k)) kind += k;
      }
      if(!kind || !t.el.parentNode) continue;
      const mk = mkOf(kind);
      /* 가운데 정렬된 큰 수식·그림은 줄 안에 흐르지 않는다. 감싸는 쪽도 블록이어야 배경이 덮인다 */
      if(t.el.matches(".katex-display, .qfig, svg, img")) mk.classList.add("blk");
      t.el.parentNode.replaceChild(mk, t.el);
      mk.appendChild(t.el);
      continue;
    }

    const kinds = new Array(len).fill("");
    for(const r of ranges){
      const [s0, e0] = r, kind = r[2] === "s" ? "s" : "h";
      const a0 = Math.max(s0, t.start), b0 = Math.min(e0, t.end);
      for(let c = a0 - t.start; c < b0 - t.start; c++)
        if(!kinds[c].includes(kind)) kinds[c] += kind;
    }
    const runs = [];
    let c = 0;
    while(c < len){
      if(!kinds[c]){ c++; continue; }
      let j = c; while(j < len && kinds[j] === kinds[c]) j++;
      runs.push([c, j, kinds[c]]); c = j;
    }
    runs.sort((x, y) => y[0] - x[0]);          // 뒤에서부터 잘라야 앞 글자 번호가 안 흔들린다
    for(const [a1, b1, kind] of runs){
      const node = t.node;
      if(b1 < node.nodeValue.length) node.splitText(b1);
      const target = a1 > 0 ? node.splitText(a1) : node;
      const mk = mkOf(kind);
      target.parentNode.replaceChild(mk, target);
      mk.appendChild(target);
    }
  }
}
/* 새로 그린 문항에 저장된 형광펜을 입힌다 — tex() 뒤에 부른다 */
function hlApply(root){
  root?.querySelectorAll("[data-hl]").forEach(b => {
    try{ hlPaint(b, hlGet(b.dataset.qid, b.dataset.hl)); }catch(e){}
  });
}

/* ── 말풍선 ── */
let HLSEL = null, HLSHOWN = 0, HLTOUCH = false;
addEventListener("pointerdown", e => { if(!e.target.closest?.(".hlbar")) HLTOUCH = e.pointerType !== "mouse"; }, true);
function hlHide(){ $("#hlbar")?.classList.remove("on"); HLSEL = null; }
function hlShow(rect, canDelete, canAdd = true){
  const bar = $("#hlbar"); if(!bar) return;
  $("#hlAdd").hidden = !canAdd;
  $("#hlStrike").hidden = !canAdd;
  $("#hlDel").hidden = !canDelete;
  bar.classList.add("on");
  const w = bar.offsetWidth, h = bar.offsetHeight;
  let x = rect.left + rect.width/2 - w/2;
  x = Math.max(10, Math.min(innerWidth - w - 10, x));
  /* 기본은 선택 영역 아래 — 브라우저 기본 메뉴(복사·공유)는 보통 위에 뜨므로 겹치지 않게.
     손가락으로 고르면 선택 끝에 동그란 손잡이가 붙는데, 그게 우리 단추를 덮어
     아무리 눌러도 안 먹었다. 그래서 터치일 때는 더 아래로 내린다. */
  const vh = (window.visualViewport?.height) || innerHeight;
  let y = rect.bottom + (HLTOUCH ? 30 : 10);
  if(y + h > vh - 12) y = Math.max(10, rect.top - h - (HLTOUCH ? 30 : 10));
  if(y < 8) y = Math.min(vh - h - 8, rect.bottom + 30);
  HLSHOWN = Date.now();
  bar.style.left = x + "px";
  bar.style.top  = y + "px";
}
const hlEl = n => n && (n.nodeType === 1 ? n : n.parentElement);

let hlTimer = 0, HLBUSY = false;
document.addEventListener("selectionchange", ()=>{
  clearTimeout(hlTimer);
  hlTimer = setTimeout(()=>{ if(!HLBUSY) hlFromSelection(); }, 130);
});
function hlFromSelection(){
  const sel = getSelection();
  if(!sel || sel.isCollapsed || !sel.rangeCount) return hlHide();
  const r = sel.getRangeAt(0);
  const block = hlEl(r.commonAncestorContainer)?.closest("[data-hl]")
             || hlEl(r.startContainer)?.closest("[data-hl]");
  if(!block || !block.dataset.qid) return hlHide();
  const map = hlNodes(block);
  let s = hlPointAt(map, r.startContainer, r.startOffset, "s");
  let e = hlPointAt(map, r.endContainer, r.endOffset, "e");
  if(e < s) [s,e] = [e,s];
  if(e <= s) return hlHide();
  const qid = block.dataset.qid, key = block.dataset.hl;
  HLSEL = { qid, key, s, e, block };
  hlShow(r.getBoundingClientRect(), hlGet(qid,key).some(([a,b]) => a < e && b > s));
}

/* 이미 칠해둔 곳을 그냥 눌렀을 때 — 지우기만 띄운다 */
document.addEventListener("click", e=>{
  if(e.target.closest?.(".hlbar")) return;
  const mk = e.target.closest?.("mark.hl");
  if(!mk){ if(getSelection()?.isCollapsed !== false) hlHide(); return; }
  const block = mk.closest("[data-hl]"); if(!block || !block.dataset.qid) return;
  const inside = hlNodes(block).filter(t => mk.contains(t.atomic ? t.el : t.node));
  if(!inside.length) return;
  HLSEL = { qid:block.dataset.qid, key:block.dataset.hl,
            s:inside[0].start, e:inside[inside.length-1].end, block };
  hlShow(mk.getBoundingClientRect(), true, false);
});

/* 말풍선을 누르는 동안에는 선택이 풀려도 말풍선을 닫지 않는다.
   (누르는 순간 선택이 해제되면서 버튼이 사라져 클릭이 안 먹는 걸 막는다.
    실제 동작에 필요한 값은 이미 HLSEL 에 담아뒀으므로 선택이 풀려도 상관없다.) */
document.addEventListener("pointerdown", e=>{
  if(!e.target.closest?.(".hlbar")) return;
  HLBUSY = true;
  if(e.pointerType === "mouse") e.preventDefault();   // 데스크톱은 선택을 그대로 둔 채 누를 수 있다
}, true);
document.addEventListener("pointerup", ()=>{ setTimeout(()=>{ HLBUSY = false; }, 350); }, true);
/* 스크롤로 닫을 때도 잠깐 기다린다.
   폰에서는 글자를 고르는 동안에도 화면이 살짝 흔들려 scroll 이 뜨는데,
   그때마다 말풍선이 사라져서 누를 틈이 없었다. */
addEventListener("scroll", ()=>{ if(HLSEL && !HLBUSY && Date.now() - HLSHOWN > 700) hlHide(); }, true);
addEventListener("resize", hlHide);

/* 형광펜·취소선·지우기를 한 곳에서 처리한다.
   예전에는 click 만 듣고 있었는데, 폰에서는 단추를 누르는 순간 글자 선택이 풀리면서
   click 이 아예 오지 않는 경우가 많았다(브라우저마다 다르다).
   그래서 pointerup 에서 먼저 처리하고, click 은 중복만 걸러 낸다. */
let HLACT = 0;
function hlDo(id){
  if(!HLSEL) return;
  if(Date.now() - HLACT < 400) return;      /* pointerup 과 click 이 겹쳐 두 번 도는 것 방지 */
  HLACT = Date.now();
  const {qid,key,s,e,block} = HLSEL;
  if(id === "hlAdd")         hlSet(qid, key, hlMerge([...hlGet(qid,key), [s,e]]));
  else if(id === "hlStrike") hlSet(qid, key, hlMerge([...hlGet(qid,key), [s,e,"s"]]));
  else if(id === "hlDel")    hlSet(qid, key, hlSubtract(hlGet(qid,key), s, e));
  else return;
  hlPaint(block, hlGet(qid,key));
  getSelection()?.removeAllRanges();
  hlHide();
}
["pointerup","click"].forEach(ev =>
  $("#hlbar")?.addEventListener(ev, e => {
    const b = e.target.closest("button"); if(!b) return;
    e.preventDefault(); e.stopPropagation();
    hlDo(b.id);
  }));

/* 과목 목록을 읽는다.
   subject_list 는 «뷰» 라서, SQL 을 손대다 뷰가 깨지면 여기서 통째로 막힌다.
   그럴 때 화면이 텅 비어 버리면 원인을 알 수 없으므로,
   뷰가 안 되면 원본 표(subjects)로 한 번 더 시도하고 회차·문항 수는 직접 세어 붙인다. */
/* 서버가 대답을 안 하면 여기서 영원히 기다린다 — 화면에는 회색 상자만 남는다.
   시간 제한을 걸어, 늦으면 «왜 안 되는지» 를 화면에 띄운다. */
function withTimeout(promise, ms, what){
  return Promise.race([
    promise,
    new Promise((_, rej) => setTimeout(() => rej(new Error(`${what} — ${ms/1000}초 안에 응답이 없습니다`)), ms))
  ]);
}
async function loadSubjectRows(){
  let v;
  try{
    v = await withTimeout(sb.from("subject_list").select("*").order("sort_order").order("name"),
                          9000, "서버 연결");
  }catch(e){
    return { rows:[], error:(e.message || String(e)) + "|OFFLINE" };
  }
  if(!v.error && v.data?.length) return { rows:v.data, error:null };
  const firstErr = v.error?.message || null;

  for(const t of ["subjects","subject"]){
    const b = await sb.from(t).select("*");
    if(b.error || !b.data) continue;
    const rows = b.data.slice().sort((x,y) =>
      (x.sort_order ?? 0) - (y.sort_order ?? 0) || String(x.name||"").localeCompare(String(y.name||"")));
    const ex = await sb.from("exam_list").select("id,subject_id,question_count");
    if(!ex.error && ex.data){
      const cnt = {};
      ex.data.forEach(e => {
        const c = cnt[e.subject_id] || (cnt[e.subject_id] = { e:0, q:0 });
        c.e++; c.q += (e.question_count || 0);
      });
      rows.forEach(r => {
        r.exam_count     = r.exam_count     ?? (cnt[r.id]?.e || 0);
        r.question_count = r.question_count ?? (cnt[r.id]?.q || 0);
      });
    }
    rows.forEach(r => { r.exam_count = r.exam_count || 0; r.question_count = r.question_count || 0; });
    if(rows.length) return { rows, error:null };
  }
  return { rows:[], error: firstErr };
}

/* 회차 배지에 넣을 짧은 글. 숫자면 "3회", 아니면 이름 앞부분(최대 4글자). */
function sessBadge(e){
  /* 왼쪽 동그란 배지는 «회차» 칸을 그대로 보여준다. 그게 그 칸의 용도다.
     숫자만 적혀 있으면 «3» → «3회» 로 붙여 준다.
     예전에는 이름의 끝말을 가져다 써서, 회차를 «개념» 으로 고쳐도 배지가 안 따라왔다. */
  const n = String(e.session ?? "").trim();
  if(n) return /^\d+$/.test(n) ? n + "회" : (n.length <= 6 ? n : n.slice(0, 6));
  /* 회차 칸이 비었을 때만 이름의 끝말로 대신한다 */
  const parts = String(e.label || "").trim().split(/\s+/).filter(Boolean);
  const last = parts[parts.length - 1] || "";
  return last ? (last.length <= 6 ? last : last.slice(0, 6)) : "자료";
}

/* ═══════════════════════════════════════════════
   시험 정보 · 출제경향
   시험 제도가 바뀐 시점 같은 건 어딘가에 적어 두면 과목이 늘 때마다 손으로 고쳐야 하고,
   틀린 채로 남으면 오히려 해가 된다. 그래서 아무것도 적어 두지 않고
   올려둔 회차의 과목 구성이 어디서 갈라지는지를 그때그때 읽어 낸다.
   ═══════════════════════════════════════════════ */

/* "3과목 : 시운전 및 안전관리" → {i:3, name:"시운전 및 안전관리"} */
function partOf(s){
  const t = String(s ?? "").trim();
  if(!t) return null;
  const m = t.match(/^(\d{1,2})\s*과목\s*[:·.\-]?\s*(.*)$/);
  return m ? { i:+m[1], name:(m[2] || `${m[1]}과목`).trim() } : { i:99, name:t };
}

/* 가진 번호에서 빠진 구간만 짧게 — [1,2,3,5,9] , 10 → "4, 6~8, 10" */
function missingRanges(nums, max){
  const set = new Set(nums), out = [];
  let s = null;
  for(let n = 1; n <= max; n++){
    if(!set.has(n)){ if(s === null) s = n; }
    else if(s !== null){ out.push(s === n-1 ? `${s}` : `${s}~${n-1}`); s = null; }
  }
  if(s !== null) out.push(s === max ? `${s}` : `${s}~${max}`);
  return out;
}

async function buildExamInfo(subjectId, box){
  box.innerHTML = `<p>회차를 훑는 중…</p>`;

  const {data:exams, error:e1} = await sb.from("exam_list")
    .select("id,label,year,session,question_count").eq("subject_id", subjectId);
  if(e1 || !exams?.length) return void (box.innerHTML = `<p>회차를 읽지 못했습니다.</p>`);

  let qs = [];
  try{
    qs = await fetchAllRows("questions", "id,exam_id,number,subject_part",
                            q => q.in("exam_id", exams.map(e => e.id)));
  }catch(e){ return void (box.innerHTML = `<p>문항을 읽지 못했습니다 — ${esc(e.message || e)}</p>`); }

  /* ── 회차별로 모으기 ── */
  const byExam = new Map();
  exams.forEach(e => byExam.set(e.id, { ...e, nums:[], parts:new Map(), rows:0 }));
  (qs || []).forEach(q => {
    const b = byExam.get(q.exam_id);
    if(!b) return;
    b.rows++;
    if(q.number != null) b.nums.push(+q.number);
    const p = partOf(q.subject_part);
    if(p) b.parts.set(p.i, p.name);
  });
  byExam.forEach(b => {
    b.uniq  = new Set(b.nums).size;
    b.maxNo = b.nums.length ? Math.max(...b.nums) : 0;
    b.dup   = b.rows - b.uniq;
  });

  /* ── 과목 구성이 같은 연도끼리 묶는다. 갈라지는 지점이 곧 제도가 바뀐 해다 ── */
  const sig = b => [...b.parts.keys()].sort((x,y) => x-y).map(i => `${i}:${b.parts.get(i)}`).join(" / ");
  const chrono = [...byExam.values()].sort((a,b) => (a.year - b.year) || (a.session - b.session));
  const eras = [];
  chrono.forEach(b => {
    const s = sig(b);
    if(!s) return;                       /* 과목 정보가 없는 회차는 판단에서 뺀다 */
    const last = eras[eras.length - 1];
    if(last && last.sig === s){ last.to = b; last.ex.push(b); }
    else eras.push({ sig:s, from:b, to:b, ex:[b], parts:b.parts });
  });

  const newest = eras[eras.length - 1] || null;
  const eraCeil = e => Math.max(...e.ex.map(b => b.maxNo), 0);

  const eraHTML = [...eras].reverse().map(e => {
    const names = [...e.parts.keys()].sort((x,y) => x-y).map(i => esc(e.parts.get(i)));
    const span = e.from.year === e.to.year ? `${e.from.year}년` : `${e.from.year} ~ ${e.to.year}년`;
    return `<div class="era ${e === newest ? "now" : ""}">
      <div class="lab">${span}${e === newest ? `<span class="flag">지금 형식</span>` : ""}</div>
      <div class="txt"><b>${names.length}과목</b> · 번호는 <b>${eraCeil(e)}번</b>까지 확인됩니다<br>${names.join(" / ")}</div>
    </div>`;
  }).join("");

  const changed = eras.length > 1
    ? `<p><b>형식이 바뀐 해 — ${eras[eras.length-1].from.year}년.</b>
        그 이전 회차는 과목 구성 자체가 달라서 지금 시험과 그대로 맞물리지 않습니다.
        내용을 복습하는 데는 여전히 쓸모가 있지만, <b>과목별 비중과 문항 수는 다릅니다.</b>
        범위를 지금 시험에 맞추고 싶다면 ${eras[eras.length-1].from.year}년 이후 회차만 보시면 됩니다.</p>`
    : `<p>올려둔 회차 안에서는 과목 구성이 바뀐 적이 없습니다.</p>`;

  /* ── 빠진 번호 · 겹친 번호 ── */
  const ceilOf = b => {
    const e = eras.find(x => x.ex.includes(b));
    return Math.max(b.maxNo, e ? eraCeil(e) : 0);
  };
  const flawed = chrono.filter(b => b.rows).map(b => {
    const miss = missingRanges(b.nums, ceilOf(b));
    return { b, miss };
  }).filter(x => x.miss.length || x.b.dup > 0).reverse();

  const gapHTML = flawed.length
    ? flawed.map(({b, miss}) => `<div class="gapline"><b>${esc(b.label)}</b> — ${b.uniq}/${ceilOf(b)}번
        ${miss.length ? `· 빠짐 <span class="miss">${miss.join(", ")}</span>` : ""}
        ${b.dup > 0 ? `· 겹침 <span class="miss">${b.dup}개</span>` : ""}</div>`).join("")
    : `<p>빠지거나 겹친 번호가 없습니다.</p>`;

  /* ── 출제경향 — 지금 형식 회차만 본다 ── */
  let trendHTML = `<p>지금 형식의 회차가 아직 없습니다.</p>`;
  if(newest){
    const eraIds = new Set(newest.ex.map(b => b.id));
    const cnt = new Map();
    (qs || []).forEach(q => {
      if(!eraIds.has(q.exam_id)) return;
      const p = partOf(q.subject_part);
      if(p) cnt.set(p.i, (cnt.get(p.i) || 0) + 1);
    });
    const tot = [...cnt.values()].reduce((a, b) => a + b, 0) || 1;
    const bars = [...cnt.keys()].sort((x,y) => x-y).map(i => {
      const v = cnt.get(i), pc = v / tot * 100;
      return `<div class="barrow">
        <span class="nm">${esc(newest.parts.get(i) || i + "과목")}</span>
        <span class="tr"><span class="fl" style="width:${pc.toFixed(1)}%"></span></span>
        <span class="vv">${v}문항</span>
      </div>`;
    }).join("");

    /* 주제 묶음은 섞어보기가 이미 만들어 둔 것을 그대로 쓴다 — 같은 기준이어야 헷갈리지 않는다 */
    const ix = S._mix?.[subjectId];
    let chips = `<p>주제를 세려면 목록을 한 번 더 불러와야 합니다. 회차 목록으로 나갔다 들어와 주세요.</p>`;
    if(ix?.rows?.length){
      const g = new Map();
      ix.rows.forEach(r => {
        if(!eraIds.has(r.exam_id) || !r._key) return;
        const o = g.get(r._gid) || g.set(r._gid, { key:r._key, ex:new Set(), n:0 }).get(r._gid);
        o.ex.add(r.exam_id); o.n++;
      });
      const top = [...g.values()].filter(o => o.ex.size >= 2)
        .sort((a, b) => b.ex.size - a.ex.size || b.n - a.n).slice(0, 14);
      chips = top.length
        ? `<div class="topics">${top.map(o =>
            `<span class="topic">${esc(o.key)}<i>${o.ex.size}회차 · ${o.n}문항</i></span>`).join("")}</div>
           <p style="margin-top:9px">여러 회차에 되풀이해 나온 주제를 <b>회차 수</b> 순으로 세웠습니다.
             주제어는 그 묶음에서 가장 특징적인 낱말이라 어색해 보일 수 있는데, 묶음 자체는 문항끼리 실제로
             겹치는 낱말로 만들어집니다. 섞어보기의 금·은·동과 같은 기준입니다.</p>`
        : `<p>아직 되풀이해 나온 주제를 잡을 만큼 회차가 모이지 않았습니다.</p>`;
    }
    trendHTML = bars + `<div style="height:12px"></div>` + chips;
  }

  box.innerHTML = `
    <section>
      <h4>시험 형식</h4>
      ${eraHTML || `<p>과목 정보가 있는 회차가 없습니다.</p>`}
      ${changed}
    </section>
    <section>
      <h4>회차 점검</h4>
      ${gapHTML}
      <p style="margin-top:9px">빠진 번호는 아직 안 올라온 문항입니다. 자동 변환에서 그 쪽수만 다시 돌리면 채워집니다.
        겹침은 같은 번호가 두 번 들어간 것이라, 정리 모드에서 지워 주셔야 합니다.</p>
    </section>
    <section>
      <h4>출제경향 · 지금 형식 기준</h4>
      ${trendHTML}
    </section>`;
}

/* ═══════════════════════════════════════════════
   찍어 온 자료를 다시 짜기
   노트를 비스듬히 찍은 사진은 그대로 두면 읽기가 괴롭다.
   AI 에게 사진을 보내 표는 표로, 목록은 목록으로 옮겨 적게 하고
   그 결과를 원본 사진과 함께 보관한다. 사진은 절대 지우지 않는다 —
   옮겨 적다 틀릴 수 있으므로 언제든 원본과 대조할 수 있어야 한다.
   ═══════════════════════════════════════════════ */
/* ═══════════════════════════════════════════════
   사진을 스캔본처럼 펴기

   폰으로 찍은 종이는 그늘이 한쪽에 지고 전체가 누렇다.
   글자를 옮겨 적는 게 아니라 밝기만 손보므로 숫자가 틀릴 위험이 없다.

   방법: 사진을 크게 흐린 것이 곧 "조명 지도"다.
        원본을 그 조명 지도로 나누면 그늘이 통째로 사라지고 종이가 하얘진다.
        (스캐너 앱들이 쓰는 것과 같은 원리다. 원근 왜곡은 못 편다 — 그건 따로 찍어야 한다)
   ═══════════════════════════════════════════════ */

/* 넓은 범위 평균을 빠르게 구하려고 누적합 표를 쓴다. 픽셀 수와 상관없이 한 번만 훑는다. */
function boxBlurGray(gray, w, h, r){
  const sum = new Float64Array((w+1) * (h+1));
  for(let y = 0; y < h; y++){
    let rowSum = 0;
    for(let x = 0; x < w; x++){
      rowSum += gray[y*w + x];
      sum[(y+1)*(w+1) + (x+1)] = sum[y*(w+1) + (x+1)] + rowSum;
    }
  }
  const out = new Float32Array(w*h);
  for(let y = 0; y < h; y++){
    const y0 = Math.max(0, y-r), y1 = Math.min(h-1, y+r);
    for(let x = 0; x < w; x++){
      const x0 = Math.max(0, x-r), x1 = Math.min(w-1, x+r);
      const area = (x1-x0+1) * (y1-y0+1);
      const s = sum[(y1+1)*(w+1) + (x1+1)] - sum[y0*(w+1) + (x1+1)]
              - sum[(y1+1)*(w+1) + x0]     + sum[y0*(w+1) + x0];
      out[y*w + x] = s / area;
    }
  }
  return out;
}

/* opts: { rotate: 도, strength: 0~100, mono: true/false } */
async function flattenPhoto(blob, opts){
  const { rotate = 0, strength = 55, mono = false } = opts || {};
  const bmp = await createImageBitmap(blob);
  const MAXW = 1800;
  const scale = Math.min(1, MAXW / Math.max(bmp.width, bmp.height));
  const bw = Math.round(bmp.width * scale), bh = Math.round(bmp.height * scale);

  const rad = rotate * Math.PI / 180;
  const cos = Math.abs(Math.cos(rad)), sin = Math.abs(Math.sin(rad));
  const cw = Math.round(bw*cos + bh*sin), ch = Math.round(bw*sin + bh*cos);

  const cv = document.createElement("canvas");
  cv.width = cw; cv.height = ch;
  const ctx = cv.getContext("2d", { willReadFrequently: true });
  ctx.fillStyle = "#fff"; ctx.fillRect(0, 0, cw, ch);
  ctx.translate(cw/2, ch/2); ctx.rotate(rad);
  ctx.drawImage(bmp, -bw/2, -bh/2, bw, bh);
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  bmp.close?.();

  const img = ctx.getImageData(0, 0, cw, ch), d = img.data;
  const n = cw * ch;
  const gray = new Float32Array(n);
  for(let i = 0; i < n; i++){
    const j = i*4;
    gray[i] = 0.299*d[j] + 0.587*d[j+1] + 0.114*d[j+2];
  }

  /* 조명 지도 — 글자보다 훨씬 넓게 흐려야 글자가 배경에 섞이지 않는다 */
  const r = Math.max(12, Math.round(Math.max(cw, ch) / 22));
  const bg = boxBlurGray(gray, cw, ch, r);

  /* 원본을 조명 지도로 나누면 종이는 1.0 근처, 글자는 그보다 작다.
     그 구간을 0~255 로 곧게 펴 준다.
     ★ 예전 방식(밝으면 무조건 흰색)은 흐린 글자까지 지워 대비가 오히려 반토막 났다.
       실제 사진으로 재보니 대비 130 → 47 로 떨어졌다. 지금 방식은 130 → 246 으로 오른다. */
  const span = 0.18 + (strength / 100) * 0.32;
  const lo = 1.0 - span;
  for(let i = 0; i < n; i++){
    const norm = gray[i] / Math.max(bg[i], 1);
    let v = (norm - lo) / (1.0 - lo) * 255;
    v = v < 0 ? 0 : v > 255 ? 255 : v;
    if(mono) v = v > 128 ? 255 : 0;
    const j = i*4;
    d[j] = d[j+1] = d[j+2] = v;
    d[j+3] = 255;
  }
  ctx.putImageData(img, 0, 0);
  return await new Promise(res => cv.toBlob(res, "image/jpeg", 0.9));
}

let FLAT = null;      // { id, subjectId, box, blob, rotate, strength, mono }

async function noteFlatOpen(id, subjectId, box){
  if(!needLogin()) return;
  const row = box.querySelector(`[data-note="${id}"]`);
  const url = row?.dataset.url;
  if(!url) return toast("사진 주소를 찾지 못했습니다.");
  toast("사진을 여는 중…");
  try{
    const blob = await fetch(url).then(r => r.blob());
    FLAT = { id, subjectId, box, blob, rotate:0, strength:55, mono:false };
    const ov = document.createElement("div");
    ov.className = "flatov on"; ov.id = "flatOv";
    ov.innerHTML = `<div class="flatbox">
      <div class="flathead">사진 다듬기 <button class="figbtn" data-flatclose type="button">닫기</button></div>
      <div class="flatimg"><img id="flatPrev" alt="미리보기"></div>
      <div class="flatctl">
        <div class="fr"><span>돌리기</span>
          <button class="figbtn" data-rot="-90">↺ 90°</button>
          <button class="figbtn" data-rot="90">↻ 90°</button>
          <input type="range" id="flatRot" min="-8" max="8" step="0.5" value="0">
          <b id="flatRotV">0°</b>
        </div>
        <div class="fr"><span>또렷하게</span>
          <input type="range" id="flatStr" min="10" max="90" step="5" value="55">
          <b id="flatStrV">55</b>
        </div>
        <label class="fr chk"><input type="checkbox" id="flatMono"> 흑백 두 값으로만 (글자가 더 진해집니다)</label>
        <div class="fr end">
          <button class="figbtn" data-flatclose type="button">취소</button>
          <button class="figbtn save" data-flatsave type="button">이걸로 저장</button>
        </div>
        <div class="fhint">원본 사진은 그대로 남습니다. 언제든 되돌릴 수 있습니다.
          기울어진 건 조금 펼 수 있지만, 비스듬히 찍힌 원근은 못 폅니다.</div>
      </div>
    </div>`;
    document.body.appendChild(ov);
    ov.querySelectorAll("[data-flatclose]").forEach(b => b.onclick = noteFlatClose);
    ov.querySelector("[data-flatsave]").onclick = noteFlatSave;
    ov.querySelectorAll("[data-rot]").forEach(b => b.onclick = () => {
      FLAT.rotate = ((FLAT.rotate + +b.dataset.rot) % 360 + 360) % 360;
      flatPreview();
    });
    const rot = ov.querySelector("#flatRot"), str = ov.querySelector("#flatStr"), mono = ov.querySelector("#flatMono");
    const fine = () => { FLAT.fine = +rot.value; ov.querySelector("#flatRotV").textContent = rot.value + "°"; flatPreview(); };
    rot.oninput = fine;
    str.oninput = () => { FLAT.strength = +str.value; ov.querySelector("#flatStrV").textContent = str.value; flatPreview(); };
    mono.onchange = () => { FLAT.mono = mono.checked; flatPreview(); };
    flatPreview();
  }catch(e){ toast("사진을 열지 못했습니다 — " + e.message); }
}

let FLAT_BUSY = false, FLAT_AGAIN = false;
async function flatPreview(){
  if(!FLAT) return;
  if(FLAT_BUSY){ FLAT_AGAIN = true; return; }      /* 슬라이더를 끌면 요청이 쌓인다 — 한 번에 하나만 */
  FLAT_BUSY = true;
  try{
    const out = await flattenPhoto(FLAT.blob, {
      rotate: FLAT.rotate + (FLAT.fine || 0), strength: FLAT.strength, mono: FLAT.mono
    });
    FLAT.out = out;
    const img = document.getElementById("flatPrev");
    if(img){ if(img.src.startsWith("blob:")) URL.revokeObjectURL(img.src); img.src = URL.createObjectURL(out); }
  }catch(e){ toast("미리보기를 만들지 못했습니다 — " + e.message); }
  FLAT_BUSY = false;
  if(FLAT_AGAIN){ FLAT_AGAIN = false; flatPreview(); }
}

function noteFlatClose(){
  const img = document.getElementById("flatPrev");
  if(img?.src.startsWith("blob:")) URL.revokeObjectURL(img.src);
  document.getElementById("flatOv")?.remove();
  FLAT = null;
}

async function noteFlatSave(){
  if(!FLAT?.out) return;
  const { id, subjectId, box, out } = FLAT;
  toast("저장하는 중…");
  try{
    const path = `notes/flat/${id}_${Date.now()}.jpg`;
    const up = await sb.storage.from("qfig").upload(path, out, { contentType:"image/jpeg", upsert:true });
    if(up.error) throw up.error;
    const flat_url = sb.storage.from("qfig").getPublicUrl(path).data.publicUrl;
    const r = await sb.from("subject_notes").update({ flat_url }).eq("id", id);
    if(r.error) throw new Error(/flat_url|schema cache/i.test(r.error.message)
      ? "flat_url 칸이 아직 없습니다 — supabase-자료정리.sql 을 다시 돌려 주세요."

- HTML 태그를 쓰지 마라. <br> 은 특히 금지다.

  맨 아래에 "※ 흐려서 못 읽은 곳: (어디)" 로 남겨라. 지어내는 것이 가장 나쁘다.

/* ── 받은 글을 화면용으로 다듬는다 ──
   프롬프트로 아무리 막아도 모델은 \$CS_2\$ 나 <br> 을 섞어 보낸다.
   그래서 받는 쪽에서도 한 번 더 걸러 낸다. 프롬프트는 부탁이고, 이건 강제다. */
const SUB = { "0":"₀","1":"₁","2":"₂","3":"₃","4":"₄","5":"₅","6":"₆","7":"₇","8":"₈","9":"₉",
              "+":"₊","-":"₋","x":"ₓ","n":"ₙ" };
const SUP = { "0":"⁰","1":"¹","2":"²","3":"³","4":"⁴","5":"⁵","6":"⁶","7":"⁷","8":"⁸","9":"⁹",
              "+":"⁺","-":"⁻" };
const toMark = (str, map) => [...String(str)].map(c => map[c] || c).join("");

function cleanFix(txt){
  let t = String(txt || "").trim();
  t = t.replace(/^```(markdown|md)?\s*/i, "").replace(/```\s*$/, "");

  /* $ … $ 로 감싼 수식은 겉껍질만 벗긴다 — 어차피 안쪽은 화학식인 경우가 대부분이다 */
  t = t.replace(/\$\$?([^$\n]+?)\$\$?/g, "$1");

  /* _{12} · _2 → 아래첨자,  ^{2} · ^2 → 윗첨자 */
  t = t.replace(/_\{([^}]{1,6})\}/g, (_, g) => toMark(g, SUB))
       .replace(/_([0-9+\-xn])/g,    (_, g) => toMark(g, SUB))
       .replace(/\^\{([^}]{1,6})\}/g, (_, g) => toMark(g, SUP))
       .replace(/\^([0-9+\-])/g,      (_, g) => toMark(g, SUP));

  /* 남은 LaTeX 명령과 HTML 태그를 걷어낸다 */
  t = t.replace(/\\times/g, "×").replace(/\\cdot/g, "·")
       .replace(/\\left|\\right|\\mathrm|\\text/g, "")
       .replace(/<br\s*\/?>/gi, " / ")
       .replace(/<\/?[a-z][^>]*>/gi, "");

  /* 표 칸 안에 남은 파이프는 표를 깨뜨리므로 슬래시로 바꾼다 */
  t = t.split("\n").map(line => line.trim()).join("\n");
  return t.trim();
}

async function noteClean(id, subjectId, box){
  if(!needLogin()) return;
  const row = box.querySelector(`[data-note="${id}"]`);
  const slot = row?.querySelector("[data-cleanslot]");
  if(slot) slot.innerHTML = `<div class="wait">사진을 읽어 다시 옮겨 적는 중… 20~40초쯤 걸립니다.</div>`;

    const blob = await fetch(url).then(r => r.blob());
    if(blob.size > 5 * 1024 * 1024) throw new Error("사진이 너무 큽니다(5MB 초과)");

      : r.error.message);

/* ── 자료 확대·이동 ────────────────────────────────────────
   두 손가락으로 넓히고 좁히고, 넓힌 뒤에는 끌어서 아무 방향으로나 옮긴다.
   손가락이 하나뿐이면(마우스) 확대했을 때만 끌기로 잡는다 — 안 그러면
   보통 스크롤이 안 먹는다. 두 번 두드리면 처음으로 돌아온다. */
function attachNoteZoom(wrap){
  const stage = wrap.querySelector(".nz-stage");
  if(!stage || wrap.dataset.zon === "1") return;
  wrap.dataset.zon = "1";

  let k = 1, tx = 0, ty = 0;
  const pts = new Map();
  let start = null, lastTap = 0;

  const apply = () => {
    const zoomed = k > 1.01;
    if(!zoomed){ tx = 0; ty = 0; }
    else {
      /* 빈 곳이 보이지 않게 이동 범위를 눌러 준다 */
      const w = wrap.clientWidth, h = wrap.clientHeight;
      tx = Math.min(0, Math.max(w - stage.offsetWidth * k, tx));
      ty = Math.min(0, Math.max(h - stage.offsetHeight * k, ty));
    }
    stage.style.transform = `translate(${tx}px,${ty}px) scale(${k})`;
    wrap.classList.toggle("zoomed", zoomed);
    wrap.style.height = zoomed ? wrap.clientHeight + "px" : "";
    const lv = wrap.parentElement.querySelector(".lv");
    if(lv) lv.textContent = Math.round(k * 100) + "%";
  };

  const zoomTo = (nk, cx, cy) => {
    const b = wrap.getBoundingClientRect();
    const px = (cx ?? b.width / 2) - b.left, py = (cy ?? b.height / 2) - b.top;
    const old = k;
    k = Math.min(6, Math.max(1, nk));
    tx = px - (px - tx) * (k / old);
    ty = py - (py - ty) * (k / old);
    apply();
  };

  wrap.addEventListener("pointerdown", e => {
    pts.set(e.pointerId, { x:e.clientX, y:e.clientY });
    if(pts.size === 1){
      const now = Date.now();
      if(now - lastTap < 300){ k = k > 1.01 ? 1 : 2.4; zoomTo(k, e.clientX, e.clientY); lastTap = 0; return; }
      lastTap = now;
      if(k > 1.01){ start = { x:e.clientX, y:e.clientY, tx, ty }; wrap.setPointerCapture(e.pointerId); }
    } else if(pts.size === 2){
      const [a, b] = [...pts.values()];
      start = { d: Math.hypot(a.x-b.x, a.y-b.y), k, cx:(a.x+b.x)/2, cy:(a.y+b.y)/2 };
    }
  });

  wrap.addEventListener("pointermove", e => {
    if(!pts.has(e.pointerId)) return;
    pts.set(e.pointerId, { x:e.clientX, y:e.clientY });
    if(pts.size === 2 && start?.d){
      const [a, b] = [...pts.values()];
      const d = Math.hypot(a.x-b.x, a.y-b.y);
      zoomTo(start.k * (d / start.d), start.cx, start.cy);
      e.preventDefault();
    } else if(pts.size === 1 && start && k > 1.01){
      tx = start.tx + (e.clientX - start.x);
      ty = start.ty + (e.clientY - start.y);
      apply();
      e.preventDefault();
    }
  });

  const up = e => { pts.delete(e.pointerId); if(pts.size < 2) start = null; };
  ["pointerup","pointercancel","pointerleave"].forEach(t => wrap.addEventListener(t, up));

  wrap.addEventListener("wheel", e => {
    if(!e.ctrlKey && !e.metaKey) return;      /* 보통 스크롤은 그대로 둔다 */
    e.preventDefault();
    zoomTo(k * (e.deltaY < 0 ? 1.12 : 0.89), e.clientX, e.clientY);
  }, { passive:false });

  /* 단추 줄 — 손가락을 못 쓰는 환경과, 두 손가락이 어색한 분들을 위해 */
  const tools = document.createElement("div");
  tools.className = "nz-tools";
  tools.innerHTML = `<button class="zb" type="button" data-z="-">−</button>
    <span class="lv">100%</span>
    <button class="zb" type="button" data-z="+">+</button>
    <button class="zb" type="button" data-z="0">처음으로</button>
    <span class="sep"></span>
    <button class="zb" type="button" data-z="s-">가 작게</button>
    <button class="zb" type="button" data-z="s+">가 크게</button>`;
  wrap.after(tools);
  tools.addEventListener("click", e => {
    const t = e.target.closest("[data-z]"); if(!t) return;
    const cmd = t.dataset.z;
    if(cmd === "+") zoomTo(k * 1.35);
    else if(cmd === "-") zoomTo(k / 1.35);
    else if(cmd === "0") zoomTo(1);
    else {
      const cl = wrap.querySelector(".clean") || wrap.querySelector("img");
      if(!cl) return;
      const cur = parseFloat(getComputedStyle(cl).fontSize) || 14;
      cl.style.fontSize = Math.min(26, Math.max(10, cur + (cmd === "s+" ? 1.5 : -1.5))) + "px";
    }
  });
  if(!wrap.querySelector(".clean")) tools.querySelectorAll('[data-z^="s"]').forEach(b => b.remove());
  apply();
}

/* ── 옮긴 글 고치기 ──
   AI 가 옮긴 글에는 잘못 읽은 글자가 섞인다. 다시 옮기면 돈이 들고 결과가 또 달라지므로,
   틀린 곳만 손으로 고치는 길을 둔다. 표는 마크다운 문법 그대로 보여 준다. */
function editClean(id, subjectId, box, cur){
  const slot = box.querySelector(`[data-note="${id}"] [data-cleanslot]`);
  if(!slot || slot.querySelector("textarea")) return;
  const keep = slot.innerHTML;
  slot.innerHTML = `<textarea class="qtextedit" spellcheck="false"
      style="width:100%;min-height:260px;resize:vertical;display:block;font:400 12.5px/1.7 var(--font-m);
             color:var(--ink);background:var(--paper);border:1.4px solid var(--accent);
             border-radius:10px;padding:11px 12px;outline:0"></textarea>
    <div class="nbar">
      <button class="figbtn save" data-cok type="button">저장</button>
      <button class="figbtn" data-cno type="button">취소</button>
      <span class="fighint">표는 마크다운 그대로입니다. <b>Ctrl+Enter</b> 저장, <b>Esc</b> 취소</span>
    </div>`;
  const ta = slot.querySelector("textarea");
  ta.value = cur || "";
  ta.focus();

  const cancel = () => { slot.innerHTML = keep; slot.querySelectorAll("[data-nz]").forEach(attachNoteZoom); };
  const save = async () => {
    const val = ta.value;
    const btn = slot.querySelector("[data-cok]");
    btn.disabled = true; btn.textContent = "저장 중…";
    const r = await sb.from("subject_notes").update({ clean_md: val }).eq("id", id);
    if(r.error){ btn.disabled = false; btn.textContent = "저장"; return toast("저장하지 못했습니다 — " + r.error.message); }
    toast("글을 고쳤습니다.");
    drawNotes(subjectId, box);
  };
  slot.querySelector("[data-cno]").addEventListener("click", cancel);
  slot.querySelector("[data-cok]").addEventListener("click", save);
  ta.addEventListener("keydown", e => {
    if(e.key === "Escape"){ e.preventDefault(); cancel(); }
    else if(e.key === "Enter" && (e.ctrlKey || e.metaKey)){ e.preventDefault(); save(); }
  });
}

let NOTE_PASTE = null, NOTE_INPUT = null;
function notePick(subjectId, box, kind){
  if(!NOTE_INPUT){
    NOTE_INPUT = document.createElement("input");
    NOTE_INPUT.type = "file"; NOTE_INPUT.multiple = true;
    NOTE_INPUT.style.display = "none";
    document.body.appendChild(NOTE_INPUT);
  }
  NOTE_INPUT.value = "";
  NOTE_INPUT.accept = kind === "pdf" ? "application/pdf,.pdf" : "image/*";
  NOTE_INPUT.onchange = e => {
    const fs = [...e.target.files];
    if(fs.length) noteUpload(subjectId, box, fs);
  };
  NOTE_INPUT.click();
}

async function noteUpload(subjectId, box, files){
  toast(`${files.length}개를 올리는 중…`);
  const { data:last } = await sb.from("subject_notes")
    .select("sort_order").eq("subject_id", subjectId)
    .order("sort_order", { ascending:false }).limit(1);
  let order = (last?.[0]?.sort_order ?? 0) + 1;

  for(const f of files){
    try{
      const isPdf = /pdf$/i.test(f.type) || /\.pdf$/i.test(f.name);
      const blob = isPdf ? f : await figShrink(f, NOTE_MAX_W);
      const ext  = isPdf ? "pdf" : "jpg";
      const path = `notes/${subjectId}/${Date.now()}_${Math.random().toString(36).slice(2,7)}.${ext}`;
      const up = await sb.storage.from("qfig").upload(path, blob, {
        contentType: isPdf ? "application/pdf" : "image/jpeg", upsert:true });
      if(up.error) throw up.error;
      const url = sb.storage.from("qfig").getPublicUrl(path).data.publicUrl;
      const title = (f.name || "").replace(/\.[^.]+$/, "") || "붙여넣은 자료";
      const ins = await sb.from("subject_notes").insert({
        subject_id: subjectId, title, kind: isPdf ? "pdf" : "image",
        url, path, sort_order: order++ });
      if(ins.error) throw ins.error;
    }catch(e){
      toast(`"${f.name || "파일"}" 을 넣지 못했습니다 — ${e.message || e}`);
    }
  }
  toast("자료를 넣었습니다.");
  drawNotes(subjectId, box);
}

async function loadPins(subjectId){
  if(!subjectId){ S._pins = []; }
  else if(!S._pins || S._pinsFor !== subjectId){
    try{
      const { data, error } = await sb.from("subject_notes").select("*")
        .eq("subject_id", subjectId).eq("pinned", true).order("sort_order").order("id");

/* ═══════════════════════════════════════════════
   비전공자용 쉬운 풀이
   기존 해설은 "아는 사람에게 상기시키는" 글이라, 화학식이나 전기 공식이 처음이면
   어디서부터 막힌 건지조차 잡히지 않는다. 그래서 같은 문항을 처음 보는 사람 기준으로
   다시 풀어 쓴 글을 한 칸 더 붙인다. 자동 변환이 쓰는 서버를 그대로 부르고,
   한 번 만든 것은 DB에 남겨 두 번 만들지 않는다.
   ═══════════════════════════════════════════════ */
const AI_ENDPOINTS = [CFG.WORKER_URL, CFG.WORKER_BACKUP_URL].filter(Boolean);

/* 사진을 함께 보내는 호출. 워커는 Gemini 형식을 그대로 받으므로 inline_data 로 넣는다. */
async function askAIWithImage(prompt, blob, maxTokens = 4096){
  const b64 = await new Promise((res, rej) => {
    const r = new FileReader();
    r.onload = () => res(String(r.result).split(",")[1]);
    r.onerror = () => rej(new Error("사진을 읽지 못했습니다"));
    r.readAsDataURL(blob);
  });
  return askAI(prompt, maxTokens, [{ inline_data: { mime_type: blob.type || "image/jpeg", data: b64 } }]);
}

async function askAI(prompt, maxTokens = 2600, extraParts = []){
  if(!AI_ENDPOINTS.length) throw new Error("config.js 에 WORKER_URL 이 없습니다");
  const body = {
    contents: [{ role:"user", parts:[...extraParts, { text: prompt }] }],
    generationConfig: { temperature:0.35, maxOutputTokens:maxTokens }
  };
  let last = "";
  for(const base of AI_ENDPOINTS){
    const ac = new AbortController();
    const timer = setTimeout(() => ac.abort(), 150000);
    try{
      const res = await fetch(base.replace(/\/$/,"") + "/get-data", {
        method:"POST", headers:{ "Content-Type":"application/json" },
        body: JSON.stringify(body), signal: ac.signal });
      const d = await res.json();
      if(!res.ok){ last = d.detail || `HTTP ${res.status}`; continue; }
      const txt = d.candidates?.[0]?.content?.parts?.[0]?.text || "";
      if(txt.trim()) return txt.trim();
      last = "빈 응답이 왔습니다";
    }catch(e){
      last = e.name === "AbortError" ? "2분 30초 안에 응답이 없었습니다" : e.message;
    }finally{ clearTimeout(timer); }
  }
  throw new Error(last || "서버에 닿지 못했습니다");
}

function easyPrompt(q){
  const chs = (Array.isArray(q.choices) ? q.choices : [])
    .map((c, i) => `${i+1}) ${c}`).join("\n");
  return `너는 자격증 기출문제를 비전공자에게 설명하는 선생이다.

아래 문항에는 이미 해설이 붙어 있다. 그 해설은 <이미 아는 사람에게 상기시키는 글>이라,
배경 지식이 없는 사람은 어디서 막혔는지조차 모른다.
너의 일은 해설을 다시 쓰는 것이 아니라, <그 해설 바로 뒤에 이어 붙일 글>을 쓰는 것이다.
독자는 방금 위의 해설을 읽고 내려온 상태다. 그 사람에게 말을 건네듯 이어서 써라.

[과목] ${S.subject?.name || ""} ${q.subject_part || ""}
[문제] ${q.question_text || ""}
[보기]
${chs}
[정답] ${q.answer || "?"}번
[이미 붙어 있는 해설 — 이 내용을 되풀이하지 마라]
${(q.explanation_md || q.explanation_html || "").replace(/<[^>]+>/g, " ").slice(0, 1500)}

이어서 쓸 내용을 한국어 마크다운으로, 아래 흐름대로 써라.
제목은 ### 로 시작한다. 인사말이나 "위 해설에서 보듯" 같은 군더더기 없이 바로 본론으로 들어간다.

### 여기서 막혔다면
위 해설에서 그냥 지나간 용어를 골라, 하나씩 그 자리에서 뜻을 풀어 준다.
화학이면 그 물질이 무엇이고 어떤 성질 때문에 그렇게 분류되는지, 반응식이 나오면 좌변·우변이 각각 무슨 뜻인지.
전기면 그 공식이 왜 그렇게 생겼는지, 기호 하나하나가 무엇을 가리키고 단위가 무엇인지 표로 정리한다.

### 계산을 한 줄씩
해설이 한 줄로 건너뛴 계산을 걸음마다 끊어서 다시 보여 준다. 단위 환산이 있으면 그것도 한 줄로 따로 잡는다.
숫자를 어디서 가져왔는지 매번 밝힌다.

### 다른 보기는 왜 아닌가
정답이 아닌 보기를 각각. "틀렸다"로 끝내지 말고, 어떤 착각을 하면 그 보기를 고르게 되는지 짚어라.

### 이것만 외우면
다음에 비슷한 문제가 나왔을 때 알아보는 신호와, 외울 것 한두 줄.

규칙:
- 수식은 반드시 $ ... $ 로 감싼다. 예: $E^\\circ_{cell} = 0.34 - (-0.76)$
- 화학식도 수식으로 쓴다. 예: $\\mathrm{KClO_3}$
- 그림을 그리려 하지 말고 tikzpicture 같은 것은 절대 쓰지 마라.
- 이미 붙어 있는 해설에 있는 문장을 그대로 옮기지 마라. 그 해설이 생략한 것만 채워라.
- 압축해서 아는 척하지 말고, 길어져도 좋으니 끊어서 설명해라.
- 이 문항에 딱히 더 풀어 쓸 것이 없다면(단순 암기·법규 조항 등) 억지로 늘리지 말고
  "### 이것만 외우면" 한 토막만 써라.`;
}
