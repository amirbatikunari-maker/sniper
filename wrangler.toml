name = "sniper-ai"
main = "src/index.js"
compatibility_date = "2026-08-01"

# ── 여기 값은 «비밀이 아닌» 설정만 둡니다. API 키는 절대 여기 쓰지 마세요.
[vars]
# 이 Worker 를 부를 수 있는 주소 목록(쉼표로 구분).
# 비워 두면 전부 허용됩니다 — 개발이 끝나면 꼭 채워 두세요.
ALLOWED_ORIGINS = "https://gichul-viewer.pages.dev,https://sniper.pages.dev,http://localhost:8788,http://127.0.0.1:5500"

# ── 요금이 새지 않게 하는 자물쇠 ──────────────────────────────
# "1" 이면 Supabase 에 로그인한 사람만 AI 를 쓸 수 있습니다.
# Worker 가 Supabase 에 토큰을 직접 확인하므로, 브라우저를 조작해도 못 뚫습니다.
REQUIRE_AUTH = "1"

