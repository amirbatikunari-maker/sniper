<!DOCTYPE html>
<html lang="ko" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#F6F7F9">
<title>글쓰기 · sniper</title>
<link rel="icon" href="./icon.svg">
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/static/pretendard.css">
<link rel="stylesheet" href="./style.css">
<style>
/* ── 글쓰기 화면만의 모양 ─────────────────────────── */
.wbar{display:flex;gap:7px;align-items:center;flex-wrap:wrap;
  max-width:var(--maxw);margin:0 auto;padding:9px 16px}
.wstate{font:600 12px/1.3 var(--font);color:var(--ink-2);margin-left:auto;white-space:nowrap}
.wstate.saving{color:var(--accent)}
.wstate.dirty{color:var(--warn)}

#title{
  width:100%;border:0;outline:none;background:transparent;color:inherit;resize:none;overflow:hidden;
  font:800 27px/1.34 var(--font);letter-spacing:-.02em;margin:10px 0 6px;padding:0
}
#title::placeholder{color:var(--ink-3)}

.subbar{display:flex;gap:7px;flex-wrap:wrap;align-items:center;
  padding-bottom:14px;border-bottom:1px solid var(--rule);margin-bottom:8px}
.subbar select,.subbar input{
  padding:7px 11px;border-radius:9px;border:1px solid var(--rule);background:var(--card);
  color:inherit;font:500 13px/1.3 var(--font);outline:none}
.subbar input{flex:1;min-width:130px}

/* Editor.js 를 우리 색·글꼴에 맞춘다 */
#ed{min-height:52dvh}
.codex-editor{color:var(--ink)}
.ce-block__content,.ce-toolbar__content{max-width:100%!important}
.ce-paragraph,.ce-header{line-height:1.85}
.ce-header{font-weight:700;letter-spacing:-.01em}
.cdx-block{padding:.45em 0}
.ce-toolbar__plus,.ce-toolbar__settings-btn{color:var(--ink-2);background:var(--card);border:1px solid var(--rule)}
.ce-popover{background:var(--card);border-color:var(--rule);color:var(--ink)}
.ce-popover-item__title{color:var(--ink)}
.ce-popover-item:hover,.ce-popover-item--focused{background:var(--accent-soft)!important}
.ce-inline-toolbar{background:var(--card);border-color:var(--rule);color:var(--ink)}
.ce-inline-tool,.ce-conversion-toolbar{color:var(--ink);background:var(--card)}
.cdx-search-field{background:var(--paper);border-color:var(--rule);color:var(--ink)}
.cdx-input,.cdx-quote__text,.cdx-quote__caption{background:var(--paper)!important;border-color:var(--rule)!important;color:var(--ink)!important}
.ce-code__textarea,.cdx-input.image-tool__caption{background:var(--paper)!important;color:var(--ink)!important;border-color:var(--rule)!important}
.tc-wrap{--color-border:var(--rule);--color-background:var(--accent-soft)}
.cdx-marker{background:#fef08a;color:#111827}
html[data-theme="dark"] .cdx-marker{background:#78350f;color:#fef3c7}
.image-tool__image-picture{border-radius:12px}

/* AI 곁창 */
.aiSide{position:fixed;right:14px;bottom:calc(78px + env(safe-area-inset-bottom));z-index:70;
  display:flex;flex-direction:column;gap:6px;align-items:flex-end}
.aiSide button{padding:8px 13px;border-radius:999px;border:1px solid var(--rule);background:var(--card);
  color:var(--ink);font:600 12.5px/1.2 var(--font);cursor:pointer;box-shadow:var(--shadow);white-space:nowrap}
.aiSide button:active{background:var(--accent-soft)}
.aiSide.folded button:not(.aiToggle){display:none}

/* 에디터 도구 창(＋ 목록)이 열리면 떠 있는 단추들은 잠시 비켜 준다 */
body:has(.ce-popover--opened) .aiSide,
body:has(.ce-popover--opened) .aic-fab{ display:none }
.aiSide{z-index:60}
</style>
</head>
<body data-page="write">

<header class="top">
  <div class="wbar">
    <button class="ico" id="btnBack" title="나가기">←</button>
    <button class="btn ghost sm" id="btnDraft">초안으로 저장</button>
    <button class="btn sm" id="btnPub">공개하기</button>
    <button class="ico" id="btnMore" title="더보기">⋯</button>
    <span class="wstate" id="state">준비됨</span>
  </div>
</header>

<main class="wrap">
  <textarea id="title" rows="1" placeholder="제목을 쓰세요"></textarea>

  <div class="subbar">
    <select id="cat"><option value="">분류 없음</option></select>
    <input id="tags" placeholder="태그 · 쉼표로 구분">
    <button class="btn ghost sm" id="btnCover">표지 사진</button>
    <input type="file" id="coverFile" accept="image/*" hidden>
  </div>
  <div id="coverBox"></div>

  <div id="ed"></div>
</main>

<div class="aiSide folded" id="aiSide">
  <button class="aiToggle" id="aiToggle">AI 도움 ▾</button>
  <button data-ai="polish">문장 다듬기</button>
  <button data-ai="outline">뼈대 잡아 주기</button>
  <button data-ai="expand">이어서 써 주기</button>
  <button data-ai="title">제목 후보</button>
  <button data-ai="excerpt">한 줄 소개 만들기</button>
  <button data-ai="check">사실·오타 점검</button>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@editorjs/editorjs@2.30.7/dist/editorjs.umd.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@editorjs/header@2.8.7/dist/header.umd.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@editorjs/nested-list@1.4.3/dist/nested-list.umd.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@editorjs/checklist@1.6.0/dist/checklist.umd.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@editorjs/quote@2.7.2/dist/quote.umd.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@editorjs/code@2.9.0/dist/code.umd.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@editorjs/delimiter@1.4.2/dist/delimiter.umd.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@editorjs/table@2.4.1/dist/table.umd.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@editorjs/image@2.9.3/dist/image.umd.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@editorjs/warning@1.4.1/dist/warning.umd.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@editorjs/marker@1.4.0/dist/marker.umd.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@editorjs/inline-code@1.5.1/dist/inline-code.umd.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@editorjs/underline@1.1.0/dist/bundle.js"></script>
<script src="./config.js"></script>
<script src="./app.js"></script>
<script src="./ai-chat.js" defer></script>
<script src="./music.js" defer></script>
<script>
const { sb, $, $$, esc, toast, qs } = App;

let ED = null, POST = null, DIRTY = false, SAVING = false, COVER = null;
const POST_ID = qs("id");
const LOCAL = "blog:draft:" + (POST_ID || "new");

/* ── 시작 ───────────────────────────────────────────── */
(async function start(){
  await App.loadSettings();
  await App.refreshMe();

  if(!sb){ alert("config.js 의 Supabase 값이 비어 있습니다."); location.href = "./index.html"; return; }
  if(!App.canEdit()){
    App.loginBox();
    setState("로그인이 필요합니다");
    return;
  }

  wire();
  await loadCats();
  const data = await loadPost();
  await makeEditor(data);
  autoSaveLoop();
})();

function setState(t, cls=""){ const s = $("#state"); s.textContent = t; s.className = "wstate " + cls; }
function markDirty(){ if(!DIRTY){ DIRTY = true; setState("저장 안 됨", "dirty"); } }

/* ── 위쪽 단추 ─────────────────────────────────────── */
function wire(){
  $("#btnBack").onclick = async () => {
    if(DIRTY && !confirm("저장하지 않은 내용이 있습니다. 그냥 나갈까요?")) return;
    location.href = POST_ID ? "./post.html?id=" + POST_ID : "./index.html";
  };
  $("#btnDraft").onclick = () => save("draft");
  $("#btnPub").onclick   = () => save("published");
  $("#btnMore").onclick  = moreBox;

  const t = $("#title");
  t.addEventListener("input", () => {
    t.style.height = "auto"; t.style.height = t.scrollHeight + "px";
    markDirty();
  });
  t.addEventListener("keydown", e => {
    if(e.key === "Enter"){ e.preventDefault(); document.querySelector(".ce-paragraph")?.focus(); }
  });
  $("#tags").addEventListener("input", markDirty);
  $("#cat").addEventListener("change", markDirty);

  $("#btnCover").onclick = () => $("#coverFile").click();
  $("#coverFile").onchange = async e => {
    const f = e.target.files[0]; if(!f) return;
    try{
      setState("표지 올리는 중…", "saving");
      const { url } = await App.uploadImage(f, "cover");
      COVER = url; drawCover(); markDirty(); setState("저장 안 됨", "dirty");
    }catch(err){ toast(err.message, "err"); setState("표지 올리기 실패"); }
  };

  // Ctrl+S 로 저장
  document.addEventListener("keydown", e => {
    if((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "s"){
      e.preventDefault(); save(POST?.status === "published" ? "published" : "draft");
    }
  });

  window.addEventListener("beforeunload", e => { if(DIRTY){ e.preventDefault(); e.returnValue = ""; } });

  // AI 곁창
  $("#aiToggle").onclick = () => {
    const s = $("#aiSide");
    s.classList.toggle("folded");
    $("#aiToggle").textContent = s.classList.contains("folded") ? "AI 도움 ▾" : "AI 도움 ▴";
  };
  $$("[data-ai]").forEach(b => b.onclick = () => aiHelp(b.dataset.ai));
}

function drawCover(){
  $("#coverBox").innerHTML = COVER
    ? `<div style="position:relative;margin:0 0 14px">
         <img src="${esc(COVER)}" style="width:100%;border-radius:12px;display:block">
         <button class="btn ghost sm" id="coverDel"
                 style="position:absolute;right:8px;top:8px">표지 빼기</button>
       </div>` : "";
  $("#coverDel")?.addEventListener("click", () => { COVER = null; drawCover(); markDirty(); });
}

/* ── 카테고리 ──────────────────────────────────────── */
async function loadCats(){
  const { data } = await sb.from("blog_categories").select("id,name,emoji").order("sort_order");
  $("#cat").innerHTML = `<option value="">분류 없음</option>` +
    (data||[]).map(c => `<option value="${c.id}">${c.emoji?c.emoji+" ":""}${esc(c.name)}</option>`).join("");
}

/* ── 글 불러오기 ───────────────────────────────────── */
async function loadPost(){
  // 저장하다 만 게 브라우저에 남아 있으면 먼저 물어본다
  let local = null;
  try{ local = JSON.parse(localStorage.getItem(LOCAL) || "null"); }catch{}

  if(POST_ID){
    const { data, error } = await sb.from("blog_posts").select("*").eq("id", POST_ID).single();
    if(error || !data){ toast("글을 못 읽었습니다: " + (error?.message||""), "err"); return null; }
    POST = data;
    $("#title").value = data.title === "제목 없음" ? "" : data.title;
    $("#title").dispatchEvent(new Event("input"));
    $("#cat").value = data.category_id || "";
    $("#tags").value = (data.tags||[]).join(", ");
    COVER = data.cover_url || null; drawCover();

    if(local && local.at > new Date(data.updated_at).getTime() + 2000 &&
       confirm("이 기기에 더 최근에 쓰다 만 내용이 있습니다. 그걸 불러올까요?")){
      applyLocal(local);
      return local.body;
    }
    setState("불러옴");
    return data.body_json || htmlToBlocks(data.body_html);
  }

  if(local && confirm("쓰다 만 글이 있습니다. 이어서 쓸까요?")){
    applyLocal(local);
    return local.body;
  }
  setState("새 글");
  return null;
}

function applyLocal(local){
  $("#title").value = local.title || "";
  $("#title").dispatchEvent(new Event("input"));
  $("#cat").value = local.cat || "";
  $("#tags").value = local.tags || "";
  COVER = local.cover || null; drawCover();
  setState("이어서 쓰는 중", "dirty");
  DIRTY = true;
}

/* 예전에 HTML 로만 저장된 글도 열 수 있게 아주 단순히 옮겨 준다 */
function htmlToBlocks(html){
  if(!html) return null;
  const box = document.createElement("div");
  box.innerHTML = html;
  const blocks = [];
  for(const n of box.children){
    const tag = n.tagName.toLowerCase();
    if(/^h[2-4]$/.test(tag)) blocks.push({ type:"header", data:{ text:n.innerHTML, level:+tag[1] } });
    else if(tag === "ul" || tag === "ol")
      blocks.push({ type:"list", data:{ style: tag==="ol"?"ordered":"unordered",
        items:[...n.children].map(li => ({ content: li.innerHTML, items:[] })) } });
    else if(tag === "blockquote") blocks.push({ type:"quote", data:{ text:n.innerHTML, caption:"" } });
    else if(tag === "pre") blocks.push({ type:"code", data:{ code:n.textContent } });
    else if(tag === "hr") blocks.push({ type:"delimiter", data:{} });
    else if(tag === "figure"){
      const img = n.querySelector("img");
      if(img) blocks.push({ type:"image", data:{ file:{ url:img.src }, caption:n.querySelector("figcaption")?.textContent || "" } });
    }
    else blocks.push({ type:"paragraph", data:{ text:n.innerHTML } });
  }
  return { blocks };
}

/* ── 에디터 ────────────────────────────────────────── */
async function makeEditor(data){
  if(typeof EditorJS === "undefined"){
    $("#ed").innerHTML = `<div class="empty">에디터를 불러오지 못했습니다. 인터넷 연결을 확인하고 새로고침해 주세요.</div>`;
    return;
  }

  const uploader = {
    async uploadByFile(file){
      try{
        const { url } = await App.uploadImage(file, "posts");
        return { success:1, file:{ url } };
      }catch(e){ toast("그림 올리기 실패: " + e.message, "err"); return { success:0 }; }
    },
    async uploadByUrl(url){ return { success:1, file:{ url } }; },
  };

  ED = new EditorJS({
    holder: "ed",
    autofocus: !POST_ID,
    placeholder: "여기에 쓰세요. 왼쪽 ＋ 를 누르면 제목·목록·표·그림을 넣을 수 있습니다.",
    data: data || { blocks: [] },
    onChange: markDirty,
    tools: {
      header:     { class: Header, inlineToolbar:true, config:{ levels:[2,3,4], defaultLevel:2, placeholder:"소제목" } },
      list:       { class: NestedList, inlineToolbar:true, config:{ defaultStyle:"unordered" } },
      checklist:  { class: Checklist, inlineToolbar:true },
      quote:      { class: Quote, inlineToolbar:true, config:{ quotePlaceholder:"인용", captionPlaceholder:"출처" } },
      code:       { class: CodeTool, config:{ placeholder:"코드" } },
      delimiter:  Delimiter,
      table:      { class: Table, inlineToolbar:true, config:{ rows:2, cols:3 } },
      image:      { class: ImageTool, config:{ uploader, captionPlaceholder:"설명(선택)" } },
      warning:    { class: Warning, inlineToolbar:true, config:{ titlePlaceholder:"짚고 갈 것", messagePlaceholder:"내용" } },
      marker:     { class: Marker, shortcut:"CMD+SHIFT+M" },
      inlineCode: { class: InlineCode },
      underline:  { class: Underline },
    },
    i18n: {
      messages: {
        ui: {
          blockTunes:{ toggler:{ "Click to tune":"설정", "or drag to move":"또는 끌어서 옮기기" } },
          inlineToolbar:{ converter:{ "Convert to":"바꾸기" } },
          toolbar:{ toolbox:{ Add:"넣기", Filter:"찾기", "Nothing found":"없습니다" } },
          popover:{ Filter:"찾기", "Nothing found":"없습니다", "Convert to":"바꾸기" },
        },
        toolNames:{ Text:"본문", Heading:"제목", List:"목록", Checklist:"할 일", Quote:"인용",
          Code:"코드", Delimiter:"구분선", Table:"표", Image:"그림", Warning:"짚고 갈 것",
          Bold:"굵게", Italic:"기울임", Link:"링크", Marker:"형광펜", InlineCode:"코드 글자", Underline:"밑줄" },
        blockTunes:{ delete:{ Delete:"지우기", "Click to delete":"한 번 더 눌러 지우기" },
          moveUp:{ "Move up":"위로" }, moveDown:{ "Move down":"아래로" } },
      },
    },
  });

  await ED.isReady;
  setState(DIRTY ? "저장 안 됨" : "준비됨", DIRTY ? "dirty" : "");

  // 화면에 그림을 끌어다 놓거나 붙여넣으면 그대로 올라간다(Editor.js 기본 기능)
}

/* ── 저장 ──────────────────────────────────────────── */
async function collect(){
  const out = await ED.save();
  const title = $("#title").value.trim() || "제목 없음";
  const html = App.blocksToHtml(out);
  const text = App.blocksToText(out);
  return {
    title,
    body_json: out,
    body_html: html,
    body_text: text,
    excerpt: text.slice(0, 160),
    cover_url: COVER,
    category_id: $("#cat").value ? +$("#cat").value : null,
    tags: $("#tags").value.split(",").map(s => s.trim()).filter(Boolean).slice(0, 12),
  };
}

async function save(status){
  if(!ED || SAVING) return;
  SAVING = true;
  setState("저장 중…", "saving");
  try{
    const row = await collect();
    row.status = status;
    if(status === "published" && !POST?.published_at) row.published_at = new Date().toISOString();

    if(POST_ID){
      const { error } = await sb.from("blog_posts").update(row).eq("id", POST_ID);
      if(error) throw new Error(error.message);
      POST = { ...POST, ...row };
    }else{
      row.slug = App.slugify(row.title);
      row.author = App.me?.id || null;
      const { data, error } = await sb.from("blog_posts").insert(row).select("id,status,published_at").single();
      if(error) throw new Error(error.message);
      POST = data;
      history.replaceState(null, "", "./write.html?id=" + data.id);
    }

    DIRTY = false;
    try{ localStorage.removeItem(LOCAL); }catch{}
    setState(status === "published" ? "공개됨" : "초안 저장됨");
    toast(status === "published" ? "공개했습니다" : "초안으로 저장했습니다");

    if(status === "published")
      setTimeout(() => location.href = "./post.html?id=" + (POST_ID || POST.id), 700);
  }catch(e){
    setState("저장 실패", "dirty");
    toast(e.message, "err");
  }finally{ SAVING = false; }
}

/* 브라우저에 30초마다 한 벌 — 서버 저장을 잊고 창을 닫아도 살아남게 */
function autoSaveLoop(){
  setInterval(async () => {
    if(!ED || !DIRTY) return;
    try{
      const out = await ED.save();
      localStorage.setItem(LOCAL, JSON.stringify({
        at: Date.now(), title: $("#title").value, cat: $("#cat").value,
        tags: $("#tags").value, cover: COVER, body: out,
      }));
    }catch{}
  }, 30000);
}

/* ── 더보기 ────────────────────────────────────────── */
function moreBox(){
  const ov = document.createElement("div");
  ov.className = "ov";
  ov.innerHTML = `<div class="ovbox">
    <h3>이 글</h3>
    <div class="row" style="flex-direction:column;align-items:stretch;gap:8px">
      <button class="btn ghost" id="mPin">${POST?.pinned ? "📌 고정 풀기" : "📌 맨 위에 고정"}</button>
      <button class="btn ghost" id="mArch">📦 보관함으로</button>
      <button class="btn ghost" id="mHist">🕘 수정 이력</button>
      <button class="btn danger" id="mDel">🗑 이 글 지우기</button>
      <button class="btn ghost" id="mClose">닫기</button>
    </div>
  </div>`;
  document.body.appendChild(ov);
  ov.onclick = e => { if(e.target === ov) ov.remove(); };
  $("#mClose", ov).onclick = () => ov.remove();

  const need = () => { if(!POST_ID){ toast("먼저 한 번 저장해 주세요.", "err"); return false; } return true; };

  $("#mPin", ov).onclick = async () => {
    if(!need()) return;
    const v = !POST.pinned;
    const { error } = await sb.from("blog_posts").update({ pinned:v }).eq("id", POST_ID);
    if(error) return toast(error.message, "err");
    POST.pinned = v; ov.remove(); toast(v ? "맨 위에 고정했습니다" : "고정을 풀었습니다");
  };
  $("#mArch", ov).onclick = async () => {
    if(!need()) return;
    const { error } = await sb.from("blog_posts").update({ status:"archived" }).eq("id", POST_ID);
    if(error) return toast(error.message, "err");
    ov.remove(); toast("보관함으로 옮겼습니다"); setTimeout(()=>location.href="./index.html", 600);
  };
  $("#mHist", ov).onclick = () => { ov.remove(); location.href = "./post.html?id=" + POST_ID; };
  $("#mDel", ov).onclick = async () => {
    if(!need()) return;
    if(!confirm("정말 지웁니다. 되돌릴 수 없습니다.")) return;
    const { error } = await sb.from("blog_posts").delete().eq("id", POST_ID);
    if(error) return toast(error.message, "err");
    DIRTY = false;
    try{ localStorage.removeItem(LOCAL); }catch{}
    location.href = "./index.html";
  };
}

/* ── AI 도움 ───────────────────────────────────────── */
const AI_JOBS = {
  polish:  ["문장 다듬기", "아래 글의 뜻은 그대로 두고 문장만 다듬어 줘. 군더더기를 덜어내고 읽기 쉽게. 결과만 마크다운으로 줘."],
  outline: ["뼈대 잡기", "아래 내용을 바탕으로 이 글의 목차(소제목)를 짜 줘. 각 소제목마다 무엇을 쓸지 한 줄씩 붙여서."],
  expand:  ["이어서 쓰기", "아래 글을 자연스럽게 이어서 두세 문단 더 써 줘. 말투와 밀도를 맞춰서."],
  title:   ["제목 후보", "아래 글에 어울리는 제목을 5개 지어 줘. 낚시성 없이, 내용을 정확히 담아서."],
  excerpt: ["한 줄 소개", "아래 글을 목록에 보여 줄 한 줄 소개(80자 이내)로 만들어 줘. 3개 후보를 줘."],
  check:   ["점검", "아래 글에서 사실이 틀렸을 만한 곳, 앞뒤가 안 맞는 곳, 오타를 짚어 줘. 고칠 문장을 함께 제시해 줘."],
};

async function aiHelp(kind){
  if(!window.AIChat) return toast("AI 상자를 아직 못 불렀습니다.", "err");
  const [label, prompt] = AI_JOBS[kind];

  let text = "";
  try{ text = App.blocksToText(await ED.save()); }catch{}
  const title = $("#title").value.trim();

  window.AIChat.setContext({
    label: "글쓰기 · " + (title || "제목 없음"),
    text: `제목: ${title || "(아직 없음)"}\n\n본문:\n${text.slice(0, 12000) || "(아직 비어 있음)"}`,
    system: "사용자가 자기 블로그 글을 쓰는 중입니다. 아래가 지금까지 쓴 내용입니다. " +
            "고쳐 쓸 때는 사용자의 말투를 지키고, 없던 사실을 만들어 넣지 마세요. " +
            "답은 바로 붙여 넣을 수 있게 마크다운으로 주세요.",
  });
  window.AIChat.ask(prompt);
  toast(label + " — AI 창에서 결과를 확인하세요");
}
</script>
</body>
</html>
