<!DOCTYPE html>
<html lang="ko" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#F4F5F7">
<title>글쓰기 · sniper</title>
<link rel="icon" href="./icon.svg">
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/static/pretendard.css">
<link rel="stylesheet" href="./style.css">
<style>
/* ── 글쓰기 화면만의 모양 ──────────────────────────── */
.wbar{
  position:sticky;top:0;z-index:50;
  background:color-mix(in srgb, var(--paper) 90%, transparent);
  backdrop-filter:saturate(1.6) blur(10px);
  border-bottom:1px solid var(--rule)}
.wbarIn{display:flex;gap:7px;align-items:center;flex-wrap:wrap;
  max-width:1100px;margin:0 auto;padding:9px 16px}
.wstate{font:600 11.5px/1.3 var(--font);color:var(--ink-2);margin-left:auto;white-space:nowrap}
.wstate.saving{color:var(--accent)}
.wstate.dirty{color:var(--warn)}

/* 늘 보이는 도구 띠 */
.tools{
  position:sticky;top:51px;z-index:49;
  background:var(--card);border-bottom:1px solid var(--rule)}
.toolsIn{
  max-width:1100px;margin:0 auto;padding:6px 12px;
  display:flex;align-items:center;gap:2px;overflow-x:auto;scrollbar-width:none}
.toolsIn::-webkit-scrollbar{display:none}
.tool{
  flex:none;display:flex;flex-direction:column;align-items:center;gap:3px;
  min-width:46px;padding:5px 5px 4px;border:0;border-radius:8px;background:none;cursor:pointer;
  color:var(--ink-2);font:600 10px/1.2 var(--font);letter-spacing:-.01em}
.tool:hover{background:var(--accent-soft);color:var(--accent-ink)}
.tool svg{
  width:19px;height:19px;display:block;
  fill:none;stroke:currentColor;stroke-width:1.5;
  stroke-linecap:round;stroke-linejoin:round}
.toolSep{flex:none;width:1px;height:24px;background:var(--rule);margin:0 6px}

.wmain{max-width:var(--maxw);margin:0 auto;padding:14px 16px 120px}

#title{
  width:100%;border:0;outline:none;background:transparent;color:inherit;resize:none;overflow:hidden;
  font:800 26px/1.36 var(--font);letter-spacing:-.025em;margin:8px 0 6px;padding:0}
#title::placeholder{color:var(--ink-3)}

.subbar{display:flex;gap:6px;flex-wrap:wrap;align-items:center;
  padding-bottom:12px;border-bottom:1px solid var(--rule);margin-bottom:8px}
.subbar select,.subbar input{
  padding:6px 10px;border-radius:8px;border:1px solid var(--rule);background:var(--card);
  color:inherit;font:500 12.5px/1.3 var(--font);outline:none}
.subbar input{flex:1;min-width:130px}
.subbar select:focus,.subbar input:focus{border-color:var(--accent)}

/* Editor.js 를 우리 색·글꼴에 맞춘다 */
#ed{min-height:52dvh}
.codex-editor{color:var(--ink)}
.ce-block__content,.ce-toolbar__content{max-width:100%!important}
.ce-paragraph,.ce-header{line-height:1.82}
.ce-header{font-weight:700;letter-spacing:-.015em}
.cdx-block{padding:.4em 0}
.ce-toolbar__plus,.ce-toolbar__settings-btn{color:var(--ink-2);background:var(--card);border:1px solid var(--rule)}
.ce-popover{background:var(--card);border-color:var(--rule);color:var(--ink)}
.ce-popover-item__title{color:var(--ink)}
.ce-popover-item:hover,.ce-popover-item--focused{background:var(--accent-soft)!important}
.ce-inline-toolbar{background:var(--card);border-color:var(--rule);color:var(--ink)}
.ce-inline-tool,.ce-conversion-toolbar{color:var(--ink);background:var(--card)}
.cdx-search-field{background:var(--paper);border-color:var(--rule);color:var(--ink)}
.cdx-input,.cdx-quote__text,.cdx-quote__caption{background:var(--paper)!important;border-color:var(--rule)!important;color:var(--ink)!important}
.ce-code__textarea,.cdx-input.image-tool__caption{background:var(--paper)!important;color:var(--ink)!important;border-color:var(--rule)!important}
.tc-wrap{--color-border:var(--rule);--color-background:var(--accent-soft)}
.cdx-marker{background:#fef08a;color:#111827}
html[data-theme="dark"] .cdx-marker{background:#78350f;color:#fef3c7}
.image-tool__image-picture{border-radius:10px}
.cdx-attaches--with-file{background:var(--paper);border-color:var(--rule)}

/* 구분선 — Editor.js 기본은 «***» 라 글자처럼 보입니다. 실제 선으로 바꿉니다. */
#ed .ce-delimiter{padding:0;line-height:0;text-align:left}
#ed .ce-delimiter:before{
  content:"";display:block;height:1px;background:var(--rule);
  margin:16px 0;font-size:0;letter-spacing:0}
#ed .ce-delimiter:hover:before{background:var(--accent)}

/* 수식 블록 */
.mathBlock{border:1px solid var(--rule);border-radius:10px;overflow:hidden;background:var(--paper)}
.mathBlock textarea{
  width:100%;border:0;border-bottom:1px dashed var(--rule);background:transparent;color:inherit;
  font:500 13px/1.6 var(--font-m);padding:9px 12px;outline:none;resize:none;min-height:44px;display:block}
.mathPrev{padding:12px;text-align:center;min-height:38px;overflow-x:auto}
.mathPrev:empty::before{content:"위에 TeX 를 쓰면 여기에 그려집니다";color:var(--ink-3);font-size:12.5px}

/* AI 곁창 */
.aiSide{position:fixed;right:14px;bottom:calc(132px + env(safe-area-inset-bottom));z-index:70;
  display:flex;flex-direction:column;gap:5px;align-items:flex-end}
.aiSide button{padding:7px 12px;border-radius:999px;border:1px solid var(--rule);background:var(--card);
  color:var(--ink);font:600 12px/1.2 var(--font);cursor:pointer;box-shadow:var(--shadow-2);white-space:nowrap}
.aiSide button:hover{background:var(--accent-soft);border-color:var(--accent)}
.aiSide.folded button:not(.aiToggle){display:none}
body:has(.ce-popover--opened) .aiSide,
body:has(.ce-popover--opened) .aic-fab{display:none}
</style>
</head>
<body data-page="write">

<header class="wbar">
  <div class="wbarIn">
    <button class="ico" id="btnBack" title="나가기">←</button>
    <button class="btn ghost sm" id="btnDraft">초안 저장</button>
    <button class="btn sm" id="btnPub">게시</button>
    <button class="ico" id="btnMore" title="더보기">⋯</button>
    <span class="wstate" id="state">준비됨</span>
  </div>
</header>

<div class="tools">
  <div class="toolsIn" id="tools">
    <button class="tool" data-t="image" title="사진"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M3 5.5h14v9H3z"/><circle cx="7" cy="9" r="1.3"/><path d="M3 12.5 7.5 9l3 2.5L14 8.5l3 3"/></svg>사진</button>
    <button class="tool" data-t="embed" title="동영상"><svg viewBox="0 0 20 20" aria-hidden="true"><rect x="2.5" y="4" width="15" height="12" rx="2"/><path d="M8.5 7.8 13 10l-4.5 2.2z"/></svg>동영상</button>
    <button class="tool" data-t="attach" title="파일"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M14 6.5 8 12.5a2.6 2.6 0 0 0 3.7 3.7l6-6a4.3 4.3 0 0 0-6-6l-6 6a6 6 0 0 0 8.5 8.5l4.3-4.3"/></svg>파일</button>
    <span class="toolSep"></span>
    <button class="tool" data-t="header" title="제목"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M4 4v12M12 4v12M4 10h8"/><path d="M15 8.5h2V16"/></svg>제목</button>
    <button class="tool" data-t="list" title="목록"><svg viewBox="0 0 20 20" aria-hidden="true"><circle cx="4" cy="6" r="1"/><circle cx="4" cy="10" r="1"/><circle cx="4" cy="14" r="1"/><path d="M7.5 6H17M7.5 10H17M7.5 14H17"/></svg>목록</button>
    <button class="tool" data-t="checklist" title="할 일"><svg viewBox="0 0 20 20" aria-hidden="true"><rect x="2.5" y="3" width="6" height="6" rx="1.5"/><path d="M4.2 6 5.5 7.3 7 5.2"/><rect x="2.5" y="11" width="6" height="6" rx="1.5"/><path d="M11 6h6.5M11 14h6.5"/></svg>할 일</button>
    <button class="tool" data-t="quote" title="인용"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M8.2 6H4.3v4.2h2.4c0 1.8-.8 2.9-2.4 3.6M16.7 6h-3.9v4.2h2.4c0 1.8-.8 2.9-2.4 3.6"/></svg>인용</button>
    <button class="tool" data-t="delimiter" title="구분선"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M2.5 10h15"/><circle cx="10" cy="10" r="1.6"/></svg>구분선</button>
    <span class="toolSep"></span>
    <button class="tool" data-t="link" title="링크"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M8.6 11.4a3.4 3.4 0 0 0 4.8 0l2.4-2.4a3.4 3.4 0 0 0-4.8-4.8l-1.2 1.2"/><path d="M11.4 8.6a3.4 3.4 0 0 0-4.8 0l-2.4 2.4a3.4 3.4 0 0 0 4.8 4.8l1.2-1.2"/></svg>링크</button>
    <button class="tool" data-t="table" title="표"><svg viewBox="0 0 20 20" aria-hidden="true"><rect x="2.5" y="4" width="15" height="12" rx="1.5"/><path d="M2.5 8h15M2.5 12h15M8 4v12M13 4v12"/></svg>표</button>
    <button class="tool" data-t="math" title="수식"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M14.5 4.5h-9L10 10l-4.5 5.5h9"/></svg>수식</button>
    <button class="tool" data-t="code" title="코드"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M7 6 3 10l4 4M13 6l4 4-4 4"/></svg>코드</button>
    <button class="tool" data-t="warning" title="노트"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M10 3.5 18 16.5H2z"/><path d="M10 8v3.6M10 13.8v.4"/></svg>노트</button>
    <span class="toolSep"></span>
    <button class="tool" data-t="cover" title="표지"><svg viewBox="0 0 20 20" aria-hidden="true"><rect x="2.5" y="4.5" width="15" height="11" rx="1.5"/><path d="M2.5 12.5 6.6 9l3 2.6L13 8.6l4.5 4"/><circle cx="6.8" cy="7.6" r="1"/></svg>표지</button>
  </div>
</div>

<main class="wmain">
  <textarea id="title" rows="1" placeholder="제목을 쓰세요"></textarea>

  <div class="subbar">
    <select id="cat"><option value="">분류 없음</option></select>
    <input id="tags" placeholder="태그 · 쉼표로 구분">

  <button data-ai="outline">뼈대 잡아 주기</button>
  <button data-ai="expand">이어서 써 주기</button>
  <button data-ai="table">표로 정리</button>
  <button data-ai="title">제목 후보</button>
  <button data-ai="excerpt">한 줄 소개</button>
  <button data-ai="check">사실 점검</button>
</div>

<script src="https://cdn.jsdelivr.net/npm/@editorjs/delimiter@1.4.2/dist/delimiter.umd.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@editorjs/table@2.4.1/dist/table.umd.js"></script>

<script>
const { sb, $, $$, esc, toast, qs, ask } = App;

let ED = null, POST = null, DIRTY = false, SAVING = false, COVER = null;
const POST_ID = qs("id");
const LOCAL = "blog:draft:" + (POST_ID || "new");

/* ═══════════════ 수식 블록 ═══════════════
   Editor.js 에 기본 수식 도구가 없어서 직접 만들었습니다.
   TeX 를 위 칸에 쓰면 아래에 바로 그려집니다. */
class MathTool {
  static get toolbox(){ return { title:"수식", icon:'<span style="font-weight:700">√</span>' }; }
  static get isReadOnlySupported(){ return true; }
  constructor({ data }){ this.data = { tex: (data && data.tex) || "" }; }

  render(){
    const w = document.createElement("div");
    w.className = "mathBlock";
    this.ta = document.createElement("textarea");
    this.ta.placeholder = "TeX 로 쓰세요 — 예: Q = m\\,c\\,\\Delta T";
    this.ta.value = this.data.tex;
    this.prev = document.createElement("div");
    this.prev.className = "mathPrev";
    w.append(this.ta, this.prev);

    const grow = () => { this.ta.style.height = "auto"; this.ta.style.height = this.ta.scrollHeight + "px"; };
    const paint = async () => {
      this.data.tex = this.ta.value;
      const tex = this.ta.value.trim();
      if(!tex){ this.prev.innerHTML = ""; return; }
      try{
        const K = await App.loadKatex();
        K.render(tex, this.prev, { displayMode:true, throwOnError:false, errorColor:"#B91C1C" });
      }catch{ this.prev.textContent = tex; }
    };
    this.ta.addEventListener("input", () => { grow(); paint(); markDirty(); });
    this.ta.addEventListener("keydown", e => { if(e.key === "Enter") e.stopPropagation(); });
    setTimeout(() => { grow(); paint(); }, 0);
    return w;
  }
  save(){ return { tex: this.ta.value }; }
  static get sanitize(){ return { tex:false }; }
}

/* ── 시작 ───────────────────────────────────────────── */
(async function start(){
  await App.loadSettings();
  await App.refreshMe();

  if(!sb){ alert("config.js 의 Supabase 값이 비어 있습니다."); location.href = "./index.html"; return; }
  if(!App.canEdit()){
    App.loginBox();
    setState("로그인이 필요합니다");
    return;
  }

  wire();
  await loadCats();
  const data = await loadPost();
  await makeEditor(data);
  autoSaveLoop();
})();

function setState(t, cls=""){ const s = $("#state"); s.textContent = t; s.className = "wstate " + cls; }
function markDirty(){ if(!DIRTY){ DIRTY = true; setState("저장 안 됨", "dirty"); } }

/* 새 글이면 «게시», 이미 있는 글이면 «수정» */
function syncPubLabel(){
  $("#btnPub").textContent = POST_ID || POST?.id ? "수정" : "게시";
}

/* ── 위쪽 단추 ─────────────────────────────────────── */
function wire(){
  syncPubLabel();

  $("#btnBack").onclick = async () => {
    if(DIRTY && !(await ask("아직 저장하지 않았습니다", "지금 나가면 쓴 내용이 사라집니다.", "그냥 나가기", true))) return;
    location.href = POST_ID ? "./post.html?id=" + POST_ID : "./index.html";
  };
  $("#btnDraft").onclick = () => save("draft");
  $("#btnPub").onclick   = () => save("published");
  $("#btnMore").onclick  = moreBox;

  const t = $("#title");
  t.addEventListener("input", () => {
    t.style.height = "auto"; t.style.height = t.scrollHeight + "px";
    markDirty();
  });
  t.addEventListener("keydown", e => {
    if(e.key === "Enter"){ e.preventDefault(); document.querySelector(".ce-paragraph")?.focus(); }
  });
  $("#tags").addEventListener("input", markDirty);
  $("#cat").addEventListener("change", markDirty);

  $("#coverFile").onchange = async e => {
    const f = e.target.files[0]; if(!f) return;
    e.target.value = "";
    try{
      setState("표지 올리는 중…", "saving");
      const { url } = await App.uploadImage(f, "cover");
      COVER = url; drawCover(); markDirty(); setState("저장 안 됨", "dirty");
    }catch(err){ toast(err.message, "err"); setState("표지 올리기 실패"); }
  };

  document.addEventListener("keydown", e => {
    if((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "s"){
      e.preventDefault(); save(POST?.status === "published" ? "published" : "draft");
    }
  });

  window.addEventListener("beforeunload", e => { if(DIRTY){ e.preventDefault(); e.returnValue = ""; } });

  $("#aiToggle").onclick = () => {
    const s = $("#aiSide");
    s.classList.toggle("folded");
    $("#aiToggle").textContent = s.classList.contains("folded") ? "AI 도움 ▾" : "AI 도움 ▴";
  };
  $$("[data-ai]").forEach(b => b.onclick = () => aiHelp(b.dataset.ai));

  $$("#tools .tool").forEach(b => b.onclick = () => useTool(b.dataset.t));
}

function drawCover(){
  $("#coverBox").innerHTML = COVER
    ? `<div style="position:relative;margin:0 0 14px">
         <img src="${esc(COVER)}" style="width:100%;border-radius:10px;display:block">
         <button class="btn ghost sm" id="coverDel"
                 style="position:absolute;right:8px;top:8px">표지 빼기</button>
       </div>` : "";
  $("#coverDel")?.addEventListener("click", () => { COVER = null; drawCover(); markDirty(); });
}

/* ═══════════════ 도구 띠 ═══════════════ */

/* 지금 커서가 있는 자리 바로 뒤에 블록을 넣는다.
   지금 블록이 비어 있으면 그 자리를 대신 채운다. */
async function ins(type, data = {}){
  if(!ED) return;
  let i = 0, replace = false;
  try{
    i = ED.blocks.getCurrentBlockIndex();
    if(i < 0) i = ED.blocks.getBlocksCount() - 1;
    const cur = ED.blocks.getBlockByIndex(i);
    replace = !!(cur && cur.isEmpty);
  }catch{ i = ED.blocks.getBlocksCount() - 1; }
  const at = replace ? i : i + 1;
  await ED.blocks.insert(type, data, undefined, at, true, replace);
  markDirty();
}

async function useTool(kind){
  switch(kind){
    case "cover":     $("#coverFile").click(); return;
    case "image":     $("#pickImg").click();   return;
    case "attach":    $("#pickFile").click();  return;
    case "header":    return ins("header", { text:"", level:2 });
    case "list":      return ins("list", { style:"unordered", items:[{ content:"", items:[] }] });
    case "checklist": return ins("checklist", { items:[{ text:"", checked:false }] });
    case "quote":     return ins("quote", { text:"", caption:"" });
    case "delimiter": return ins("delimiter", {});
    case "table":     return ins("table", { withHeadings:true, content:[["",""],["",""]] });
    case "math":      return ins("math", { tex:"" });
    case "code":      return ins("code", { code:"" });
    case "warning":   return ins("warning", { title:"", message:"" });
    case "embed":     return embedBox();
    case "link":      return linkBox();
  }
}

/* 사진 고르기 */
$("#pickImg").onchange = async e => {
  const f = e.target.files[0]; e.target.value = "";
  if(!f) return;
  try{
    setState("사진 올리는 중…", "saving");
    const { url } = await App.uploadImage(f, "posts");
    await ins("image", { file:{ url }, caption:"", withBorder:false, withBackground:false, stretched:false });
    setState("저장 안 됨", "dirty");
  }catch(err){ toast("사진 올리기 실패: " + err.message, "err"); setState("저장 안 됨", "dirty"); }
};

/* 파일 붙이기 */
$("#pickFile").onchange = async e => {
  const f = e.target.files[0]; e.target.value = "";
  if(!f) return;
  if(f.size > 40 * 1024 * 1024) return toast("40MB 넘는 파일은 올릴 수 없습니다.", "err");
  try{
    setState("파일 올리는 중…", "saving");
    const info = await App.uploadFile(f, "files");

async function loadPost(){
  let local = null;
  try{ local = JSON.parse(localStorage.getItem(LOCAL) || "null"); }catch{}

  if(POST_ID){
    const { data, error } = await sb.from("blog_posts").select("*").eq("id", POST_ID).single();
    if(error || !data){ toast("글을 못 읽었습니다: " + (error?.message||""), "err"); return null; }
    POST = data;
    syncPubLabel();
    $("#title").value = data.title === "제목 없음" ? "" : data.title;
    $("#title").dispatchEvent(new Event("input"));
    $("#cat").value = data.category_id || "";
    $("#tags").value = (data.tags||[]).join(", ");
    COVER = data.cover_url || null; drawCover();

    if(local && local.at > new Date(data.updated_at).getTime() + 2000 &&
       await ask("더 최근에 쓰다 만 내용이 있습니다", "이 기기에 남아 있는 내용을 불러올까요?", "불러오기")){
      applyLocal(local);
      return local.body;
    }
    setState("불러옴");
    return data.body_json || htmlToBlocks(data.body_html);
  }

  if(local && await ask("쓰다 만 글이 있습니다", "이어서 쓸까요?", "이어 쓰기")){
    applyLocal(local);
    return local.body;
  }

function applyLocal(local){
  $("#title").value = local.title || "";
  $("#title").dispatchEvent(new Event("input"));

  $("#tags").value = local.tags || "";
  COVER = local.cover || null; drawCover();
  setState("이어서 쓰는 중", "dirty");
  DIRTY = true;
}

function htmlToBlocks(html){
  if(!html) return null;
  const box = document.createElement("div");
  box.innerHTML = html;
  const blocks = [];

  const eat = n => {
    const tag = n.tagName?.toLowerCase();
    if(!tag) return;

    if(/^h[1-6]$/.test(tag))
      return blocks.push({ type:"header", data:{ text:n.innerHTML, level: Math.min(Math.max(+tag[1],2),4) } });

    if(tag === "ul" && n.classList.contains("checklist"))
      return blocks.push({ type:"checklist", data:{ items:[...n.children].map(li => ({
        text: li.textContent.trim(), checked: li.classList.contains("done") })) } });

    if(tag === "ul" || tag === "ol")
      return blocks.push({ type:"list", data:{ style: tag==="ol"?"ordered":"unordered",
        items:[...n.children].map(li => ({ content: li.innerHTML, items:[] })) } });

    if(tag === "blockquote")
      return blocks.push({ type:"quote", data:{ text:n.innerHTML, caption:"" } });

    if(tag === "pre")
      return blocks.push({ type:"code", data:{ code:n.textContent } });

    if(tag === "hr") return blocks.push({ type:"delimiter", data:{} });

    if(n.classList?.contains("math") || n.dataset?.tex)
      return blocks.push({ type:"math", data:{ tex: n.dataset.tex || n.textContent } });

    if(tag === "table" || n.querySelector?.(":scope > table")){
      const tbl = tag === "table" ? n : n.querySelector(":scope > table");
      const rows = [...tbl.querySelectorAll("tr")].map(tr =>
        [...tr.children].map(td => td.innerHTML.trim()));
      if(rows.length)
        return blocks.push({ type:"table", data:{
          withHeadings: !!tbl.querySelector("thead"), content: rows } });
      return;
    }

    if(tag === "figure" || tag === "div"){
      const img = n.querySelector("img");
      if(img) return blocks.push({ type:"image", data:{ file:{ url:img.src },
        caption: n.querySelector("figcaption")?.textContent || "" } });
      const ifr = n.querySelector("iframe");
      if(ifr) return blocks.push({ type:"embed", data:{ service:"youtube",
        source: ifr.src, embed: ifr.src, width:580, height:320, caption:"" } });
      if(n.classList?.contains("callout"))
        return blocks.push({ type:"warning", data:{
          title: n.querySelector("b")?.textContent || "",
          message: n.querySelector("div")?.innerHTML || "" } });
      // 그 밖의 감싸는 상자는 안쪽을 훑는다
      if(n.children.length) return [...n.children].forEach(eat);
    }

    if(tag === "a" && n.classList.contains("attach"))
      return blocks.push({ type:"attaches", data:{ file:{ url:n.href,
        name: n.querySelector(".nm")?.textContent || "첨부" }, title: n.querySelector(".nm")?.textContent || "" } });

    if((n.textContent || "").trim() || n.querySelector?.("img"))
      blocks.push({ type:"paragraph", data:{ text:n.innerHTML } });
  };

  [...box.children].forEach(eat);
  return { blocks };
}

/* AI 창이 «본문에 넣기» 를 누를 때 부르는 창구 */
window.__blogInsertHtml = async (html) => {
  if(!ED) return false;
  const data = htmlToBlocks(html);
  if(!data?.blocks?.length) return false;
  let at = ED.blocks.getBlocksCount();
  for(const b of data.blocks){
    await ED.blocks.insert(b.type, b.data, undefined, at++, false);
  }
  markDirty();
  window.scrollTo({ top: document.body.scrollHeight, behavior:"smooth" });
  return true;
};

/* ── 저장 ──────────────────────────────────────────── */
async function collect(){
  const out = await ED.save();
  const title = $("#title").value.trim() || "제목 없음";
  const html = App.blocksToHtml(out);
  const text = App.blocksToText(out);
  return {
    title,
    body_json: out,
    body_html: html,
    body_text: text,
    excerpt: text.slice(0, 160),
    cover_url: COVER,
    category_id: $("#cat").value ? +$("#cat").value : null,
    tags: $("#tags").value.split(",").map(s => s.trim()).filter(Boolean).slice(0, 12),
  };
}

async function save(status){
  if(!ED || SAVING) return;
  SAVING = true;
  setState("저장 중…", "saving");
  try{
    const row = await collect();
    row.status = status;
    if(status === "published" && !POST?.published_at) row.published_at = new Date().toISOString();

    const id = POST_ID || POST?.id;
    if(id){
      const { error } = await sb.from("blog_posts").update(row).eq("id", id);
      if(error) throw new Error(error.message);
      POST = { ...POST, ...row, id };
    }else{
      row.slug = App.slugify(row.title);
      row.author = App.me?.id || null;
      const { data, error } = await sb.from("blog_posts").insert(row).select("id,status,published_at").single();
      if(error) throw new Error(error.message);
      POST = { ...row, ...data };
      history.replaceState(null, "", "./write.html?id=" + data.id);
      syncPubLabel();
    }

    DIRTY = false;
    try{ localStorage.removeItem(LOCAL); }catch{}
    setState(status === "published" ? "올렸습니다" : "초안 저장됨");
    toast(status === "published" ? (id ? "고쳤습니다" : "올렸습니다") : "초안으로 저장했습니다");

    if(status === "published")
      setTimeout(() => location.href = "./post.html?id=" + (POST_ID || POST.id), 650);
  }catch(e){
    setState("저장 실패", "dirty");
    toast(e.message, "err");
  }finally{ SAVING = false; }
}

function autoSaveLoop(){
  setInterval(async () => {
    if(!ED || !DIRTY) return;
    try{
      const out = await ED.save();
      localStorage.setItem(LOCAL, JSON.stringify({
        at: Date.now(), title: $("#title").value, cat: $("#cat").value,
        tags: $("#tags").value, cover: COVER, body: out,
      }));
    }catch{}
  }, 30000);
}

    DIRTY = false;

    if(!need()) return;

    if(!await ask("이 글을 지웁니다", "되돌릴 수 없습니다.", "지우기", true)) return;
    try{
      await App.deletePosts([id()]);
      DIRTY = false;
      try{ localStorage.removeItem(LOCAL); }catch{}
      location.href = "./index.html";
    }catch(e){ toast(e.message, "err"); }
  };
}
