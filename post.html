<!DOCTYPE html>
<html lang="ko" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#F4F5F7">
<title>sniper</title>
<link rel="icon" href="./icon.svg">
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/static/pretendard.css">
<link rel="stylesheet" href="./style.css">
</head>
<body data-page="post">

<header class="top">
  <div class="topin">
    <button class="ico" id="btnMenu" title="메뉴 열기">☰</button>
    <a class="brand" href="./index.html">
      <span id="siteTitle">sniper</span>
      <span id="siteTagline"></span>
    </a>
    <button class="ico" id="btnThemeM" title="밝게/어둡게">◐</button>
  </div>
</header>
<div class="sideScrim" id="scrim"></div>

<div class="shell">

  <aside class="side" id="side">
    <a class="brand" href="./index.html">
      <span id="siteTitle">sniper</span>
      <span id="siteTagline"></span>
    </a>
    <div class="profile" id="profile"></div>

    <button class="btn sideWrite" id="btnWriteSide">✎ 새 글 쓰기</button>

    <div class="sideHead">글 모음</div>
    <div class="navList">
      <a class="navItem" href="./index.html"><span class="nm">← 목록으로</span></a>
      <a class="navItem" href="./about.html"><span class="nm">소개</span></a>
    </div>

    <div class="sideHead">카테고리</div>
    <div class="navList" id="navCats"></div>

    <div class="sideFoot">
      <button class="ico" id="btnTheme" title="밝게/어둡게">◐</button>
      <button class="ico" id="btnShare" title="주소 복사">🔗</button>
      <button class="ico" id="btnHist" title="수정 이력" hidden>🕘</button>
      <button class="ico" id="btnDock" title="AI 를 오른쪽에 붙박이로">▤</button>
      <button class="btn ghost sm" id="btnUser" style="flex:1">로그인</button>
    </div>
  </aside>

  <main class="main post" id="main">
    <div class="mainIn" id="mainIn">
      <div class="skel" style="height:30px;margin-top:22px"></div>
      <div class="skel" style="height:200px"></div>
    </div>
    <footer class="madeby" id="madeby"></footer>
  </main>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="./config.js"></script>
<script src="./app.js"></script>
<script src="./ai-chat.js" defer></script>
<script src="./ai-plus.js" defer></script>
<script src="./music.js" defer></script>
<script>
const { sb, $, $$, esc, fmtDate, toast, qs, ask } = App;
let POST = null, CATS = [];

(async function start(){
  await App.loadSettings();
  await App.refreshMe();
  App.drawProfile();
  App.drawMadeBy();
  App.initDock();
  wire();

  const id = qs("id");
  if(!id){ $("#mainIn").innerHTML = `<div class="empty"><b>어떤 글인지 알 수 없습니다</b>
    <a href="./index.html">목록으로 →</a></div>`; return; }
  if(!sb){ $("#mainIn").innerHTML = `<div class="empty"><b>Supabase 설정이 비어 있습니다</b></div>`; return; }

  await load(id);
})();

function wire(){
  const openSide  = () => document.body.classList.add("sideOpen");
  const closeSide = () => document.body.classList.remove("sideOpen");
  $("#btnMenu").onclick = openSide;
  $("#scrim").onclick = closeSide;

  const flipTheme = () => {
    const n = App.settings.theme === "dark" ? "light" : "dark";
    App.saveSettings({ theme: n });
  };
  $("#btnTheme").onclick = flipTheme;
  $("#btnThemeM").onclick = flipTheme;

  $("#btnUser").onclick = () => App.loginBox();
  if(App.me) $("#btnUser").textContent = App.canEdit() ? "내 계정" : "권한 없음";
  $("#btnWriteSide").onclick = () => location.href = "./write.html";

  $("#btnShare").onclick = async () => {
    try{
      if(navigator.share) await navigator.share({ title: POST?.title || "sniper", url: location.href });
      else { await navigator.clipboard.writeText(location.href); toast("주소를 복사했습니다"); }
    }catch{}
  };
}

async function load(id){
  const [{ data:p, error }, { data:cats }] = await Promise.all([
    sb.from("blog_posts").select("*").eq("id", id).single(),
    sb.from("blog_categories").select("id,name,emoji,color,parent_id,sort_order"),
  ]);

  CATS = cats || [];
  $("#navCats").innerHTML = App.catTree(CATS).map(c =>
    `<a class="navItem" href="./index.html" data-depth="${c.depth}">
       <span class="dot" style="background:${esc(c.color||"#9CA3AF")}"></span>
       <span class="nm">${c.emoji?c.emoji+" ":""}${esc(c.name)}</span></a>`).join("");

  if(error || !p){
    $("#mainIn").innerHTML = `<div class="empty"><b>글을 찾지 못했습니다</b>
      ${esc(error?.message || "지워졌거나 아직 공개되지 않은 글일 수 있습니다.")}<br><br>
      <a href="./index.html">← 목록으로</a></div>`;
    return;
  }

  POST = p;
  document.title = p.title + " · " + (App.settings.title || "sniper");
  const c = CATS.find(x => x.id === p.category_id);
  const admin = App.canEdit();

  $("#mainIn").innerHTML = `
    <div class="postHead">
      ${p.cover_url ? `<img class="pcover" src="${esc(p.cover_url)}" alt="">` : ""}
      <h1>${esc(p.title)}</h1>
      <div class="pmeta">
        ${c ? `<span class="d" style="width:7px;height:7px;border-radius:50%;background:${esc(c.color||"#999")}"></span>
               <span>${c.emoji?c.emoji+" ":""}${esc(c.name)}</span>` : ""}
        <span class="num">${fmtDate(p.published_at || p.created_at)}</span>
        ${p.pinned ? `<span class="pin-b">고정</span>` : ""}
        ${p.status !== "published" ? `<span class="draft">${p.status==="draft"?"초안":"보관"}</span>` : ""}
        <span class="num" style="margin-left:auto">조회 ${p.view_count ?? 0}</span>
      </div>
    </div>

    <article class="body" id="body">${
      p.body_html || (p.body_json ? App.blocksToHtml(p.body_json) : "") ||
      "<p class='muted'>(내용이 비어 있습니다)</p>"}</article>

    ${(p.tags||[]).length ? `<div class="tags" style="margin-top:24px">${
      p.tags.map(t=>`<span class="tag">#${esc(t)}</span>`).join("")}</div>` : ""}

    <div class="postFoot">
      <button class="btn ghost" onclick="location.href='./index.html'">← 목록</button>
      <button class="btn ghost" id="askSum">AI 로 요약</button>
      <button class="btn ghost" id="askQ">이 글에 대해 묻기</button>
      <span style="margin-left:auto"></span>
      ${admin ? `
        <button class="btn ghost" id="btnPin">${p.pinned ? "고정 풀기" : "맨 위에 고정"}</button>
        <button class="btn" id="btnEdit">수정</button>
        <button class="btn danger ghost" id="btnDel">지우기</button>` : ""}
    </div>`;

  App.renderMath($("#body"));

  if(admin){
    $("#btnHist").hidden = false;
    $("#btnHist").onclick = () => histBox(p.id);
    $("#btnEdit").onclick = () => location.href = "./write.html?id=" + p.id;
    $("#btnDel").onclick = delPost;
    $("#btnPin").onclick = async () => {
      const v = !POST.pinned;
      const { error } = await sb.from("blog_posts").update({ pinned:v }).eq("id", p.id);
      if(error) return toast(error.message, "err");
      POST.pinned = v;
      $("#btnPin").textContent = v ? "고정 풀기" : "맨 위에 고정";
      toast(v ? "맨 위에 고정했습니다" : "고정을 풀었습니다");
    };
  }

  // AI 에게 "지금 이 글" 을 알려 준다
  const ready = setInterval(() => {
    if(!window.AIChat) return;
    clearInterval(ready);
    window.AIChat.setContext({
      label: p.title,
      text: `제목: ${p.title}\n\n${($("#body").innerText || "").slice(0, 12000)}`,
      system: "사용자가 자기 블로그 글을 읽고 있습니다. 아래 글 내용을 근거로 답하고, 글에 없는 내용을 지어내지 마세요.",
    });
  }, 200);

  $("#askSum").onclick = () => window.AIChat?.ask("이 글을 세 줄로 요약하고, 빠진 내용이나 더 넣으면 좋을 부분을 짚어 줘.");
  $("#askQ").onclick   = () => window.AIChat?.open();

  sb.rpc("blog_bump_view", { p_id: p.id }).catch(()=>{});
}

async function delPost(){
  const ok = await ask("이 글을 지웁니다", `«${esc(POST.title)}» — 되돌릴 수 없습니다.`, "지우기", true);
  if(!ok) return;
  try{
    await App.deletePosts([POST.id]);
    toast("지웠습니다");
    setTimeout(() => location.href = "./index.html", 500);
  }catch(e){ toast(e.message, "err"); }
}

/* ── 수정 이력 ─────────────────────────────────────── */
async function histBox(postId){
  const { data, error } = await sb.from("blog_revisions")
    .select("id,title,note,created_at").eq("post_id", postId)
    .order("created_at", { ascending:false }).limit(50);

  const ov = document.createElement("div");
  ov.className = "ov";
  ov.innerHTML = `<div class="ovbox">
    <h3>수정 이력</h3>
    ${error ? `<p class="err">${esc(error.message)}</p>` : ""}
    <div id="hl">${
      (data||[]).length
        ? data.map(r => `<div class="catRow">
            <div style="flex:1;min-width:0">
              <div style="font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(r.title||"제목 없음")}</div>
              <div class="muted sm">${new Date(r.created_at).toLocaleString("ko-KR")}${r.note?" · "+esc(r.note):""}</div>
            </div>
            <button class="btn ghost sm" data-see="${r.id}">보기</button>
            <button class="btn sm" data-back="${r.id}">되돌리기</button>
          </div>`).join("")
        : `<p class="muted">아직 저장된 이력이 없습니다. 글을 한 번 고쳐서 저장하면 여기에 쌓입니다.</p>`
    }</div>
    <div class="row" style="justify-content:flex-end;margin-top:14px">
      <button class="btn ghost" id="hClose">닫기</button></div>
  </div>`;
  document.body.appendChild(ov);
  ov.onclick = e => { if(e.target === ov) ov.remove(); };
  $("#hClose", ov).onclick = () => ov.remove();

  $$("[data-see]", ov).forEach(b => b.onclick = async () => {
    const { data:r } = await sb.from("blog_revisions").select("body_html,title").eq("id", b.dataset.see).single();
    if(!r) return;
    $("#body").innerHTML = r.body_html || "";
    App.renderMath($("#body"));
    toast("예전 모습을 보고 있습니다 — 새로고침하면 원래대로");
    ov.remove();
  });

  $$("[data-back]", ov).forEach(b => b.onclick = async () => {
    const ok = await ask("이 시점으로 되돌립니다", "지금 내용은 이력에 남습니다.", "되돌리기");
    if(!ok) return;
    const { data:r } = await sb.from("blog_revisions")
      .select("title,body_json,body_html,body_text").eq("id", b.dataset.back).single();
    if(!r) return;
    const { error } = await sb.from("blog_posts").update({
      title: r.title, body_json: r.body_json, body_html: r.body_html, body_text: r.body_text,
    }).eq("id", postId);
    if(error) return toast(error.message, "err");
    toast("되돌렸습니다");
    ov.remove();
    location.reload();
  });
}
</script>
</body>
</html>
